name: CI

on:
   push:
      branches: [neopi, nightly]
   pull_request:
      branches: [neopi, nightly, "nightly/**"]
      paths:
         - "packages/**"
         - "deck/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "packages/coding-agent/THIRD-PARTY-NOTICES.txt"
         - "packages/natives/THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         - ".github/**"
   # "Use workflow from" selects the exact branch/tag to compile; manual runs
   # always publish a stable release, including when selecting nightly.
   workflow_dispatch:

# Supersede stale PR heads. Nightly pushes share one group without cancellation:
# a running nightly build always finishes and publishes its prerelease, and only
# the newest waiting push replaces older waiting ones.
# Unique groups preserve every running and queued neopi push/manual release.
concurrency:
   group: "${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/nightly')) && github.ref || github.run_id }}"
   cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   # native_addons builds the pair TS jobs need; native_addons_cross builds the
   # rest. Together they must equal //:natives-all (checked in the cross job),
   # so a filegroup addition cannot silently skip both.
   NATIVES_X64_TARGETS: natives-linux-x64-baseline natives-linux-x64-modern
   NATIVES_CROSS_TARGETS: natives-darwin-arm64 natives-darwin-x64-baseline natives-linux-arm64 natives-linux-musl-arm64 natives-linux-musl-x64-baseline natives-win32-arm64 natives-win32-x64-baseline
   # Per-test wall-clock ceiling (seconds) for scripts/ci-test-ts.ts. omp-kata
   # runners with reclaim_guest_freed_memory (infra/tune-kata-runtime.sh) run
   # the SQLite/subprocess-heavy coding-agent suites 1.5-2x slower, which put
   # several cases (model-registry refresh, session fork, credential bridge)
   # over the 30 s default; 120 s still catches a real hang.
   OMP_TEST_TIMEOUT: "120"

permissions:
   contents: read

jobs:
   release_metadata:
      name: Resolve release metadata
      # Hosted, not omp-kata: this short version probe gates binary builds.
      runs-on: ubuntu-22.04
      outputs:
         github-release: ${{ steps.fork.outputs.is-release }}
         github-tag: ${{ steps.fork.outputs.release-tag }}
         github-channel: ${{ steps.fork.outputs.channel }}
      steps:
         - uses: actions/checkout@v4
         - name: Resolve append-only GitHub release tag
           id: fork
           if: github.event_name != 'pull_request'
           shell: bash
           run: |
              set -euo pipefail
              version=$(node -p "require('./packages/coding-agent/package.json').version")
              channel=stable
              release_tag="v${version}+build.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
              if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/nightly ]]; then
                channel=nightly
                release_tag="v${version}-nightly.${GITHUB_SHA:0:12}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
              fi
              {
                echo "is-release=true"
                echo "release-tag=$release_tag"
                echo "channel=$channel"
              } >> "$GITHUB_OUTPUT"

   check:
      name: Lint, type check & web build
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Verify Rust license compliance (cargo-deny 0.20.2)
           run: |
              # Prebuilt release binary checked against digests pinned here:
              # `cargo install` compiled cargo-deny from source on every run
              # (~135 s), and a .sha256 fetched from the same mutable release
              # would prove transport integrity only. Bump ver and both
              # digests together.
              ver=0.20.2
              case "$(uname -m)" in
                x86_64) arch=x86_64 sha=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f ;;
                aarch64|arm64) arch=aarch64 sha=995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d ;;
                *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
              esac
              name="cargo-deny-$ver-$arch-unknown-linux-musl"
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$ver/$name.tar.gz"
              echo "$sha  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
              tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
              mkdir -p "$HOME/.cargo/bin"
              install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
              # `--offline` needs every workspace crate already in the registry
              # cache. PR runs use a fresh GitHub-hosted runner (see runs-on
              # above) with no prior cargo work, so nothing populates the index
              # for our own graph and resolution fails. Non-PR events land on
              # omp-kata, whose Cargo cache is warm. Fetch first.
              cargo fetch --locked
              cargo deny --locked --offline check licenses sources
         - name: Check generated clippy config
           run: bun scripts/gen-clippy-bazelrc.ts --check
         - name: Type check workspace
           run: bun run ci:check:full
         - name: Build collab web
           run: bun run collab:web:build

   deck:
      name: Deck typecheck, web build & tests
      runs-on: ubuntu-24.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      env:
         NPI_DECK_BACKEND: ${{ github.workspace }}
         NODE_OPTIONS: --max-old-space-size=4096
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              fetch-depth: 0
              persist-credentials: false
         - name: Set deck state paths
           run: |
              # The runner context is not available in job-level env, so the
              # path that lives under runner.temp is exported here instead.
              echo "NPI_DECK_HOME=$RUNNER_TEMP/deck-home" >> "$GITHUB_ENV"
         - name: Select deck and backend changes
           id: changes
           shell: bash
           env:
              EVENT: ${{ github.event_name }}
              BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              HEAD: ${{ github.sha }}
           run: |
              set -euo pipefail
              selected=false
              if [[ "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
                selected=true
              else
                git diff --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/deck-changes"
                while IFS= read -r -d '' file; do
                  case "$file" in
                    deck/*|packages/coding-agent/*|packages/ai/*|packages/utils/*|packages/catalog/*|packages/agent/*|packages/tui/*|package.json|bun.lock|.github/workflows/ci.yml|.github/actions/*|.github/scripts/deck-*)
                      selected=true
                      ;;
                  esac
                done < "$RUNNER_TEMP/deck-changes"
              fi
              echo "selected=$selected" >> "$GITHUB_OUTPUT"
              if [[ "$selected" != true ]]; then
                echo "Deck checks skipped: no deck, imported backend, dependency or deck-CI changes." >> "$GITHUB_STEP_SUMMARY"
              fi
         - uses: ./.github/actions/bun-install
           if: steps.changes.outputs.selected == 'true'
         - uses: ./.github/actions/native-artifacts
           if: steps.changes.outputs.selected == 'true'
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Record and load the staged workspace native addon
           id: native
           if: steps.changes.outputs.selected == 'true'
           shell: bash
           run: |
              set -euo pipefail
              bun deck/scripts/native-addon.ts --built
              bun -e 'import "./packages/natives/native/index.js";'
         - name: Prepare and prove the Linux read-only sandbox
           id: sandbox
           if: steps.changes.outputs.selected == 'true'
           shell: bash
           run: |
              set -euo pipefail
              sudo apt-get update
              sudo apt-get install --yes bubblewrap
              bwrap --version
              id
              sysctl kernel.apparmor_restrict_unprivileged_userns || true
              sysctl kernel.unprivileged_userns_clone || true
              sysctl user.max_user_namespaces || true
              if [[ -r /sys/module/apparmor/parameters/enabled ]]; then cat /sys/module/apparmor/parameters/enabled; fi
              if [[ -r /proc/self/attr/current ]]; then cat /proc/self/attr/current; fi
              grep -E '^(Uid|Gid|CapEff|NoNewPrivs|Seccomp):' /proc/self/status || true
              # Ubuntu 24.04 restricts unprivileged user namespaces by default.
              # Relax runner policy, never the production sandbox command.
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
                echo "::warning::Could not relax AppArmor userns policy; the sandbox startup probe will report whether namespaces work."
              since="$(date --iso-8601=seconds)"
              status=0
              bun .github/scripts/deck-sandbox.ts || status=$?
              # A denial is not by itself proof of AppArmor. Keep kernel/audit
              # evidence on successful and failed startups, without filtering stderr.
              sudo journalctl --kernel --since "$since" --no-pager -n 100 || true
              if [[ "$status" != 0 ]]; then
                echo "Deck sandbox setup failed before tests. Inspect raw bwrap stderr and the namespace/security evidence above." >> "$GITHUB_STEP_SUMMARY"
              fi
              exit "$status"
         - name: Typecheck deck server, Telegram, protocol and web
           if: steps.changes.outputs.selected == 'true'
           run: bun deck/.github/scripts/typecheck.ts
         - name: Build deck web
           if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.sandbox.outcome == 'success' }}
           working-directory: deck/apps/web
           run: bun run build
         - name: Test deck workspaces
           id: tests
           # Independent evidence after compiler/build failures, but not after
           # an install, native artifact or sandbox setup failure.
           if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.sandbox.outcome == 'success' }}
           continue-on-error: true
           working-directory: deck
           env:
              FORCE_COLOR: "0"
              NO_COLOR: "1"
           shell: bash
           run: |
              set -euo pipefail
              bun test . ./.github/scripts 2>&1 | tee "$RUNNER_TEMP/deck-tests.log"
         - name: Report informational deck test counts and failing names
           if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
           run: bun .github/scripts/deck-test-summary.ts "${{ runner.temp }}/deck-tests.log" "${{ steps.tests.outcome }}"

   # native-artifacts rejects macOS/Windows targets on PRs; their producer only
   # publishes on non-PR runs. Keep these consumers nightly-only rather than
   # expanding native build cost and runner exposure for deck PRs.
   deck_platforms:
      name: "Deck checks: ${{ matrix.os }}"
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/nightly' && needs.native_addons_cross.result == 'success' }}
      needs: [native_addons_cross]
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: macos-15, native_targets: darwin-arm64 }
               - { os: windows-2025, native_targets: win32-x64-baseline }
      runs-on: ${{ matrix.os }}
      timeout-minutes: 40
      defaults:
         run:
            shell: bash
      env:
         NPI_DECK_BACKEND: ${{ github.workspace }}
         NODE_OPTIONS: --max-old-space-size=4096
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              persist-credentials: false
         - name: Set deck state paths
           run: |
              # The runner context is not available in job-level env, so the
              # paths that live under runner.temp are exported here instead.
              echo "NPI_DECK_HOME=$RUNNER_TEMP/deck-home" >> "$GITHUB_ENV"
              echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/deck-agent" >> "$GITHUB_ENV"
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Restore bun store
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - name: Install frozen workspace dependencies
           run: bun install --frozen-lockfile
         - name: Install the existing cross-platform native artifact
           uses: ./.github/actions/native-artifacts
           with:
              targets: ${{ matrix.native_targets }}
         - name: Record and load the staged workspace native addon
           id: native
           run: |
              set -euo pipefail
              bun deck/scripts/native-addon.ts --built
              bun -e 'import "./packages/natives/native/index.js";'
         - name: Typecheck deck server, Telegram, protocol and web
           run: bun deck/.github/scripts/typecheck.ts
         - name: Build deck web
           if: ${{ !cancelled() && steps.native.outcome == 'success' }}
           working-directory: deck/apps/web
           run: bun run build
         - name: Test deck workspaces
           id: tests
           if: ${{ !cancelled() && steps.native.outcome == 'success' }}
           continue-on-error: true
           working-directory: deck
           env:
              FORCE_COLOR: "0"
              NO_COLOR: "1"
           run: |
              set -euo pipefail
              bun test . ./.github/scripts 2>&1 | tee "$RUNNER_TEMP/deck-tests.log"
         - name: Report informational deck test counts and failing names
           if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
           run: bun .github/scripts/deck-test-summary.ts "${{ runner.temp }}/deck-tests.log" "${{ steps.tests.outcome }}"

   # MODULE.bazel.lock caches the crate_universe (@crates) extension result,
   # keyed by Cargo.toml/Cargo.lock/member-manifest hashes. While current, a
   # fresh bazel server skips the extension entirely; once stale, every bazel
   # job here re-runs `cargo-bazel splice` (~240 s each, CI run 36255186857).
   # Stale is slow, never wrong, so this job only makes drift visible — PRs
   # that touch Cargo files get told to run `bun run gen:bazel-lock`. The
   # check compares hashes only (no splice); on failure the job evaluates the
   # extension once and uploads the refreshed lockfile, so a contributor
   # without bazelisk can commit it as-is.
   bazel_lock:
      name: Check MODULE.bazel.lock freshness
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Check crate_universe entry
           run: bun scripts/gen-bazel-lock.ts --check
         - name: Refresh MODULE.bazel.lock
           if: failure()
           run: bun scripts/gen-bazel-lock.ts
         - name: Upload refreshed MODULE.bazel.lock
           if: failure()
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: MODULE.bazel.lock
              path: MODULE.bazel.lock

   # Rust validation (tests, clippy, rustfmt) runs on non-PR events only.
   # Native-changing PRs are rare enough that they do not warrant PR-side
   # Rust validation or a PR-side addon build (see native_addons): Rust is
   # validated post-merge on main (kata remote cache, warm) and again at
   # release. A skipped required check still satisfies branch protection.
   rust_validate:
      name: Validate Rust workspace (bazel)
      if: github.event_name != 'pull_request'
      runs-on: omp-kata
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - id: cache
           uses: ./.github/actions/bazel-cache
         - name: Rust tests
           # The ulimit guard runs in the step that launches the bazel server
           # (limits are per-process and the server persists across steps).
           run: |
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test //crates/...
         # Clippy scope mirrors `cargo clippy --workspace` (libraries only, no
         # test targets) plus the strict/default split: crates with
         # `[lints] workspace = true` get the workspace policy, except
         # brush-core (a vendored fork excluded from the Cargo task too).
         # pi-builtins allows every clippy group in its own manifest (ported
         # brush/uutils/jaq code) but is still held to zero rustc warnings;
         # Cargo honors that via `[lints]`, Bazel via the clippy-ported config.
         - name: Clippy (workspace lint policy on opted-in crates)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-strict --
         - name: Clippy (default lints elsewhere)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/... - (//crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...) - //crates/pi-builtins/... - //crates/vendor/brush-core/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy --
         - name: Clippy (manifest allows on ported pi-builtins)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-ported --
         - name: Rustfmt
           run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=rustfmt //crates/...

   # Provides the linux-x64 addon pair every downstream TS job installs.
   #
   # PRs never build. They restore the pair main built for the same native
   # sources from actions/cache (key = hash of every native build input:
   # toolchain and build settings plus crates/** and BUILD.bazel). With no
   # exact entry (the PR changes native inputs, or main has not built this
   # state yet) they take main's newest entry, and with no entry at all the
   # latest npm release. The workspace loader skips its version sentinel for
   # workspace loads, so any of these load under a newer checkout. Testing
   # against main's build instead of the last release keeps merged-but-
   # unreleased native fixes from failing every PR that did not touch Rust
   # (a merged grep fix plus its TS test failed 75 PR runs against the
   # 18.3.1 addon). Only main saves; see the save step for why.
   #
   # Main (kata, cluster remote cache) builds only the pair here so the TS
   # fan-out starts as soon as it links; native_addons_cross builds every
   # other target in parallel. Job name says "bazel" for continuity
   # with required checks.
   native_addons:
      name: Build native addons (bazel)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      # actions: write lets main prune superseded addon cache entries.
      permissions:
         contents: read
         actions: write
      outputs:
         # "<artifact-relative path>=<sha256>" pairs; kata consumers restore
         # these from the in-cluster stash (see native-artifacts).
         stash: ${{ steps.stage.outputs.stash }}
      steps:
         - uses: actions/checkout@v4
         - name: Compute native addon cache key
           id: natives-key
           shell: bash
           env:
              # Must stay identical on every event: PRs look up the entry main
              # saved for the same inputs.
              NATIVE_INPUTS_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
           run: |
              echo "prefix=natives-linux-x64-v1-" >> "$GITHUB_OUTPUT"
              echo "key=natives-linux-x64-v1-$NATIVE_INPUTS_HASH" >> "$GITHUB_OUTPUT"

         # ---- PR path: main-built addons from actions/cache, else npm ----
         # `ci-natives` is a plain workspace-relative path on purpose: the
         # cache version hashes the literal path list, so kata (save) and
         # hosted (restore) must spell it identically, and upload-artifact
         # skips dot-directories by default.
         - name: Restore main-built native addons
           id: natives-cache
           if: github.event_name == 'pull_request'
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
              restore-keys: |
                 ${{ steps.natives-key.outputs.prefix }}
         - name: Fetch release native addons (npm)
           if: github.event_name == 'pull_request' && steps.natives-cache.outputs.cache-matched-key == ''
           shell: bash
           run: |
              set -euo pipefail
              version="$(jq -r .version packages/natives/package.json)"
              tarball="$(npm view "@oh-my-pi/pi-natives-linux-x64@${version}" dist.tarball)"
              if [[ -z "$tarball" ]]; then
                echo "::error::@oh-my-pi/pi-natives-linux-x64@${version} is not published"
                exit 1
              fi
              echo "Fetching $tarball"
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
              mkdir -p ci-natives/natives-linux-x64-baseline ci-natives/natives-linux-x64-modern
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" ci-natives/natives-linux-x64-baseline/
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" ci-natives/natives-linux-x64-modern/
         # Make the addon source visible whenever it is not source-matched,
         # instead of leaving a reviewer to wonder which addons the tests ran.
         - name: Report native addon source
           if: github.event_name == 'pull_request'
           shell: bash
           env:
              EXACT: ${{ steps.natives-cache.outputs.cache-hit }}
              MATCHED: ${{ steps.natives-cache.outputs.cache-matched-key }}
           run: |
              if [ "$EXACT" = true ]; then
                echo "Using main's addons for this exact native source state ($MATCHED)."
              elif [ -n "$MATCHED" ]; then
                echo "::notice title=Native addons not source-matched::No main build matches this PR's native sources; testing against main's newest addon build ($MATCHED). Native changes are validated post-merge on main and at release."
              else
                echo "::notice title=Native addons from npm::No main-built addon cache entry is available; testing against the latest npm release addons."
              fi

         # ---- main path: bazel build of the linux-x64 pair ----
         - id: cache
           if: github.event_name != 'pull_request'
           uses: ./.github/actions/bazel-cache
         - name: Build linux-x64 native addons
           if: github.event_name != 'pull_request'
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # The addon cdylib links each peak at several GiB of rustc RSS;
              # building several addons in one invocation runs them
              # concurrently, which OOMs the kata pod and takes the bazel
              # server with it (exit 37 "Server terminated abruptly", runs
              # 30556752623 / 30557524371). Build one addon per invocation —
              # analysis and cached actions are shared through the persistent
              # server, so only the heavy links serialize.
              : > "$RUNNER_TEMP/bazel-build.log"
              for target in $NATIVES_X64_TARGETS; do
                bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build "//:$target" 2>&1 | tee -a "$RUNNER_TEMP/bazel-build.log"
              done
              for target in $NATIVES_X64_TARGETS; do
                mkdir -p "ci-natives/$target"
                cp -L bazel-bin/"$target"/*.node "ci-natives/$target/"
              done
         # Cache-hit visibility: a supposedly warm build that executes
         # thousands of actions is the failure mode that made CI slow — make
         # it visible in the run summary instead of discovering it weeks in.
         - name: Report bazel cache stats
           if: github.event_name != 'pull_request'
           shell: bash
           run: |
              # Bazel runs with --color=yes (config=ci); strip ANSI before
              # matching — escapes split "INFO:" from the process count in
              # the raw log.
              summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
              echo "::notice title=Bazel build summary::${summary:-no process summary found}"

         # ---- both paths ----
         # A corrupt download or cache entry must fail here, not as a
         # confusing dlopen error in every downstream test shard.
         - name: Smoke native addons
           shell: bash
           run: |
              set -euo pipefail
              # NOTE: `bun -e 'require("./x.node")'` swallows dlopen failures
              # (exit 0 on a bogus addon); a script file enforces them in
              # both bun and node. Verified against a corrupt .node fixture.
              cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
              for (const f of process.argv.slice(2)) {
               const m = require(f);
               if (!m || Object.keys(m).length === 0) {
               	console.error(`addon failed to load: ${f}`);
               	process.exit(1);
               }
              }
              EOF
              loader=node
              if command -v bun >/dev/null 2>&1; then loader=bun; fi
              "$loader" "$RUNNER_TEMP/smoke-addons.js" \
                "$PWD/ci-natives/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node" \
                "$PWD/ci-natives/natives-linux-x64-modern/pi_natives.linux-x64-modern.node"
         # Kata test jobs download ~120 MB of artifact over the node's NAT
         # egress (44-68 s per job, on the critical path). Every kata pod
         # mounts the shared runner-cache PVC at /opt/bazel-repo-cache (the
         # xwin cache already lives there), so stash the pair content-addressed
         # beside it; the native-artifacts action restores and re-verifies it
         # and falls back to the artifact on any miss. Best-effort: a stash
         # failure only costs consumers the download.
         - name: Stage native addons for consumers
           id: stage
           shell: bash
           run: |
              set -euo pipefail
              stash=""
              for f in ci-natives/natives-linux-x64-*/*.node; do
                sha="$(sha256sum "$f" | cut -d' ' -f1)"
                stash="$stash ${f#ci-natives/}=$sha"
              done
              echo "stash=${stash# }" >> "$GITHUB_OUTPUT"
              stash_dir=/opt/bazel-repo-cache/ci-natives
              if [ -z "${BAZEL_REMOTE_USER:-}" ] || [ ! -w /opt/bazel-repo-cache ]; then
                echo "No in-cluster stash on this runner; consumers download the artifact."
                exit 0
              fi
              if ! mkdir -p "$stash_dir"; then
                echo "::warning title=Native addon stash::cannot create $stash_dir; consumers will download the artifact"
                exit 0
              fi
              # Consumers of a run need its entries for minutes; two days
              # covers re-runs while bounding the PVC footprint.
              find "$stash_dir" -type f -mmin +2880 -delete 2>/dev/null || true
              for entry in ${stash# }; do
                rel="${entry%%=*}"
                sha="${entry##*=}"
                dest="$stash_dir/$sha.node"
                if [ -f "$dest" ]; then
                  touch "$dest"
                  continue
                fi
                tmp="$stash_dir/.$sha.$$.tmp"
                if cp "ci-natives/$rel" "$tmp" && mv -f "$tmp" "$dest"; then
                  echo "stashed $rel -> $dest"
                else
                  rm -f "$tmp"
                  echo "::warning title=Native addon stash::could not stash $rel; consumers will download the artifact"
                fi
              done
         # Only main saves: an entry saved on any other ref is readable by
         # that ref alone yet counts against the shared 10 GB repo quota,
         # whose LRU eviction has already cost the darwin release archives.
         # Probe first so an existing entry is not re-uploaded, then keep
         # only the newest two entries so the footprint stays ~100 MB.
         # The three steps below run only on main (never exercised by PR or
         # branch runs) and are pure optimization for later PRs: a failure
         # must never fail native_addons and with it every test job.
         - name: Probe native addon cache entry
           id: natives-cache-probe
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/neopi'
           continue-on-error: true
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
              lookup-only: true
         - name: Save native addon cache entry
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/neopi' && steps.natives-cache-probe.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
         - name: Prune superseded native addon cache entries
           if: github.event_name != 'pull_request' && github.ref == 'refs/heads/neopi' && steps.natives-cache-probe.outputs.cache-hit != 'true'
           continue-on-error: true
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              PREFIX: ${{ steps.natives-key.outputs.prefix }}
           run: |
              # Best-effort: a failed prune leaves eviction to GitHub's LRU.
              gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/neopi --key "$PREFIX" \
                  --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
                | while read -r id; do
                    gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
                  done || true

         - name: Upload linux-x64 native addon artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: natives-linux-x64
              path: ci-natives/natives-linux-x64-*/*.node
              if-no-files-found: error
              retention-days: 1

   # The remaining targets (darwin, arm64, musl and win32 cross builds). Only
   # release jobs consume them, so they build beside the TS fan-out instead of
   # ahead of it: serially after the pair they held every test job back ~10
   # min on native-changing main pushes. Non-PR only, like rust_validate;
   # the build also keeps the remote cache warm for release runs.
   native_addons_cross:
      name: Build native addons (bazel, cross targets)
      if: github.event_name != 'pull_request'
      runs-on: omp-kata
      steps:
         - uses: actions/checkout@v4
         - id: cache
           uses: ./.github/actions/bazel-cache
         - name: Build cross-target native addons
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # One addon per invocation, for the OOM reason in native_addons.
              : > "$RUNNER_TEMP/bazel-build.log"
              for target in $NATIVES_CROSS_TARGETS; do
                bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build "//:$target" 2>&1 | tee -a "$RUNNER_TEMP/bazel-build.log"
              done
         # The two jobs' target lists must together cover //:natives-all
         # exactly; a target added to the filegroup but to neither list would
         # otherwise silently never build or ship. cquery, not query: the rc's
         # --config=ci is defined for build only, which cquery inherits and
         # query rejects; this also reuses the warm server.
         - name: Check addon target lists cover natives-all
           run: |
              set -euo pipefail
              read -r -a listed <<< "$NATIVES_X64_TARGETS $NATIVES_CROSS_TARGETS"
              expected="$(printf '%s\n' "${listed[@]}" | sort)"
              actual="$(bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" cquery 'labels(srcs, //:natives-all)' 2>"$RUNNER_TEMP/query.err" | sed -E 's/ \(.*\)$//; s/.*://' | sort)" || {
                cat "$RUNNER_TEMP/query.err"
                exit 1
              }
              if [ "$expected" != "$actual" ]; then
                echo "::error title=Native addon target lists::NATIVES_X64_TARGETS + NATIVES_CROSS_TARGETS must equal //:natives-all srcs"
                diff <(echo "$expected") <(echo "$actual") || true
                exit 1
              fi
         - name: Verify Apple Foundation Models bridge
           run: |
              set -euo pipefail
              addon=bazel-bin/natives-darwin-arm64/pi_natives.darwin-arm64.node
              # The bridge is embedded as a separate dylib (module OmpAppleFm),
              # never linked: a linked Swift runtime crashes the addon on load
              # on older macOS.
              grep -aqF OmpAppleFm "$addon" ||
                 { echo "::error::Darwin arm64 addon was built without the Apple Foundation Models bridge"; exit 1; }
              dylibs="$(llvm-objdump --macho --dylibs-used "$addon")"
              if grep -E 'libswift|FoundationModels' <<< "$dylibs"; then
                 echo "::error::Darwin arm64 addon links the Swift runtime or FoundationModels directly"; exit 1
              fi
         - name: Report bazel cache stats
           shell: bash
           run: |
              summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
              echo "::notice title=Bazel build summary::${summary:-no process summary found}"
         # Everything except the linux-x64 pair, which native_addons ships as
         # its own small `natives-linux-x64` artifact.
         - name: Upload remaining native addon artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons
              path: |
                 bazel-bin/natives-*/*.node
                 !bazel-bin/natives-linux-x64-*/*.node
              if-no-files-found: error
              retention-days: 1

   test_coding_agent_native:
      name: "Test coding-agent native/unit (TS) ${{ matrix.shard }}"
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      # The longest PR job, so it runs as three shards on hosted PR runners
      # (two left the slower shard ~25 s behind every other job). Main keeps
      # one: omp-kata caps at 8 runners and the fan-out already fills it.
      # Declared first among the test jobs: when the 8-runner pool is full
      # the longest bucket should not be the one left queued (probe run
      # 36238796966 queued it 1.9 min behind the shorter buckets).
      # No required check keys on this job name (branch protection and
      # rulesets are off for main/omp2), so the per-shard names are safe.
      strategy:
         fail-fast: false
         matrix:
            shard: ${{ fromJSON(github.event_name == 'pull_request' && '["1/3","2/3","3/3"]' || '["1/1"]') }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent native/unit bucket
           env:
              OMP_TEST_CONCURRENCY: "4"
              OMP_TEST_SHARD: ${{ matrix.shard }}
           run: bun run ci:test:coding-agent:native

   test_workspace:
      name: Test TS workspace fast
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test workspace packages and repo scripts (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: |
              bun run ci:test:ts:workspace
              # Not `test:scripts`: scripts/install.test.ts fails on main
              # (its install.sh smoke-check executes a fake binary), so running
              # the whole group here would red this job on an unrelated break.
              bun test scripts/release.test.ts

   test_coding_agent_singleton:
      name: Test coding-agent singleton/global-state (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent singleton/global-state bucket
           # Keep global Settings/env/fake-timer tests serial; native addon
           # artifacts are still available like every other coding-agent bucket.
           run: bun run ci:test:coding-agent:singleton

   test_ts_native:
      name: Test TS native/integration packages
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test native/TUI/browser-ish packages (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:ts:native

   test_coding_agent_ui:
      name: Test coding-agent UI/TUI (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent UI/TUI bucket
           env:
              OMP_TEST_CONCURRENCY: "2"
           run: bun run ci:test:coding-agent:ui

   test_coding_agent_runtime:
      name: Test coding-agent runtime/session (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent runtime bucket
           # Runtime/session tests import native-backed barrels too; keep this
           # separate for concurrency, not as a native-free guardrail.
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:coding-agent:runtime

   test_smoke:
      name: Test CLI smoke (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: CLI smoke test
           run: bun run ci:test:smoke

   install_methods:
      name: Install method smoke tests
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'omp-kata' }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Install method smoke tests
           env:
              OMP_INSTALL_TEST_SKIP_NATIVE_BUILD: "1"
           run: bun run ci:test:install-methods


   # Builds (does not publish) every release binary on one Linux x64 image in
   # parallel with the test fan-out; the needs are the two native_addons jobs,
   # whose artifacts supply their addons. bun cross-compiles every target;
   # macOS binaries are Developer ID signed and notarized here too
   # (rcodesign). release_smoke then runs each binary on its own platform.
   # GitHub publishing waits only for the binary builds and platform smokes.
   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.github-release == 'true' && !cancelled() &&
         needs.native_addons.result == 'success' &&
         needs.native_addons_cross.result == 'success' }}
      needs: [release_metadata, native_addons, native_addons_cross]
      strategy:
         fail-fast: false
         matrix:
            include:
               # Addons cross-built by Bazel (clang + ld64.lld against the
               # Command Line Tools SDK) in native_addons_cross.
               - {
                    platform: darwin,
                    target_id: darwin-x64,
                    binary_path: packages/coding-agent/binaries/npi-darwin-x64,
                    native_targets: darwin-x64-baseline,
                 }
               - {
                    platform: darwin,
                    target_id: darwin-arm64,
                    binary_path: packages/coding-agent/binaries/npi-darwin-arm64,
                    native_targets: darwin-arm64,
                 }
               - {
                    platform: linux,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/npi-linux-x64,
                    native_targets: linux-x64-baseline linux-x64-modern,
                 }
               - {
                    platform: linux,
                    target_id: linux-musl-x64,
                    binary_path: packages/coding-agent/binaries/npi-linux-musl-x64,
                    native_targets: linux-musl-x64-baseline,
                 }
               - {
                    platform: linux,
                    target_id: linux-arm64,
                    binary_path: packages/coding-agent/binaries/npi-linux-arm64,
                    native_targets: linux-arm64,
                 }
               - {
                    platform: linux,
                    target_id: linux-musl-arm64,
                    binary_path: packages/coding-agent/binaries/npi-linux-musl-arm64,
                    native_targets: linux-musl-arm64,
                 }
               - {
                    platform: win32,
                    target_id: win32-x64,
                    binary_path: packages/coding-agent/binaries/npi-windows-x64.exe,
                    native_targets: win32-x64-baseline,
                 }
               # Addon cross-built by Bazel (clang-cl + xwin arm64 splat) in
               # native_addons_cross.
               - {
                    platform: win32,
                    target_id: win32-arm64,
                    binary_path: packages/coding-agent/binaries/npi-windows-arm64.exe,
                    native_targets: win32-arm64,
                 }
      runs-on: ubuntu-22.04
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         - name: Install prebuilt native addon(s)
           uses: ./.github/actions/native-artifacts
           with:
              targets: ${{ matrix.native_targets }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign macOS binary
           # Replaces bun's signature with a Developer ID + hardened-runtime one
           # carrying the required JIT, Apple Events, and library-validation
           # entitlements, then notarizes; ad hoc with the same entitlements
           # until the APPLE_* secrets are configured.
           if: matrix.platform == 'darwin'
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
         # Main-only save, after the build so it is off the leg's critical
         # path: caches saved on a tag or branch are readable only by that ref
         # yet count against the shared 10 GB repo cache quota.
         - name: Save bun store
           if: github.ref == 'refs/heads/neopi' && steps.bun-cache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

   # Every release binary is cross-built on Linux (release_binary); this runs
   # each one on its own platform before anything publishes: download the
   # artifact, then `--version` and `--smoke-test` in a throwaway home. macOS
   # legs first run Apple's own signature check, and launch under the final
   # signature (hardened runtime and entitlements included when signed). These
   # are the exact bytes release_github publishes, so no job re-verifies the
   # published assets.
   release_smoke:
      name: "Smoke release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.github-release == 'true' && !cancelled() &&
         needs.release_binary.result == 'success' }}
      needs: [release_metadata, release_binary]
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: ubuntu-22.04, target_id: linux-x64, binary: npi-linux-x64 }
               - { os: ubuntu-24.04-arm, target_id: linux-arm64, binary: npi-linux-arm64 }
               # musl binaries need the musl loader, which glibc runners lack:
               # they run in an Alpine container of the runner's arch.
               - { os: ubuntu-22.04, target_id: linux-musl-x64, binary: npi-linux-musl-x64, alpine: true }
               - { os: ubuntu-24.04-arm, target_id: linux-musl-arm64, binary: npi-linux-musl-arm64, alpine: true }
               - { os: macos-15-intel, target_id: darwin-x64, binary: npi-darwin-x64 }
               - { os: macos-15, target_id: darwin-arm64, binary: npi-darwin-arm64 }
               - { os: windows-2025, target_id: win32-x64, binary: npi-windows-x64.exe }
               - { os: windows-11-arm, target_id: win32-arm64, binary: npi-windows-arm64.exe }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: binaries
         - name: Smoke release binary
           if: runner.os != 'Windows' && !matrix.alpine
           env:
              BINARY: binaries/${{ matrix.binary }}
           run: |
              set -euo pipefail
              chmod +x "$BINARY"
              if [ "$RUNNER_OS" = macOS ]; then codesign --verify --strict --verbose=2 "$BINARY"; fi
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --smoke-test
         # ci-macos-sign.sh signs ad hoc whenever its step lacks the APPLE_*
         # credentials, so an ad-hoc binary while the secrets exist means they
         # stopped reaching it.
         - name: Assert Developer ID signature
           if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
           env:
              BINARY: binaries/${{ matrix.binary }}
           run: |
              info="$(codesign -dvvv "$BINARY" 2>&1)"
              echo "$info"
              if grep -qE "flags=.*adhoc|Signature=adhoc" <<< "$info"; then
                echo "::error::$BINARY is ad-hoc signed (Developer ID signing did not run)"
                exit 1
              fi
              # Informational: a bare (unstapled) Mach-O relies on the online
              # notarization ticket lookup, so surface the Gatekeeper result
              # without gating the release on it.
              spctl -a -t exec -vv "$BINARY" || echo "spctl non-zero (expected for unstapled bare binary; ticket served online)"
         - name: Smoke release binary (Alpine)
           if: matrix.alpine
           env:
              BINARY: binaries/${{ matrix.binary }}
           run: |
              chmod +x "$BINARY"
              # Bun's musl-target binaries link libstdc++/libgcc dynamically;
              # Alpine users install them alongside the binary (same as bun itself).
              docker run --rm -v "$(realpath "$BINARY"):/usr/local/bin/npi:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" npi --version
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" npi --smoke-test
              '
         - name: Smoke release binary (Windows)
           if: runner.os == 'Windows'
           shell: pwsh
           env:
              BINARY: binaries/${{ matrix.binary }}
           run: |
              $runtimeDir = Join-Path $env:RUNNER_TEMP "omp-smoke"
              $env:HOME = Join-Path $runtimeDir "home"
              $env:USERPROFILE = $env:HOME
              $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
              $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
              New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
              & $env:BINARY --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $env:BINARY --smoke-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


   release_github:
      name: Publish GitHub release
      if: ${{ needs.release_metadata.outputs.github-release == 'true' && !cancelled() &&
         needs.release_binary.result == 'success' &&
         needs.release_smoke.result == 'success' }}
      needs: [release_metadata, release_binary, release_smoke]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         # Dependency-free build (bun APIs + zip only), so no `bun install`
         # is needed on this runner.
         - name: Build browser relay artifacts
           run: bun run --cwd packages/browser-relay build
         - name: Stage component legal notices
           run: |
              mkdir -p release-legal
              cp packages/coding-agent/THIRD-PARTY-NOTICES.txt release-legal/npi-THIRD-PARTY-NOTICES.txt
              cp packages/natives/THIRD-PARTY-NOTICES.txt release-legal/npi-natives-THIRD-PARTY-NOTICES.txt
         # Generated after every other release asset is in place and before
         # the release is created, so SHA256SUMS.txt itself ships as an asset
         # and covers every other file uploaded alongside it.
         - name: Generate checksums
           run: |
              bun run ci:release:checksums SHA256SUMS.txt \
                packages/coding-agent/binaries/npi-* \
                packages/browser-relay/dist/npi-browser-relay-extension.zip \
                LICENSE \
                release-legal/*.txt
         - name: Create GitHub release without replacing existing releases
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              RELEASE_TAG: ${{ needs.release_metadata.outputs.github-tag }}
              RELEASE_CHANNEL: ${{ needs.release_metadata.outputs.github-channel }}
           run: |
              set -euo pipefail
              existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
              if [[ -n "$existing" ]]; then
                echo "::error::Release tag already exists: $RELEASE_TAG"
                exit 1
              fi
              args=(--target "$GITHUB_SHA" --title "NeoPi $RELEASE_TAG" --generate-notes)
              if [[ "$RELEASE_CHANNEL" == nightly ]]; then
                args+=(--prerelease --latest=false)
              else
                args+=(--latest)
              fi
              gh release create "$RELEASE_TAG" "${args[@]}" \
                packages/coding-agent/binaries/npi-* \
                packages/browser-relay/dist/npi-browser-relay-extension.zip \
                LICENSE release-legal/*.txt SHA256SUMS.txt

