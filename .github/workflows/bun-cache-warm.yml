name: Warm bun store cache

# Produces the shared `bun-<os>-<lockhash>` store entry PR jobs restore. PR jobs
# restore it but never save (per-PR-ref copies of the ~500 MB store once ate
# ~9.4 GB of the 10 GB repo cache quota). The composite action saves only on
# neopi, the default promoted branch whose cache PRs can restore. This hosted
# producer warms it when a promoted dependency snapshot changes; nightly
# self-hosted jobs also retain their bind-mounted Bun store.

on:
   push:
      branches: [neopi]
      paths:
         - "bun.lock"
         - ".github/actions/bun-install/**"
         - ".github/workflows/bun-cache-warm.yml"
   workflow_dispatch:

permissions:
   contents: read

# No cancel-in-progress: a cancelled warm saves nothing. Superseded queued runs
# still collapse to the newest one.
concurrency:
   group: bun-cache-warm
   cancel-in-progress: false

jobs:
   warm_bun:
      name: Seed bun store cache
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
