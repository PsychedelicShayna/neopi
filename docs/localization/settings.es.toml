"setting.tui.codexResetFireworks.label" = "Fuegos artificiales por reinicio de Codex"
"setting.tui.codexResetFireworks.description" = "Celebra los reinicios semanales no programados de uso de Codex y los reinicios guardados recién acumulados con una superposición de fuegos artificiales en el tercio superior que permanece hasta {escape_key}"
"setting.tui.titleState.label" = "Estado de ejecución en el título de la terminal"
"setting.tui.titleState.description" = "Muestra el estado de ejecución del agente en el separador del título de la terminal: un indicador animado mientras trabaja (un ':' estático en WSL), '>' cuando es tu turno y '!' cuando el agente espera tu respuesta"
"setting.tui.mouse.label" = "Enfocar con clic del mouse"
"setting.tui.mouse.description" = "Captura los clics del mouse en la sesión principal para enfocar las tarjetas de subagentes activos y las filas del HUD al hacer clic, con resaltado al pasar sobre el objetivo; los clics en enlaces de extensiones llegan a su extensión (la tecla de pistas de enlaces permite elegirlos sin mouse). Mientras está activo, la selección nativa de texto pasa a ser {shift_key}+arrastrar y el desplazamiento con rueda pasa a ser {shift_key}+rueda"
"setting.display.pinnedAgents.label" = "Agentes fijados"
"setting.display.pinnedAgents.description" = "Lista fijada para ir a agentes activos encima del editor (off la oculta; collapsed muestra algunas filas con un control para expandir; full muestra todos)"
"setting.display.advisorCollapsedLines.label" = "Líneas de asesor contraído"
"setting.display.advisorCollapsedLines.description" = "Máximo de líneas de notas que muestra una tarjeta de asesor contraída debajo de su encabezado (0 conserva la vista previa completa; expande con el control de salida de herramientas)"
"setting.tui.vimMode.description" = "Edición modal del prompt. {escape_key} sale del modo Insert; el modo Normal incluye hjkl, 0, $, ^, w, b, e, gg, G, recuentos, x/D/C, dd/yy, p y u; los operadores admiten movimientos u objetos de texto (diw, ca(, dap); v/V inician una selección Visual que y copia y d elimina"
"setting.composer.recallClearedDrafts.label" = "Recuperar borradores borrados"
"setting.composer.recallClearedDrafts.description" = "Conserva los borradores borrados con {clear_key} en el historial local de {history_keys} hasta salir; desactivarlo afecta los borrados posteriores"
"setting.doubleEscapeAction.label" = "Acción de Escape doble"
"setting.doubleEscapeAction.description" = "Qué sucede al presionar {escape_key} dos veces con el editor vacío: abrir el selector para retroceder la transcripción, abrir el árbol de sesión o no hacer nada"
"setting.spelling.autocomplete.description" = "Muestra predicciones de palabras como sugerencias en línea: {tab_key} acepta con un espacio y {right_key} sin él"
"setting.composer.predictions.description" = "Después de un turno completado, pide al modelo activo que prediga tu siguiente mensaje y lo muestra como texto fantasma en el editor vacío; {tab_key} o {right_key} lo inserta sin enviarlo. Uso adicional: cada turno completado envía otra solicitud facturada con toda la conversación (contabilizada en /stats)"

