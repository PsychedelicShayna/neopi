# Review draft only; not connected to runtime localization.
# Keys identify UI context. Source expressions inside ${...} are preserved verbatim;
# they are not a proposed interpolation API. Terminology marked REVIEW needs discussion.
# Coverage is partial: interactive-mode and controller inventories contain further
# conditional, dynamically assembled, and command-related messages; controller
# scans were capped per file. Component/chrome/status-line scans can miss lowercase,
# generated, native accessibility and callback-provided copy. No exhaustiveness claim.
# Embedded English plural expressions in translated values require runtime-aware review.

