# Borrador para revisión; no está conectado a la localización en ejecución.
# Las expresiones ${...} se conservan literalmente; no definen una API de interpolación.
# REVIEW indica vocabulario pendiente de discusión con la persona usuaria.
# Cobertura parcial: quedan mensajes condicionales, compuestos dinámicamente y
# relacionados con comandos en interactive-mode y sus controladores; la búsqueda
# tuvo un límite por archivo. Pueden faltar textos en minúsculas, generados, de
# accesibilidad nativa o suministrados por callbacks en componentes, chrome y status-line.
# Las expresiones de plural en inglés requieren revisión con la implementación.

