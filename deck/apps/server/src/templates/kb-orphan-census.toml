name = "kb-orphan-census"
description = "Every Monday, list the KB notes nothing links to in one inbox item for review. Honours .kbignore; never edits the KB."
concurrency = "skip"
tags = [ "kb", "maintenance", "weekly" ]

[[trigger]]
cron = "0 9 * * 1"

[budget]
max_duration_secs = 120
max_llm_cost_usd = 0

[[steps]]
id = "census"
type = "deck"
action = "kb_orphan_census"
limit = 200

[[steps]]
id = "open_reports"
type = "deck"
when = "steps.census.json.orphanCount > 0"
action = "list_inbox"
kind = "investigation"

[[steps]]
id = "report"
type = "transform"
when = "steps.census.json.orphanCount > 0"
body = "const open = (steps.open_reports.json || []).some((i) => i.source === \"routine:kb-orphan-census\");\nif (open) return null;\nconst c = steps.census.json;\nconst stem = (p) => p.split(\"/\").pop().replace(/\\.md$/i, \"\").toLowerCase();\nconst line = (o) => \"- `\" + o.path + \"`\" + (o.title.toLowerCase() !== stem(o.path) ? \" - \" + o.title : \"\");\nconst isolated = c.orphans.filter((o) => o.outbound === 0);\nconst linking = c.orphans.filter((o) => o.outbound > 0);\nconst out = [\n  c.orphanCount + \" of \" + c.notes + \" notes under `\" + c.root + \"` have no backlinks from another note.\",\n  \"\",\n  \"For each one: link it from a hub or a related note, list it in `.kbignore`, or delete it.\",\n];\nif (isolated.length > 0) out.push(\"\", \"## Isolated: no links in or out (\" + isolated.length + (c.truncated ? \" listed\" : \"\") + \")\", \"\", ...isolated.map(line));\nif (linking.length > 0) out.push(\"\", \"## Links out, but nothing links in (\" + linking.length + (c.truncated ? \" listed\" : \"\") + \")\", \"\", ...linking.map(line));\nif (c.truncated) out.push(\"\", \"_Listing the first \" + c.orphans.length + \" of \" + c.orphanCount + \" orphans by path; raise `limit` on the census step to see more._\");\nif (c.unresolvedLinks > 0) out.push(\"\", c.unresolvedLinks + \" wikilinks resolve to no note.\");\nreturn out.join(\"\\n\");\n"

[[steps]]
id = "file_report"
type = "deck"
when = "typeof steps.report.json === \"string\""
action = "create_inbox_item"
kind = "investigation"
title = "KB orphan census - {{ run.date }}: {{ steps.census.json.orphanCount }} orphan note(s)"
source = "routine:kb-orphan-census"
body = "{{ steps.report.json }}\n\n---\n_Generated by routine `kb-orphan-census` run {{ run.id }}_\n"
