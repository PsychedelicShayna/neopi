name = "daily-briefing"
description = "Every morning, summarize yesterday's deck activity into a fresh inbox capture"
concurrency = "skip"
timezone = "America/Chicago"
tags = [ "daily", "morning", "briefing" ]

[[trigger]]
cron = "0 7 * * *"

[[trigger]]
[trigger.webhook]
path = "/hooks/daily-briefing-manual"
secret_env = "BRIEFING_SECRET"

[budget]
max_duration_secs = 120
max_llm_cost_usd = 0.05

[state]
declared_keys = [ "last_briefing_date" ]

[[steps]]
id = "should_run"
type = "transform"
body = "const today = new Date().toISOString().slice(0, 10);\nreturn context.state.last_briefing_date !== today;\n"

[[steps]]
id = "fetch_completed"
type = "deck"
when = "steps.should_run.json === true"
action = "list_tasks"
state_ref = "done"
since_hours = 24
limit = 20

[[steps]]
id = "fetch_active"
type = "deck"
when = "steps.should_run.json === true"
action = "list_tasks"
state_ref = "active"
limit = 20

[[steps]]
id = "fetch_blocked"
type = "deck"
when = "steps.should_run.json === true"
action = "list_tasks"
state_ref = "blocked"
limit = 20

[[steps]]
id = "fetch_inbox"
type = "deck"
when = "steps.should_run.json === true"
action = "list_inbox"
since_hours = 24
limit = 15

[[steps]]
id = "write_briefing"
type = "agent"
when = "steps.should_run.json === true"
model = "claude-sonnet-4-6"
timeout_secs = 90
prompt = "Generate a morning briefing in markdown. Keep it tight - 6 to 10 bullets total.\n\nYesterday's completed ({{ steps.fetch_completed.json.length }}): {{ steps.fetch_completed.json | json }}\nActive right now ({{ steps.fetch_active.json.length }}): {{ steps.fetch_active.json | json }}\nBlocked ({{ steps.fetch_blocked.json.length }}): {{ steps.fetch_blocked.json | json }}\nFresh inbox ({{ steps.fetch_inbox.json.length }}): {{ steps.fetch_inbox.json | json }}\n\nStructure exactly:\n\n## What shipped yesterday\n<2-3 bullets of meaningful completions; skip section if nothing>\n\n## In flight\n<2-3 bullets of active tasks worth surfacing; skip section if none worth flagging>\n\n## Needs attention\n<inbox items or blocked tasks worth flagging; skip if empty>\n\n## Top focus today\n<exactly 1 bullet - the one thing>\n\nTone: direct, no fluff, no preamble. The user re-reads this in 30 seconds and knows what matters.\n"
on_failure = "abort"

[[steps]]
id = "write_to_inbox"
type = "deck"
action = "create_inbox_item"
when = "steps.should_run.json === true"
kind = "capture"
title = "Morning briefing - {{ run.date }}"
source = "routine:daily-briefing"
body = "# Morning briefing - {{ run.date }}\n\n{{ steps.write_briefing.stdout }}\n\n---\n_Generated by routine `daily-briefing` run {{ run.id }}_\n"

[[steps]]
id = "persist_state"
type = "set_state"
when = "steps.should_run.json === true"

[steps.state]
last_briefing_date = "{{ run.date }}"
