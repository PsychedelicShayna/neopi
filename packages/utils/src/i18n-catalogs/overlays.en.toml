overlays.welcome_tip.quick_actions = "Type `#` anywhere in your prompt for quick actions — copy the line or the whole prompt, undo, jump the cursor"
overlays.welcome_tip.slash_commands = "Type `/` at the start of your prompt to browse every command"
overlays.welcome_tip.shell_prefix = "Start your prompt with `!` to run it as bash — `!!` runs it without adding the output to context"
overlays.welcome_tip.python_prefix = "Start your prompt with `$ ` to run Python — `$$ ` runs it without adding the output to context"
overlays.welcome_tip.side_question = "You can /btw to ask a side question"
overlays.welcome_tip.background_fork = "Use /tan to fork the current conversation into a background agent"
overlays.welcome_tip.interrupt_or_agent_menu = "{key:ctrl+c} cancels whatever is running and never quits; {key:ctrl+d} opens the agent menu from an empty composer or deletes forward in a draft — see /hotkeys"
overlays.welcome_tip.model_stats = "Find out which model you emotionally abuse the most with `npi stats`"
overlays.welcome_tip.isolated_tasks = "Try task isolation to create CoW worktrees"
overlays.welcome_tip.nested_completion = "Need a cheap nested model call? Use `completion(x...)`. Have a big batch of tasks? Ask clanker to use it!"
overlays.welcome_tip.omfg = "Spaghetti code? Try complaining with /omfg"
overlays.welcome_tip.resume_split_session = "Did you know? Each kitty/tmux/cmux/zellij/wezterm split keeps its own session — `npi -c` resumes the right one"
overlays.welcome_tip.ultrathink = "Drop the word `ultrathink` in your message for harder multi-step reasoning — watch it glow rainbow as you type"
overlays.welcome_tip.chillax = "Agent overthinking? Say `chillax` — on models with per-message effort, thinking drops to the lowest level, even mid-turn — watch it glow as you type"
overlays.welcome_tip.orchestrate = "Say `orchestrate` in your message to drive a multi-phase task with parallel subagents — watch it glow as you type"
overlays.welcome_tip.workflowz = "Say `workflowz` in your message to drive the task with parallel subagents in eval — watch it glow as you type"
overlays.welcome_tip.jevify = "Bulk data to classify or triage? Say `jevify` in your message — the eval kernel's `judge()` processes the batch and you read only what it flags — watch it glow as you type"
overlays.welcome_tip.multi_account = "Log in to several accounts of the same provider — `/login` again — and NeoPi load-balances across them automatically"
overlays.welcome_tip.broker_gateway = "Run `npi auth-broker serve` once and every machine pulls live tokens over the wire — refresh keys never leave the host; `npi auth-gateway` fronts it as a drop-in proxy any OpenAI-compatible client can hit"
overlays.welcome_tip.switch_models = "Press {key:alt+p} (or /model) to switch models, and {key:ctrl+p} to cycle role models smol -> slow -> etc"
overlays.welcome_tip.search_history = "Press {key:ctrl+r} to search your prompt history and reuse a past message"
overlays.welcome_tip.open_settings = "Press {action:app.settings.open} to open Settings without losing your draft"
overlays.welcome_tip.chain_draft = "Send your draft through the active chain with {action:app.message.chain}; {action:app.chain.skipStep} skips the current step"
overlays.welcome_tip.pin_tool = "`/force read` pins the next turn to one specific tool when the model keeps reaching for the wrong one"
overlays.welcome_tip.copy_code = "`/copy code` grabs the last code block to your clipboard — `/copy cmd` grabs the last shell/python command"
overlays.welcome_tip.reclaim_context = "`/shake` rips heavy tool results out of context to reclaim tokens without a full /compact — `/shake images` drops just images"
overlays.welcome_tip.live_collaboration = "Pair up live: `/collab` shares your session through an end-to-end encrypted relay link — a teammate runs `/join <link>` to watch tool calls stream and prompt the agent from their own NeoPi"
overlays.welcome_tip.inspect_agent = "Press {tap:left} to drill into a running or finished agent and inspect its tool calls and transcript"
overlays.welcome_tip.codex_usage_reset = "Hit a Codex rate limit? `/usage reset` spends a saved reset credit to immediately restore your quota"
overlays.welcome_tip.tool_call_format = "No native tool_calling? Inference provider botches parsing them? `PI_DIALECT=glm|kimi|anthropic…` rolls it locally for them!"
