"cli.error.reserved.extensions" = "`{bin} extensions` is not a management command. Use `{bin} plugin list` / `{bin} plugin install`, or run `{bin} launch extensions` if you meant to send \"extensions\" as a prompt."
"cli.error.reserved.list" = "`{bin} list` is not a top-level command. Use `{bin} plugin list` to list installed plugins, or run `{bin} launch list` if you meant to send \"list\" as a prompt."
"cli.error.reserved.remove" = "`{bin} remove` is not a top-level command. Use `{bin} plugin uninstall <name>` to remove a plugin, or run `{bin} launch remove` if you meant to send \"remove\" as a prompt."
"cli.error.reserved.uninstall" = "`{bin} uninstall` is not a top-level command. Use `{bin} plugin uninstall <name@marketplace>` to remove a plugin, or run `{bin} launch uninstall` if you meant to send \"uninstall\" as a prompt."
"cli.error.reserved.marketplace" = "`{bin} marketplace` is not a top-level command. Use `{bin} plugin marketplace <add|remove|update|list>` to manage marketplaces, or run `{bin} launch marketplace` if you meant to send \"marketplace\" as a prompt."
"cli.error.reserved.discover" = "`{bin} discover` is not a top-level command. Use `{bin} plugin discover [marketplace]` to browse available plugins, or run `{bin} launch discover` if you meant to send \"discover\" as a prompt."
"cli.error.reserved.upgrade" = "`{bin} upgrade` is not a top-level command. Use `{bin} plugin upgrade [name@marketplace]` to upgrade plugins, or run `{bin} launch upgrade` if you meant to send \"upgrade\" as a prompt."
"cli.error.reserved.enable" = "`{bin} enable` is not a top-level command. Use `{bin} plugin enable <name@marketplace>` to enable a plugin, or run `{bin} launch enable` if you meant to send \"enable\" as a prompt."
"cli.error.reserved.disable" = "`{bin} disable` is not a top-level command. Use `{bin} plugin disable <name@marketplace>` to disable a plugin, or run `{bin} launch disable` if you meant to send \"disable\" as a prompt."
