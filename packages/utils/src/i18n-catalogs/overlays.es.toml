overlays.welcome_tip.keep_going = "¿Ya te cansaste de escribir \"keep going\"? Solo envía un '.'."
overlays.welcome_tip.quick_actions = "Escribe `#` en cualquier parte de tu mensaje para ver acciones rápidas: copiar la línea o todo el mensaje, deshacer o mover el cursor"
overlays.welcome_tip.slash_commands = "Escribe `/` al inicio de tu mensaje para explorar todos los comandos"
overlays.welcome_tip.shell_prefix = "Empieza tu mensaje con `!` para ejecutarlo en bash. `!!` lo ejecuta sin agregar el resultado al contexto"
overlays.welcome_tip.python_prefix = "Empieza tu mensaje con `$ ` para ejecutarlo en Python. `$$ ` lo ejecuta sin agregar el resultado al contexto"
overlays.welcome_tip.side_question = "Usa /btw para hacer una pregunta aparte"
overlays.welcome_tip.background_fork = "Usa /tan para crear una rama de la conversación actual con un agente en segundo plano"
overlays.welcome_tip.interrupt_or_agent_menu = "{key:ctrl+c} cancela la operación en curso sin salir. {key:ctrl+d} abre el menú de agentes si el editor está vacío o borra hacia delante en un borrador. Consulta /hotkeys"
overlays.welcome_tip.model_stats = "Descubre a qué modelo le haces pasar más dramas con `npi stats`"
overlays.welcome_tip.isolated_tasks = "Prueba el aislamiento de tareas para crear árboles de trabajo con copia al escribir (CoW)"
overlays.welcome_tip.nested_completion = "¿Necesitas una llamada económica a un modelo desde otra tarea? Usa `completion(x...)`. ¿Tienes un lote grande de tareas? Pídele al agente que la use."
overlays.welcome_tip.omfg = "¿Código desordenado? Prueba /omfg para expresar tu queja"
overlays.welcome_tip.resume_split_session = "Cada panel de kitty/tmux/cmux/zellij/wezterm conserva su propia sesión. `npi -c` reanuda la correcta"
overlays.welcome_tip.ultrathink = "Incluye `ultrathink` en tu mensaje para razonar con más esfuerzo en varios pasos. Verás que se ilumina con los colores del arcoíris al escribirlo"
overlays.welcome_tip.chillax = "¿El agente razona de más? Usa `chillax`. En modelos con esfuerzo por mensaje, el esfuerzo se reduce al mínimo incluso a mitad del turno. Verás que se ilumina al escribirlo"
overlays.welcome_tip.orchestrate = "Incluye `orchestrate` en tu mensaje para coordinar una tarea de varias fases con subagentes en paralelo. Verás que se ilumina al escribirlo"
overlays.welcome_tip.workflowz = "Incluye `workflowz` en tu mensaje para llevar a cabo la tarea con subagentes en paralelo en eval. Verás que se ilumina al escribirlo"
overlays.welcome_tip.jevify = "¿Tienes muchos datos que clasificar o priorizar? Incluye `jevify` en tu mensaje: `judge()` en el entorno de eval procesa el lote y solo lees lo que señala. Verás que se ilumina al escribirlo"
overlays.welcome_tip.multi_account = "Inicia sesión en varias cuentas del mismo proveedor con `/login` varias veces. NeoPi distribuye la carga automáticamente"
overlays.welcome_tip.broker_gateway = "Ejecuta `npi auth-broker serve` una vez y cada equipo obtendrá tokens activos por la red sin que las claves de actualización salgan del host. `npi auth-gateway` funciona como proxy para cualquier cliente compatible con OpenAI"
overlays.welcome_tip.switch_models = "Presiona {key:alt+p} (o usa /model) para cambiar el modelo y {key:ctrl+p} para recorrer los modelos de rol smol -> slow -> etc"
overlays.welcome_tip.search_history = "Presiona {action:app.history.search} para buscar en tu historial de mensajes y reutilizar uno anterior"
overlays.welcome_tip.open_settings = "Presiona {action:app.settings.open} para abrir la configuración sin perder tu borrador"
overlays.welcome_tip.chain_draft = "Envía tu borrador por la cadena activa con {action:app.message.chain}. {action:app.chain.skipStep} omite el paso actual"
overlays.welcome_tip.pin_tool = "`/force read` limita el siguiente turno a una sola herramienta cuando el modelo insiste en usar otra"
overlays.welcome_tip.copy_code = "`/copy code` copia el último bloque de código al portapapeles. `/copy cmd` copia el último comando de shell o Python"
overlays.welcome_tip.reclaim_context = "`/shake` quita del contexto los resultados pesados de las herramientas para recuperar tokens sin un /compact completo. `/shake images` solo elimina las imágenes"
overlays.welcome_tip.live_collaboration = "Trabajen juntos en vivo: `/collab` comparte tu sesión mediante un enlace cifrado de extremo a extremo. Otra persona puede ejecutar `/join <link>` para ver las llamadas a herramientas en vivo y enviar mensajes al agente desde su propio NeoPi"
overlays.welcome_tip.inspect_agent = "Presiona {tap:left} para abrir un agente activo o que ya terminó e inspeccionar sus llamadas a herramientas y su transcripción"
overlays.welcome_tip.codex_usage_reset = "¿Llegaste a un límite de Codex? `/usage reset` usa un crédito de reinicio guardado para restaurar tu cuota de inmediato"
overlays.welcome_tip.tool_call_format = "¿No hay tool_calling nativo? ¿El proveedor de inferencia no interpreta bien las llamadas? `PI_DIALECT=glm|kimi|anthropic…` las procesa localmente"
overlays.welcome_tip.advisor = "Activa `/advisor` para agregar un segundo modelo que revise cada turno y aporte sugerencias en segundo plano"
overlays.welcome_tip.message_outline = "Prueba empezar tu mensaje con -> y escribir una lista (1. Haz X, 2. Haz Y)"
overlays.welcome_tip.reasoning_effort = "Presiona {key:shift+tab} para recorrer los niveles de esfuerzo de razonamiento"
overlays.welcome_tip.self_configuration = "omp puede reconfigurarse y ampliarse por su cuenta. ¡Pregunta lo que necesites!"
overlays.welcome_tip.cleanse = "¿Se acumulan los errores de análisis estático o de tipos? `npi cleanse` (o /cleanse aquí mismo) detecta problemas en tu proyecto y los corrige con subagentes en paralelo. {action:app.interrupt} cancela"
