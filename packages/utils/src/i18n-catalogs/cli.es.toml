"cli.error.reserved.extensions" = "`{bin} extensions` no es un comando de administración. Usa `{bin} plugin list` / `{bin} plugin install`, o ejecuta `{bin} launch extensions` si querías enviar \"extensions\" como prompt."
"cli.error.reserved.list" = "`{bin} list` no es un comando de nivel superior. Usa `{bin} plugin list` para enumerar los complementos instalados, o ejecuta `{bin} launch list` si querías enviar \"list\" como prompt."
"cli.error.reserved.remove" = "`{bin} remove` no es un comando de nivel superior. Usa `{bin} plugin uninstall <name>` para eliminar un complemento, o ejecuta `{bin} launch remove` si querías enviar \"remove\" como prompt."
"cli.error.reserved.uninstall" = "`{bin} uninstall` no es un comando de nivel superior. Usa `{bin} plugin uninstall <name@marketplace>` para eliminar un complemento, o ejecuta `{bin} launch uninstall` si querías enviar \"uninstall\" como prompt."
"cli.error.reserved.marketplace" = "`{bin} marketplace` no es un comando de nivel superior. Usa `{bin} plugin marketplace <add|remove|update|list>` para administrar los catálogos, o ejecuta `{bin} launch marketplace` si querías enviar \"marketplace\" como prompt."
"cli.error.reserved.discover" = "`{bin} discover` no es un comando de nivel superior. Usa `{bin} plugin discover [marketplace]` para ver los complementos disponibles, o ejecuta `{bin} launch discover` si querías enviar \"discover\" como prompt."
"cli.error.reserved.upgrade" = "`{bin} upgrade` no es un comando de nivel superior. Usa `{bin} plugin upgrade [name@marketplace]` para actualizar complementos, o ejecuta `{bin} launch upgrade` si querías enviar \"upgrade\" como prompt."
"cli.error.reserved.enable" = "`{bin} enable` no es un comando de nivel superior. Usa `{bin} plugin enable <name@marketplace>` para habilitar un complemento, o ejecuta `{bin} launch enable` si querías enviar \"enable\" como prompt."
"cli.error.reserved.disable" = "`{bin} disable` no es un comando de nivel superior. Usa `{bin} plugin disable <name@marketplace>` para deshabilitar un complemento, o ejecuta `{bin} launch disable` si querías enviar \"disable\" como prompt."
