"cli.commands.skill.usage" = "Uso: {bin} skill <action> [...]\n\nInstalar y descubrir:\n  install [@scope/name[@range]...] [-g] [--yes]   Instala habilidades (sin especificaciones, usa skills.json)\n  update [name...] [-g] [--yes]                   Actualiza las habilidades instaladas dentro de sus rangos de versiones\n  uninstall <name...> [-g]                        Desinstala habilidades\n  search <query> [--sort relevance|downloads|recent] [--json]\n  info <@scope/name[@version]> [--json]\n  list [dir] [--json]                             Muestra las habilidades que se cargan en una sesión en dir, con advertencias\n\nPublicar y administrar:\n  publish [dir] [--scope s] [--tag t] [--dry-run] [--allow-secrets]\n  version <patch|minor|major|x.y.z> [dir]         Incrementa metadata.version en SKILL.md\n  tag <@scope/name@version> <tag>                 Asigna una etiqueta de distribución a una versión\n  tag rm <@scope/name> <tag>                      Elimina una etiqueta de distribución\n  yank <@scope/name@version> [--undo]             Excluye una versión al resolver rangos\n  deprecate <@scope/name[@range]> <message|--undo>\n  owner add|rm <@scope/name> <username>\n  token create <name> [--package @scope/name]... [--expires days]\n  token ls [--json]\n  token revoke <id>\n  import <file.skill>                             Publica un archivo .skill de Claude\n\nLos comandos de administración aceptan --registry <url> (por defecto, skills.registryUrl).\n"
