"settings.setting.tui.completeScrollback.label" = "Historial completo de la terminal"
"settings.setting.tui.completeScrollback.description" = "Envía directamente al historial las filas de transcripción desplazadas fuera de la pantalla por un HUD o diálogo que crece; cuando se reduce, quedan filas vacías entre la transcripción y la entrada hasta que una nueva salida las llene"
"settings.setting.terminal.showProgress.label" = "Progreso nativo de la terminal"
"settings.setting.terminal.showProgress.description" = "Emite progreso indeterminado OSC 9;4 mientras se ejecuta el agente o el mantenimiento del contexto (siempre activo en Tern)"
"settings.setting.terminal.programStatus.label" = "Estado del programa (OSC 7501)"
"settings.setting.terminal.programStatus.description" = "Informa mediante OSC 7501 si el agente está trabajando, esperando tu respuesta, terminó o falló, para los indicadores de pestañas de la terminal y las bandejas de agentes"
"settings.setting.tui.textSizing.label" = "Encabezados grandes (Kitty)"
"settings.setting.tui.textSizing.description" = "Muestra los encabezados H1 de Markdown al doble de tamaño mediante el protocolo OSC 66 de Kitty. Solo tiene efecto en terminales Kitty; se ignora en las demás. Desactivado de forma predeterminada."
"settings.setting.tui.renderMermaid.label" = "Mostrar diagramas Mermaid"
"settings.setting.tui.renderMermaid.description" = "Muestra los bloques de código delimitados de Mermaid como diagramas ASCII"
"settings.setting.tui.renderSvg.label" = "Mostrar figuras SVG"
"settings.setting.tui.renderSvg.description" = "Invita al agente a dibujar diagramas y gráficos como SVG, que se muestran en línea como imágenes en terminales compatibles con gráficos"
"settings.setting.tui.autoGraph.label" = "Graficar tablas automáticamente"
"settings.setting.tui.autoGraph.description" = "Dibuja un gráfico debajo de las tablas numéricas en las respuestas del agente, con los colores del tema, en terminales compatibles con gráficos"
"settings.setting.tui.reactions.label" = "Reacciones del agente"
