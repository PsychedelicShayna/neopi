"settings.setting.images.autoResize.label" = "Cambiar tamaño de imágenes automáticamente"
"settings.setting.images.autoResize.description" = "Reduce las imágenes grandes a un máximo de 2000x2000 para mejorar la compatibilidad con los modelos"
"settings.setting.images.blockImages.label" = "Bloquear imágenes"
