"settings.setting.collab.autoStart.description" = "Aloja cada sesión interactiva mediante collab.relayUrl al iniciarse y publícala en el registro local ({app_name} collab list); las salas cambian al cambiar de sesión"
"settings.setting.worktree.base.description" = "Directorio base para los worktrees administrados por el agente: las copias para aislar tareas, los checkouts de PR de `github` y la limpieza de `{app_name} worktree` se encuentran aquí. Si no se configura, se usa ~/.omp/wt. Debe ser una ruta absoluta o relativa a ~; las rutas relativas se ignoran. La variable de entorno OMP_WORKTREE_DIR tiene prioridad sobre esta configuración."
"settings.setting.chat.include.description" = "Categorías de contexto que se conservan en el modo de chat ({chat_includes}); --chat-include tiene prioridad"
"settings.setting.lsp.shared.description" = "Inicia los servidores de lenguaje mediante el intermediario del daemon de cada proyecto. Cada conexión obtiene su propio servidor. Mientras se ejecuta otra instancia de {app_name} en el proyecto, un servidor liberado permanece listo y la siguiente conexión lo reutiliza en lugar de iniciarlo desde cero (usa servidores privados como alternativa cuando no está disponible)"
"settings.setting.stream.serverUrl.description" = "Servidor de transmisión en vivo utilizado por `{app_name} stream` (https://host[:port]); los espectadores ven la transmisión en <base>/<your Stencil username>"
"settings.setting.providers.maxInFlightRequests.description" = "Número máximo de solicitudes LLM simultáneas por ID de proveedor (por ejemplo, \"openai\" o \"anthropic\"), compartido entre los procesos locales de {product_name} con esta raíz de configuración. Los proveedores omitidos no tienen límite."
"settings.setting.retry.waitForUsageReset.description" = "Cuando un proveedor informa que se agotó el límite de uso e indica una hora de restablecimiento (períodos de cuota de 5 horas o semanales en cualquier proveedor), espera hasta el restablecimiento en lugar de fallar de inmediato al superar retry.maxDelayMs. Las esperas se pueden cancelar ({escape_key}), pero también mantienen ocupados a los subagentes, así que deja esta opción desactivada para ejecuciones desatendidas."
"settings.setting.providers.webSearchTimeoutSeconds.description" = "Tiempo límite estricto, en segundos, para el transporte de búsqueda de cada proveedor antes de que web_search pase a la siguiente alternativa (máximo {max_web_search_timeout_seconds})"
"settings.setting.security.enabled.description" = "Habilita la planificación y ejecución de análisis de seguridad nativos de {product_name} y el espacio de nombres de recursos de solo lectura security://"
"settings.setting.browser.relay.description" = "Controla tus propias pestañas de Chrome mediante el relay del navegador de {product_name}. Instala la extensión una sola vez (`{app_name} browser-relay install`); el servidor relay se inicia automáticamente cuando el preludio del navegador lo necesita. Tiene prioridad sobre Browser CDP URL; establece PI_BROWSER_RELAY=0 o PI_BROWSER_RELAY=1 para anular esta configuración. Los subagentes lo omiten a menos que una llamada a open pase app: \"relay\"."
"settings.setting.browser.relayUrl.description" = "Punto de conexión del relay del navegador de {product_name} (predeterminado http://127.0.0.1:9224)."
"settings.setting.browser.headless.description" = "Ejecuta el navegador sin ventana (desactiva esta opción para mostrarla). Las pestañas de WebKit de {product_name} muestran u ocultan sus ventanas de inmediato donde el motor incluye su visor (macOS); en otros sistemas, un navegador visible es Chromium, que se inicia en el nuevo modo con la siguiente llamada a open."
"settings.setting.browser.tern.description" = "Dentro de un panel de Tern, abre las pestañas del navegador como ventanas de imagen en imagen sobre el panel de {product_name} (vista web nativa) en lugar de usar el navegador sin interfaz gráfica de {product_name}; usa ese navegador como alternativa cuando ninguna ventana de Tern puede alojarlas. Los subagentes lo omiten a menos que una llamada a open pase app: \"tern\". Un app explícito, el relay y Browser CDP URL tienen prioridad; app \"own\" excluye una llamada a open. Establece PI_BROWSER_TERN=0 o PI_BROWSER_TERN=1 para anular esta configuración."
"settings.setting.browser.webkit.description" = "Abre las pestañas del navegador en el motor WebKit sin interfaz gráfica de {product_name} en lugar de Chromium administrado cuando el motor está instalado ({product_name} lo descarga en ~/.o2/lib/abkit antes de descargar Chrome for Testing cuando no hay ningún navegador instalado; consulta Browser WebKit Path). Chromium sigue abriendo un navegador visible donde el motor no incluye un visor y abre las pestañas que el motor no logra iniciar; un app explícito, el relay, Browser CDP URL, Tern y cmux tienen prioridad; app \"chromium\" excluye una llamada a open. Establece PI_BROWSER_WEBKIT=0 o PI_BROWSER_WEBKIT=1 para anular esta configuración."
"settings.setting.browser.webkitPath.description" = "Motor WebKit de {product_name}: su ejecutable host o un directorio del motor ABKit (que lo contiene como ABHost; ABHost.exe en Windows). Si no se configura, {product_name} ejecuta el motor instalado, ~/.o2/lib/abkit/ABHost (ABHost.exe en Windows). Admite ~. PI_BROWSER_WEBKIT_PATH tiene prioridad sobre esta configuración."
"settings.setting.browser.freezeOnTurnEnd.description" = "Congela las pestañas de Chromium sin interfaz gráfica administradas por {product_name} cuando termina un turno para que las páginas animadas dejen de consumir CPU/GPU mientras están inactivas (las pestañas de WebKit no renderizan nada a menos que se les solicite). Las pestañas se descongelan automáticamente al volver a usarlas; pasa persist:true a open para excluir una pestaña."
"settings.setting.browser.idleCloseSec.description" = "Cierra las pestañas del navegador sin interfaz gráfica administradas por {product_name} y las ventanas de imagen en imagen del navegador de Tern que permanezcan inactivas durante más de esta cantidad de segundos (0 = nunca; la eliminación de la sesión sigue cerrándolas). Nunca afecta a los navegadores relay/CDP/iniciados por separado ni a las pestañas de otras sesiones."
"settings.setting.skills.registryUrl.description" = "Registro de Skillshare que usa `{app_name} skill` para instalar, buscar y publicar habilidades (https://host[:port])"
"settings.setting.extensionHandlers.toolCallTimeoutMs.description" = "Tiempo límite positivo y finito de trabajo activo para los manejadores tool_call de extensiones; los valores no válidos usan 30000ms, y el tiempo de espera de los diálogos de {product_name} no cuenta"
"settings.option.collab.autoStart.view.description" = "Alojamiento automático; el registro entrega enlaces de solo lectura ({app_name} collab link --view)"
