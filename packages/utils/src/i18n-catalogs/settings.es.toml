"settings.setting.statusLine.contextLine.description" = "Cómo refleja el uso del contexto la línea entre los segmentos izquierdo y derecho (solo para el editor con recuadro)"
"settings.setting.statusLine.sessionAccent.label" = "Color de acento de la sesión"
"settings.setting.statusLine.sessionAccent.description" = "Usa el color del nombre de la sesión para el borde del editor y el espacio de la línea de estado"
"settings.setting.statusLine.transparent.label" = "Línea de estado transparente"
"settings.setting.statusLine.transparent.description" = "Usa el fondo predeterminado de la terminal para la línea de estado en lugar de `statusLineBg` del tema. Se omiten los extremos Powerline porque necesitan un relleno contrastante con la terminal."
"settings.setting.statusLine.compactThinkingLevel.label" = "Nivel de razonamiento compacto"
"settings.setting.statusLine.compactThinkingLevel.description" = "Muestra el nivel de razonamiento como un único icono en el nombre del modelo en lugar de un sufijo ` · <level>` separado; en el editor de Tern, como icono de la etiqueta del modelo en lugar de una etiqueta separada (haz clic en el icono para cambiarlo)."
"settings.setting.statusLine.showHookStatus.label" = "Mostrar estado de hooks"
"settings.setting.statusLine.showHookStatus.description" = "Muestra mensajes de estado de los hooks debajo de la línea de estado"
"settings.setting.terminal.imageProtocol.label" = "Protocolo de imágenes de la terminal"
"settings.setting.terminal.imageProtocol.description" = "Cambia ahora la presentación de imágenes; Auto usa PI_FORCE_IMAGE_PROTOCOL o la detección de la terminal"
"settings.setting.terminal.showImages.label" = "Mostrar imágenes en línea"
