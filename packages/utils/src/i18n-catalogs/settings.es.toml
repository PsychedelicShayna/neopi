"settings.dynamic.tui.codexResetFireworks" = "Celebra los restablecimientos no programados de la cuota semanal de Codex y los nuevos restablecimientos acumulados con fuegos artificiales en el tercio superior hasta que presiones {escape}"
"settings.dynamic.tui.mouse" = "Captura los clics en la sesión principal para enfocar las tarjetas de subagentes activos y las filas del HUD, resaltar el elemento bajo el puntero y entregar a su extensión los clics en sus enlaces (también puedes elegirlos con la tecla de enlaces). Mientras esté activo, usa {shift} y arrastra para seleccionar texto de forma nativa. La rueda deja de desplazar la pantalla porque la terminal envía sus eventos a omp; usa las teclas de historial de la terminal o desactiva esta opción"
"settings.dynamic.tui.vimMode" = "Activa la navegación Vim en menús, selectores, listas y visores, y la edición modal de texto y búsquedas. {escape} sale del modo Insertar; el modo Normal admite hjkl, 0, $, ^, w, b, e, gg, G, repeticiones, x/D/C, dd/yy, p y u. Los operadores aceptan movimientos u objetos de texto (diw, ca(, dap); v/V inicia una selección Visual que y copia y d borra. Está desactivado de forma predeterminada; la navegación y edición habituales siguen disponibles"
"settings.dynamic.composer.recallClearedDrafts" = "Conserva los borradores borrados con {clear} en el historial local de {history} hasta salir; si desactivas el ajuste, solo afecta a los que borres después"
"settings.dynamic.doubleEscapeAction" = "Qué sucede al presionar {escape} dos veces con el editor vacío: abrir el selector para retroceder en la transcripción, abrir el árbol de sesiones o no hacer nada"
"settings.dynamic.spelling.autocomplete" = "Sugiere cómo completar la palabra en la misma línea: {tab} acepta la sugerencia con un espacio y {right} sin espacio"
"settings.dynamic.composer.predictions" = "Tras completar un turno, pide al modelo activo que prediga tu siguiente mensaje y lo muestra como texto tenue en el editor vacío; {tab} o {right} lo inserta sin enviarlo. Uso adicional: cada turno completado envía una solicitud facturable más en la conversación (se cuenta en /stats)"
"settings.dynamic.composer.predictionAlternatives" = "Pide hasta cuatro predicciones distintas en lugar de una, empezando por la más probable. El texto tenue muestra la primera que coincide con tu borrador; tras insertar una, vuelve a presionar {tab} para elegir otra. La misma solicitud devuelve unos cuantos tokens de salida más"
