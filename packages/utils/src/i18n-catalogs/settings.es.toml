"settings.setting.telemetry.otlpExportEnabled.label" = "Exportación de telemetría OTLP"
"settings.setting.telemetry.otlpExportEnabled.description" = "Permite que OMP exporte trazas, registros y métricas mediante endpoints OTEL_*. Los cambios entran en vigor en el siguiente inicio."
"settings.setting.telemetry.agent_context.label" = "Telemetría del contexto del agente"
"settings.setting.telemetry.agent_context.description" = "Uso y margen disponible del contexto local: desactivado, totales mínimos o desglose completo. Desactivado de forma predeterminada."
"settings.setting.telemetry.tool_results.label" = "Telemetría de resultados de herramientas"
"settings.setting.telemetry.tool_results.description" = "No incluir telemetría de resultados de herramientas, incluir un resumen o incluir todos los detalles, independientemente de la telemetría del contexto."
"settings.setting.telemetry.threshold_events.label" = "Avisos de umbral del agente"
"settings.setting.telemetry.threshold_events.description" = "Notifica al agente cuando se aproxima la compactación o cuando los avisos de uso habilitados cruzan un umbral."
"settings.setting.usageNotices.enabled.label" = "Avisos de uso y contexto"
"settings.setting.usageNotices.enabled.description" = "Muestra cuándo se cruzan los umbrales de cuota y presión del contexto. Usa los datos de uso en caché sin forzar actualizaciones."
"settings.setting.usageNotices.quotaPercent.label" = "Umbral de aviso de cuota"
"settings.setting.usageNotices.quotaPercent.description" = "Notifica cuando la cuota utilizada alcanza este porcentaje."
"settings.setting.usageNotices.remainingPercent.label" = "Umbral de aviso de cuota restante"
"settings.setting.usageNotices.remainingPercent.description" = "También notifica cuando a una ventana de cuota le queda este porcentaje o menos."
"settings.setting.usageNotices.contextPercent.label" = "Umbral de aviso de contexto"
"settings.setting.usageNotices.contextPercent.description" = "Notifica cuando la ocupación estimada del contexto alcanza este porcentaje."
"settings.setting.goal.enabled.label" = "Modo de objetivo"
"settings.setting.goal.enabled.description" = "Habilita el modo de objetivo por sesión y la herramienta de objetivo oculta"
"settings.setting.goal.statusInFooter.label" = "Estado del objetivo en el pie"
"settings.setting.goal.statusInFooter.description" = "Muestra el presupuesto de tokens junto al indicador del objetivo en la línea de estado"
"settings.setting.goal.continuationModes.label" = "Modos de continuación del objetivo"
"settings.setting.goal.continuationModes.description" = "Modos de ejecución en los que los objetivos activos pueden continuar automáticamente entre turnos (\"interactive\", \"rpc\")"
"settings.setting.ghidra.installDir.label" = "Directorio de instalación de Ghidra"
"settings.setting.ghidra.installDir.description" = "Directorio de instalación de Ghidra 12 o posterior (contiene Ghidra/application.properties); si está vacío, usa $GHIDRA_INSTALL_DIR, Homebrew o, en su defecto, una descarga administrada en ~/.omp/ghidra"
"settings.setting.ghidra.python.label" = "Python de Ghidra"
"settings.setting.ghidra.python.description" = "Intérprete de Python que puede importar pyghidra; si está vacío, usa un venv administrado creado a partir de los wheels incluidos en la instalación"
"settings.setting.effort.mode.label" = "Política de esfuerzo"
"settings.setting.effort.mode.description" = "Conjuntos de esfuerzo implícitos de reemplazo o indicaciones generales heredadas para subagentes"
"settings.setting.auth.unpausedProviders.label" = "Proveedores reactivados"
"settings.setting.auth.unpausedProviders.description" = "Vuelve a activar los proveedores que pausamos: el inicio de sesión, la renovación de tokens y las credenciales guardadas vuelven a funcionar. Cada pausa indica el riesgo para la cuenta que aceptas. La configuración del proyecto no puede establecer esto"
"settings.setting.modelRoleStorage.label" = "Almacenamiento de roles de modelo"
"settings.setting.modelRoleStorage.description" = "Dónde se guardan las asignaciones de roles del selector de modelos"
"settings.setting.models.defaultScope.label" = "Ámbito predeterminado de roles"
"settings.setting.models.defaultScope.description" = "Ámbito que edita /roles si no indicas `session`, `project` o `global`"
"settings.setting.models.sessionPicker.label" = "Selector de modelos de sesión"
"settings.setting.models.sessionPicker.description" = "Selector que abren /model y Alt+P para esta conversación"
"settings.setting.models.catalogRefreshCycleMinutes.label" = "Ciclo de actualización del catálogo (minutos)"
"settings.setting.models.catalogRefreshCycleMinutes.description" = "Tiempo entre ciclos de actualización del catálogo de modelos en segundo plano"
"settings.setting.models.catalogProviderStalenessMinutes.label" = "Antigüedad del catálogo de proveedores (minutos)"
"settings.setting.models.catalogProviderStalenessMinutes.description" = "Antigüedad a partir de la cual entrar en un proveedor activa una actualización del catálogo"
"settings.setting.models.newModelTierDays.label" = "Nivel de modelos nuevos (días)"
"settings.setting.models.newModelTierDays.description" = "Días por cada nivel de descubrimiento: oro, plata y bronce"
"settings.setting.mcp.enableProjectConfig.label" = "Configuración de MCP del proyecto"
"settings.setting.mcp.enableProjectConfig.description" = "Carga .mcp.json/mcp.json desde la raíz del proyecto"
"settings.setting.mcp.startupTimeoutMs.label" = "Ventana de inicio de MCP"
"settings.setting.mcp.startupTimeoutMs.description" = "Espera esta cantidad de milisegundos para el descubrimiento inicial de herramientas MCP; 0 espera hasta que las conexiones se estabilicen"
"settings.setting.mcp.evalNamespaces.label" = "Espacios de nombres de eval de MCP"
"settings.setting.mcp.evalNamespaces.description" = "Expone cada servidor MCP como una variable global de eval (github.create_issue(...)) en lugar de herramientas de nivel superior o xd://"
"settings.setting.mcp.builtinTransforms.label" = "Transformaciones integradas de MCP"
"settings.setting.mcp.builtinTransforms.description" = "Omite los servidores MCP reconocidos que las herramientas propias de omp reemplazan (node_repl de Codex mientras eval ejecuta JavaScript)"
"settings.setting.mcp.renderMarkdownResults.label" = "Resultados de MCP en Markdown"
"settings.setting.mcp.renderMarkdownResults.description" = "Renderiza los resultados de texto de MCP que no son JSON como Markdown en la transcripción"
"settings.setting.mcp.notifications.label" = "Inyección de actualizaciones de MCP"
"settings.setting.mcp.notifications.description" = "Inyecta actualizaciones de recursos MCP en la conversación del agente"
"settings.setting.mcp.notificationDebounceMs.label" = "Tiempo de agrupación de notificaciones MCP"
"settings.setting.mcp.notificationDebounceMs.description" = "Intervalo de espera en milisegundos para agrupar las actualizaciones de recursos MCP antes de incorporarlas a la conversación"
"settings.setting.secrets.enabled.label" = "Ocultar secretos"
"settings.setting.secrets.enabled.description" = "Ofusca los secretos configurados y oculta los tokens con formato de credencial antes de enviarlos a los proveedores de IA"
"settings.setting.collab.relayUrl.label" = "URL del servidor de retransmisión"
"settings.setting.collab.relayUrl.description" = "Servidor de retransmisión usado por /collab (wss://host[:port])"
"settings.setting.collab.webUrl.label" = "URL de la interfaz web"
"settings.setting.collab.webUrl.description" = "Interfaz del navegador usada por los enlaces de /collab; si está vacía, se deriva de collab.relayUrl; http:// explícito solo se permite para localhost"
"settings.setting.collab.displayName.label" = "Nombre visible"
"settings.setting.collab.displayName.description" = "Nombre que se muestra a los demás participantes de collab (predeterminado: nombre de usuario del sistema operativo)"
"settings.setting.collab.autoStart.label" = "Inicio automático"
"settings.setting.monitor.tmux.autoStart.label" = "Iniciar el monitor de agentes de tmux"
"settings.setting.monitor.tmux.autoStart.description" = "Abre una sesión dedicada de tmux con un panel en vivo por cada subagente y asesor siempre que se inicie una sesión dentro de tmux"
"settings.setting.monitor.tmux.includeAdvisors.label" = "Monitorear asesores"
"settings.setting.monitor.tmux.includeAdvisors.description" = "Asigna a los asesores sus propios paneles de monitoreo de solo lectura"
"settings.setting.monitor.tmux.maxRows.label" = "Número máximo de filas del monitor"
"settings.setting.monitor.tmux.maxRows.description" = "Entero positivo o \"infinite\". Predeterminado: 2. Reinicia el monitor para redistribuir los paneles existentes"
"settings.setting.monitor.tmux.maxColumns.label" = "Número máximo de columnas del monitor"
"settings.setting.monitor.tmux.maxColumns.description" = "Entero positivo o \"infinite\" (predeterminado). Se abre una ventana nueva solo cuando se alcanzan ambos límites finitos"
"settings.setting.monitor.tmux.fillOrder.label" = "Orden de llenado del monitor"
"settings.setting.monitor.tmux.fillOrder.description" = "Llena primero las filas hacia abajo en cada columna, o las columnas a lo largo de cada fila; también elige el primer eje de crecimiento alternativo"
"settings.setting.monitor.tmux.growth.label" = "Crecimiento del monitor"
"settings.setting.monitor.tmux.growth.description" = "La alternancia se aplica cuando ambas cantidades son infinitas: llena cada borde nuevo antes de hacer crecer el otro eje"
"settings.setting.monitor.tmux.direction.label" = "Dirección de crecimiento del monitor"
"settings.setting.monitor.tmux.direction.description" = "Crece hacia abajo y hacia la derecha, o invierte la ubicación para crecer hacia arriba y hacia la izquierda"
"settings.setting.monitor.tmux.rowHeight.label" = "Altura de las filas del monitor"
"settings.setting.monitor.tmux.rowHeight.description" = "Entero positivo en celdas de terminal, o \"dynamic\" (predeterminado) para igualar la altura de las filas"
"settings.setting.monitor.tmux.columnWidth.label" = "Ancho de las columnas del monitor"
"settings.setting.monitor.tmux.columnWidth.description" = "Entero positivo en celdas de terminal, o \"dynamic\" (predeterminado) para igualar el ancho de las columnas"
"settings.setting.mnemopi.dbPath.label" = "Ruta de la base de datos de Mnemopi"
"settings.setting.mnemopi.dbPath.description" = "Ruta opcional de la base de datos SQLite; un ~ al inicio representa el directorio de inicio. De forma predeterminada, se usa el directorio de memorias del agente."
"settings.setting.mnemopi.bank.label" = "Banco de Mnemopi"
"settings.setting.mnemopi.bank.description" = "Nombre base opcional para el banco compartido. Los modos por proyecto derivan bancos locales de proyecto a partir de este."
"settings.setting.mnemopi.scoping.label" = "Ámbito de Mnemopi"
"settings.setting.mnemopi.scoping.description" = "global = un banco compartido; per-project = un banco aislado por cwd; per-project-tagged = escritura local al proyecto y visibilidad global para la recuperación"
"settings.setting.mnemopi.embeddingVariant.label" = "Variante de embeddings"
"settings.setting.mnemopi.embeddingVariant.description" = "Familia de modelos locales de embeddings. en = modelo más potente para inglés; multilingual = modelo multilingüe. Cambiar esta opción reconstruye los embeddings de las memorias existentes en el próximo inicio."
"settings.setting.mnemopi.autoRecall.label" = "Recuperación automática de Mnemopi"
"settings.setting.mnemopi.autoRecall.description" = "Recupera memorias locales en el primer turno de cada sesión"
"settings.setting.mnemopi.recallRelevance.label" = "Relevancia de recuperación de Mnemopi"
"settings.setting.mnemopi.recallRelevance.description" = "Pregunta al modelo con rol de juez si cada memoria recuperada automáticamente es relevante para la tarea antes de incorporarla"
"settings.setting.mnemopi.autoRetain.label" = "Almacenamiento automático de Mnemopi"
"settings.setting.mnemopi.autoRetain.description" = "Almacena los turnos de conversación completados en la memoria local de Mnemopi"
"settings.setting.mnemopi.polyphonicRecall.label" = "Recuperación polifónica de Mnemopi"
"settings.setting.mnemopi.polyphonicRecall.description" = "Combina la recuperación con voces de grafo, hechos, vectores y tiempo para que aparezcan memorias vinculadas sin coincidencia de palabras clave"
"settings.setting.mnemopi.enhancedRecall.label" = "Recuperación mejorada de Mnemopi"
"settings.setting.mnemopi.enhancedRecall.description" = "Guarda en caché los resultados de recuperación para consultas repetidas y similares con opciones idénticas; cualquier escritura de memoria limpia la caché"
"settings.setting.mnemopi.proactiveLinking.label" = "Vinculación proactiva de Mnemopi"
"settings.setting.mnemopi.proactiveLinking.description" = "Incorpora nuevas memorias al grafo episódico a medida que se almacenan y las vincula con entidades y memorias relacionadas"
"settings.setting.mnemopi.noEmbeddings.label" = "Desactivar embeddings de Mnemopi"
"settings.setting.mnemopi.noEmbeddings.description" = "Fuerza la recuperación determinista solo con FTS en lugar de embeddings vectoriales"
"settings.setting.mnemopi.embeddingModel.label" = "Modelo de embeddings de Mnemopi"
"settings.setting.mnemopi.embeddingModel.description" = "Avanzado: ID explícito del modelo de embeddings que anula la variante. Déjalo vacío para usar mnemopi.embeddingVariant."
"settings.setting.mnemopi.embeddingApiUrl.label" = "URL de la API de embeddings de Mnemopi"
"settings.setting.mnemopi.embeddingApiUrl.description" = "Endpoint opcional de embeddings compatible con OpenAI que se pasa a Mnemopi"
"settings.setting.mnemopi.embeddingApiKey.label" = "Clave de la API de embeddings de Mnemopi"
"settings.setting.mnemopi.embeddingApiKey.description" = "Clave API opcional de embeddings que se pasa a Mnemopi"
"settings.setting.mnemopi.embeddingQueryPrefix.label" = "Prefijo de consulta de embeddings de Mnemopi"
"settings.setting.mnemopi.embeddingQueryPrefix.description" = "Texto que se antepone a las consultas de recuperación antes de generar embeddings, para modelos de embeddings ajustados con instrucciones (Qwen3-Embedding, E5); los recuerdos almacenados se convierten en embeddings sin cambios"
"settings.setting.mnemopi.embeddingInputType.label" = "Tipo de entrada de embeddings de Mnemopi"
"settings.setting.mnemopi.embeddingInputType.description" = "Enviar input_type (query para recuperación, passage para recuerdos almacenados) con las solicitudes a la API de embeddings; los modelos de embeddings asimétricos de NVIDIA NIM lo requieren"
"settings.setting.mnemopi.llmMode.label" = "Modo LLM de Mnemopi"
"settings.setting.mnemopi.llmMode.description" = "Usar ningún LLM, el modelo tiny en línea (el rol TINY de /roles o, en su defecto, @smol) o un endpoint remoto compatible con OpenAI"
"settings.setting.mnemopi.llmBaseUrl.label" = "URL base del LLM de Mnemopi"
"settings.setting.mnemopi.llmBaseUrl.description" = "Endpoint opcional de LLM compatible con OpenAI para el modo remoto de Mnemopi"
"settings.setting.mnemopi.llmApiKey.label" = "Clave API del LLM de Mnemopi"
"settings.setting.mnemopi.llmApiKey.description" = "Clave API opcional del LLM para el modo remoto de Mnemopi"
"settings.setting.mnemopi.llmModel.label" = "Modelo LLM de Mnemopi"
"settings.setting.mnemopi.llmModel.description" = "Nombre opcional del modelo LLM para el modo remoto de Mnemopi"
"settings.setting.tui.colorfulMarkdown.label" = "Markdown a color"
"settings.setting.tui.colorfulMarkdown.description" = "Colorea los encabezados según su nivel, el texto en negrita y cursiva, el código en línea y los encabezados de tabla con la paleta ANSI del tema. Al desactivarlo, usa un solo color para los encabezados y negrita y cursiva sin color."
"settings.setting.tui.renderEmbeds.label" = "Mostrar imágenes y páginas incrustadas"
"settings.setting.tui.renderEmbeds.description" = "Invita al agente a mostrar imágenes con <img> y páginas web con <iframe>, cargándolas (incluidas las direcciones remotas) para mostrarlas en línea en terminales que admiten gráficos"
"settings.setting.tui.spinnerInterval.label" = "Intervalo del indicador de carga (ms)"
"settings.setting.tui.spinnerInterval.description" = "Milisegundos entre fotogramas de cada indicador de carga, incluido el del título de la terminal; 0 muestra símbolos estáticos. Si no se establece, sigue la configuración de movimiento"
"settings.setting.tui.maxFps.label" = "Máximo de fotogramas por segundo"
"settings.setting.tui.maxFps.description" = "Límite de frecuencia con que se vuelve a dibujar la TUI, incluido el texto en streaming. El eco de las teclas mantiene 30 fps para que el panel donde escribes responda con fluidez"
"settings.setting.tui.motion.label" = "Movimiento"
"settings.setting.tui.motion.description" = "Un solo control para los indicadores de carga, el efecto de brillo y el parpadeo o desvanecimiento decorativo. El texto en streaming no se ve afectado (consulta el máximo de fotogramas por segundo). El intervalo del indicador de carga que establezcas tiene prioridad"
"settings.setting.display.shellVisualization.label" = "Visualización de shell"
"settings.setting.display.shellVisualization.description" = "Mostrar los comandos bash como una visualización interactiva de su ejecución en lugar de comandos shell en texto plano"
"settings.setting.btw.inject.label" = "Inyección de mensajes de orientación de /btw"
"settings.setting.btw.inject.description" = "Cuando le pides a /btw un prompt de orientación, redacta uno entre etiquetas <inject>, resaltado en la respuesta; Alt+I (app.btw.inject) lo envía a la sesión principal"
"settings.setting.composer.predictionAlternatives.label" = "Alternativas de predicción"
"settings.setting.update.channel.description" = "Solo un cambio global persistente a un canal diferente o la ejecución exitosa de `npi update stable|nightly` levanta la retención por reversión. Las sobrescrituras de proyecto, sesión y proceso no lo hacen."
"settings.setting.update.auto.label" = "Actualización automática de NeoPi"
"settings.setting.update.auto.description" = "Buscar actualizaciones en el canal seleccionado de NeoPi después del inicio interactivo"
"settings.setting.bash.enabled.description" = "Habilitar la herramienta bash para ejecutar comandos shell"
"settings.setting.bash.allowCompoundCommands.label" = "Permitir comandos compuestos"
"settings.setting.bash.allowCompoundCommands.description" = "Evaluar las cadenas literales de && por comando; los comandos que no coincidan usan la política y el modo normales de aprobación de bash"
"settings.setting.bash.autoBackground.enabled.label" = "Ejecución automática de bash en segundo plano"
"settings.setting.bash.autoBackground.enabled.description" = "Pasar automáticamente a segundo plano los comandos bash de larga duración y entregar el resultado más tarde"
"settings.setting.bash.gitGuard.label" = "Protección de Git"
"settings.setting.bash.gitGuard.description" = "Rechazar comandos git que descarten o muevan trabajo compartido en el checkout principal de un repositorio: stash, reset --hard o reset a otro commit, y checkout/switch/restore fuera de un conflicto de merge o rebase. En un worktree vinculado se ejecutan, guardando primero los cambios sin commit que descartarían"
"settings.setting.bash.patterns.label" = "Patrones de aprobación de bash"
"settings.setting.bash.patterns.description" = "Reglas ordenadas de aprobación de comandos bash. Cada elemento tiene los campos match y approval; solo se admiten comodines '*'."
"settings.setting.bash.allowedEnvVars.label" = "Variables de entorno permitidas en bash"
"settings.setting.bash.allowedEnvVars.description" = "Nombres exactos de variables de entorno permitidas como prefijos iniciales KEY=VALUE al comparar con las reglas allow de bash.patterns (sin comodines). Se acepta cualquier valor, así que incluye solo variables de compilación o prueba inofensivas; las variables que alteran la ejecución (PATH, LD_PRELOAD, BASH_ENV, *_RUNNER, *_WRAPPER) permiten ejecutar comandos arbitrarios."
"settings.setting.bashInterceptor.enabled.label" = "Interceptor de bash"
"settings.setting.bashInterceptor.enabled.description" = "Bloquear comandos shell que tienen herramientas dedicadas"
"settings.setting.bash.direnv.label" = "Carga automática de direnv"
"settings.setting.bash.direnv.description" = "Cargar automáticamente el `.envrc` de direnv/devenv de un repositorio en la sesión de bash para que las herramientas y variables de entorno de devenv estén disponibles sin ejecutar `direnv exec` manualmente. Respeta la lista de permitidos de direnv: nunca se ejecuta un `.envrc` que no hayas autorizado con `direnv allow`"
"settings.setting.bash.direnvLoadTimeoutMs.label" = "Tiempo de espera de carga de direnv (ms)"
"settings.setting.bash.direnvLoadTimeoutMs.description" = "Espera máxima para el primer `direnv export` (un shell de devenv iniciado en frío puede ser lento); si se agota el tiempo, la sesión se ejecuta sin el entorno de direnv"
"settings.setting.shellMinimizer.enabled.label" = "Minimizador de shell"
"settings.setting.shellMinimizer.enabled.description" = "Comprimir la salida extensa de shell (git, npm, cargo, etc.) antes de devolverla al agente"
"settings.setting.shellMinimizer.sourceOutlineLevel.label" = "Esquema del código fuente del minimizador de shell"
"settings.setting.shellMinimizer.sourceOutlineLevel.description" = "Modo de esquema del código fuente para cat/read de archivos fuente: predeterminado o agresivo"
"settings.setting.autolearn.enabled.label" = "Auto-Learn (experimental)"
"settings.setting.autolearn.enabled.description" = "Después de que el agente se detenga, anímalo a guardar lo aprendido en la memoria y crear o mejorar habilidades administradas y aisladas"
"settings.setting.autolearn.autoContinue.label" = "Ejecutar automáticamente la captura al detenerse"
"settings.setting.autolearn.autoContinue.description" = "Cuando está activado, ejecuta automáticamente un turno privado de captura al detenerse (usa tokens adicionales). Cuando está desactivado, solo permanece la orientación continua de Auto-Learn."
"settings.setting.task.isolation.enabled.label" = "Permitir subagentes aislados"
"settings.setting.task.isolation.enabled.description" = "Permite el aislamiento por tarea con `isolated: true`; las tareas sin esta opción se ejecutan en el checkout compartido"
"settings.setting.isolation.backend.label" = "Backend de aislamiento"
"settings.setting.isolation.backend.description" = "Backend utilizado para el aislamiento de subagentes y la clonación de worktrees"
"settings.setting.worktree.clone.label" = "Clonar el checkout en worktrees"
"settings.setting.worktree.clone.description" = "Los nuevos worktrees creados con `github pr_checkout` y `git worktree add` en bash comienzan como un clon con copia al escribir del checkout actual, de modo que se conservan los artefactos de compilación ignorados (node_modules, target); se recurre a un checkout normal cuando el sistema de archivos no puede clonar"
"settings.setting.worktree.cleanSource.label" = "Limpiar el checkout de origen en /wt"
"settings.setting.worktree.cleanSource.description" = "Al crear un worktree con `/wt`, revierte los cambios en archivos rastreados y elimina los archivos no rastreados del checkout original después de transferirlos"
"settings.setting.worktree.onStart.label" = "Worktree al iniciar"
"settings.setting.worktree.onStart.description" = "Si las nuevas sesiones interactivas comienzan en un nuevo worktree vinculado"
"settings.setting.worktree.onExit.label" = "Worktree al salir"
"settings.setting.worktree.onExit.description" = "Qué hacer al salir con los worktrees creados desde que se inició omp (al iniciar o con `/wt`)"
"settings.setting.task.isolation.apply.label" = "Aplicar cambios aislados"
"settings.setting.task.isolation.apply.description" = "Aplica automáticamente al checkout principal los cambios de las tareas aisladas exitosas; desactívalo para conservar los artefactos de parche o rama"
"settings.setting.ovnfs.path.label" = "Binario de ovnfs"
"settings.setting.ovnfs.path.description" = "Ejecutable de ovnfs; si no se especifica, busca `ovnfs` en PATH. Cuando se encuentra, los checkouts de ovnfs (vistas de una carpeta con copia al escribir, listas en aproximadamente un segundo sin importar su tamaño) se usan para cada copia independiente: el prompt del sistema indica a los agentes que abran checkouts en lugar de worktrees de git o copias y, con `isolation.backend` en auto, los subagentes aislados (cuando se permiten) se ejecutan en checkouts en lugar de clones nativos y `/wt` mueve la sesión a un checkout en lugar de a un worktree vinculado"
"settings.setting.task.isolation.merge.label" = "Estrategia de integración para aislamiento"
"settings.setting.task.isolation.merge.description" = "Cómo se integran los cambios de las tareas aisladas (aplicación de parche o integración de rama)"
"settings.setting.task.isolation.commits.label" = "Estilo de commit para aislamiento"
"settings.setting.task.isolation.commits.description" = "Estilo del mensaje de commit para cambios en repositorios anidados (genérico o generado por IA)"
"settings.setting.worktree.base.label" = "Directorio base de worktrees"
"settings.setting.task.eager.label" = "Preferir la delegación de tareas"
"settings.setting.task.eager.description" = "Con qué intensidad se impulsa al agente principal a delegar trabajo; los subagentes conservan la política propia del modelo"
"settings.setting.task.autoParallel.label" = "Paralelismo automático"
"settings.setting.task.autoParallel.description" = "Pregunta al juez nativo seleccionado mediante el rol 'judge' qué partes de cada nuevo prompt de nivel superior pueden ejecutarse simultáneamente. Requiere un juez nativo y la herramienta task; sin ellos no se evalúa nada."
"settings.setting.task.batch.label" = "Llamadas a task por lotes"
"settings.setting.task.batch.description" = "Cambia la herramienta task a su formato por lotes: una llamada contiene { context, tasks[] } — un subagente por elemento, con un agent opcional por elemento (por defecto, el agente de la política de creación de la sesión), aislamiento por elemento y un contexto compartido obligatorio que se antepone a cada asignación. Con async.enabled=true, cada creación se ejecuta como un agente independiente en segundo plano con el ciclo de vida normal de inactividad y pausa; de lo contrario, la llamada espera los resultados combinados. Desactívalo para restablecer el esquema plano de creación única."
"settings.setting.task.steps.label" = "Pasos secuenciales de tareas"
"settings.setting.task.steps.description" = "Las creaciones reciben `steps` ordenados en lugar de un solo `task`: el subagente recibe el primer paso y luego cada paso siguiente al terminar el anterior; cuando hay más de 4 pasos, los mensajes anteriores contienen dos o más. El resultado del último paso es el resultado de la tarea."
"settings.setting.task.structured.label" = "Resultados estructurados de tareas"
"settings.setting.task.structured.description" = "Expone outputSchema/schemaMode en la herramienta task y respeta los esquemas de salida de los agentes; un subagente con un esquema devuelve su resultado mediante la herramienta yield, validado contra el esquema. Desactivado: los subagentes de task ignoran los esquemas, excepto los agentes cuya definición establece structured: true. Un subagente sin esquema no tiene la herramienta yield y devuelve su mensaje final. Las creaciones de Eval agent()/workpool siempre respetan los esquemas."
"settings.setting.task.speculativeLaunch.label" = "Inicio especulativo de tareas"
"settings.setting.task.speculativeLaunch.description" = "Inicia cada subagente del lote en cuanto termina de transmitirse su elemento de tasks[], en lugar de esperar la llamada completa a task. Los agentes iniciados se cancelan si la llamada completada falla la validación, se bloquea o cambian sus argumentos. Requiere la aprobación automática de task y que no haya manejadores del ciclo de vida de herramientas de extensión."
"settings.setting.task.enableEffort.label" = "Esfuerzo por tarea"
"settings.setting.task.enableEffort.description" = "Expone el parámetro opcional effort al crear tareas, lo que permite a quienes las invocan ajustar el nivel de razonamiento de cada subagente"
"settings.setting.task.perCallModel.label" = "Modelo por llamada"
"settings.setting.task.perCallModel.description" = "Si una llamada a un subagente puede elegir su modelo con un selector exacto provider/model-id[@upstream][:level]. Una fijación @upstream forma parte de la identidad del modelo y solo es compatible con agregadores. Solo se aceptan modelos a los que la configuración ya dirige solicitudes. La configuración del proyecto puede desactivarlo, pero no activarlo ni aprobar un modelo."
"settings.setting.task.perCallModelAllow.label" = "Lista de modelos permitidos por llamada"
"settings.setting.task.perCallModelAllow.description" = "Selectores exactos: `provider/model-id`, incluyendo `@upstream` solo para una ruta fijada de OpenRouter/Vercel (por ejemplo, `openrouter/x@y`). Cuando se establece, un modelo por llamada también debe estar en esta lista. Vacía: todos los modelos que permite la configuración. Una lista de proyecto solo puede restringir esta lista."
"settings.setting.task.maxConcurrency.label" = "Máximo de tareas simultáneas"
"settings.setting.task.maxConcurrency.description" = "Número máximo de subagentes que se ejecutan simultáneamente"
"settings.setting.task.workerThreads.label" = "Hilos de trabajo de subagentes"
"settings.setting.task.workerThreads.description" = "Número máximo de hilos de trabajo para subagentes. Hasta 8 subagentes simultáneos se ejecutan en el hilo principal; al llegar a 9 se añade un hilo de trabajo, y otro cada vez que se duplica la cantidad (18, 36, 72). Los hilos de trabajo se detienen un minuto después de que ya no quede ningún subagente activo en ellos; 0 mantiene todos los subagentes en el hilo principal"
"settings.setting.task.enableLsp.label" = "Comprobaciones de edición con LSP en subagentes"
"settings.setting.task.enableLsp.description" = "Ejecuta el formato y los diagnósticos de LSP en las ediciones de los subagentes. Está desactivado por defecto para mantener bajo el costo de los subagentes; la herramienta lsp sigue disponible para ellos en ambos casos."
"settings.setting.task.crossInstance.label" = "Mensajería entre agentes de distintas instancias"
"settings.setting.task.crossInstance.description" = "Permite que otras instancias de omp en esta carpeta lean los resultados de los agentes y envíen mensajes que pueden despertarlos"
"settings.setting.task.maxRecursionDepth.label" = "Recursión máxima de tareas"
"settings.setting.task.maxRecursionDepth.description" = "Número de niveles de profundidad en los que los subagentes pueden crear sus propios subagentes"
"settings.setting.task.maxRuntimeMs.label" = "Tiempo máximo de ejecución de subagentes"
"settings.setting.task.maxRuntimeMs.description" = "Límite estricto de tiempo transcurrido por subagente (ms). 0 lo desactiva. Una capa adicional de defensa contra bloqueos del stream del proveedor que el watchdog de la capa de inferencia no detecta; desencadena una cancelación normal del subagente con el motivo 'timed out'."
"settings.setting.task.completionProbe.label" = "Sondeo de finalización del subagente"
"settings.setting.task.completionProbe.description" = "Pide a un subagente en funcionamiento, mediante una solicitud secundaria en caché como /btw, que estime qué tan completa está su tarea: después de 2, 5, 10 y 30 minutos adicionales, y luego cada hora. La estimación aparece junto al subagente en las vistas de espera y tareas. Solo se consulta a los subagentes creados por el agente principal de una sesión interactiva; las ejecuciones de print, RPC, ACP y SDK nunca realizan sondeos."
"settings.setting.task.definitionGenerationConversationTtlMs.label" = "TTL de conversación de generación"
"settings.setting.task.definitionGenerationConversationTtlMs.description" = "Mantiene las conversaciones de generación de agentes y asesores en memoria durante esta cantidad de milisegundos después de la última generación. Predeterminado: 1 hora. 0 desactiva la retención; no se guarda nada en disco."
"settings.setting.task.agentIdleTtlMs.label" = "TTL de inactividad del agente"
"settings.setting.task.agentIdleTtlMs.description" = "Tiempo que un subagente inactivo permanece activo en memoria antes de guardarse en disco (ms). Los agentes guardados se reactivan automáticamente al recibir un mensaje o reanudarse. 0 mantiene activos a los agentes inactivos hasta la salida."
"settings.setting.task.softRequestBudget.label" = "Presupuesto flexible de solicitudes por subagente"
"settings.setting.task.softRequestBudget.description" = "Presupuesto flexible de solicitudes por subagente (solicitudes del asistente por ejecución). Al superarlo, se inyecta un aviso de orientación para finalizar (consulta task.softRequestBudgetNotice); al alcanzar 1.5 veces el presupuesto, la ejecución se detiene de forma forzada y el agente debe devolver sus hallazgos parciales. 0 desactiva esta protección. Los agentes incluidos scout/sonic tienen un límite integrado menor, por lo que un valor inferior a ese límite también se les aplica. Una entrada task.agentSoftRequestBudget reemplaza este presupuesto para el agente que identifica."
"settings.setting.task.softRequestBudgetNotice.label" = "Aviso de presupuesto flexible de solicitudes"
"settings.setting.task.softRequestBudgetNotice.description" = "Inyecta un aviso de orientación cuando un subagente supera su presupuesto flexible de solicitudes, pidiéndole que finalice antes de la detención forzada al alcanzar 1.5 veces el presupuesto."
"settings.setting.task.maxEffort.label" = "Límite heredado de esfuerzo por creación"
"settings.setting.task.maxEffort.description" = "Solo en el modo heredado de esfuerzo: limita las indicaciones generales de esfuerzo por creación y el esfuerzo del modelo por llamada. Los niveles explícitos se ajustan al mayor esfuerzo admitido que no supere este límite; se rechazan los modelos por llamada que no admitan ningún esfuerzo igual o inferior a este. La reactivación en frío vuelve a aplicar el límite. En cambio, el modo de reemplazo usa reglas de esfuerzo por modelo."
"settings.setting.task.prewalk.label" = "Prewalk de tarea genérica"
"settings.setting.task.prewalk.description" = "Activa prewalk para el subagente genérico `task` incluido: comienza con su modelo resuelto, planifica e inicia la implementación, y luego transfiere el control al rol 'smol' en su primera llamada a `edit` o `write`. Las sobrescrituras por agente (task.agentPrewalk, configuradas desde el centro /agents) y el frontmatter `prewalk` del agente de usuario se aplican independientemente de este interruptor."
"settings.setting.task.showResolvedModelBadge.label" = "Mostrar insignia del modelo resuelto"
"settings.setting.task.showResolvedModelBadge.description" = "Muestra el ID del modelo que usa realmente cada subagente en la línea de estado del widget de tareas"
"settings.setting.stt.enabled.label" = "Voz a texto"
"settings.setting.stt.enabled.description" = "Activa la entrada de voz a texto mediante el micrófono"
"settings.setting.stt.submitTrigger.label" = "Activador de envío de voz a texto"
"settings.setting.stt.submitTrigger.description" = "Elige cuándo se envía automáticamente el dictado por voz: nunca, al soltar (2 o más palabras), al soltar con una oración completa o cuando diga enviar."
"settings.setting.stt.wake.enabled.label" = "Escucha de palabra de activación"
"settings.setting.stt.wake.enabled.description" = "Escucha localmente la palabra computer, luego graba y envía una solicitud completa. Al desactivarlo, se cierra el micrófono de activación."
"settings.setting.stt.wake.silenceMs.label" = "Tiempo de espera por silencio de activación"
"settings.setting.stt.wake.silenceMs.description" = "Milisegundos de silencio que finalizan una solicitud hablada, ajustados al intervalo de 200–30000."
"settings.setting.stt.wake.speechSensitivity.label" = "Sensibilidad de voz para solicitudes por activación"
"settings.setting.stt.wake.speechSensitivity.description" = "Después del tono, alta evita que la voz más baja se considere silencio, pero el ruido de fondo puede retrasar el envío. Baja rechaza más ruido. Normal conserva el umbral existente. No cambia la detección de la palabra de activación ni el dictado manual."
"settings.setting.stt.wake.cancelMs.label" = "Tiempo de espera por activación accidental"
"settings.setting.stt.wake.cancelMs.description" = "Cancela sin enviar si no se detecta voz después del tono, ajustado al intervalo de 2000–5000 ms."
"settings.setting.stt.wake.endWord.label" = "Palabra de finalización de activación"
"settings.setting.stt.wake.endWord.description" = "Palabra opcional que se dice para finalizar una solicitud. Si está vacía, solo se usa el silencio. Se reconoce localmente y se elimina antes del envío."
"settings.setting.stt.wake.chirpPath.label" = "Sonido de activación"
"settings.setting.stt.wake.chirpPath.description" = "Ruta a un sonido de activación WAV mono PCM16. Si está vacía, se reproduce un tono breve generado; no se incluye ninguna grabación."
"settings.setting.stt.wake.continueChirpPath.label" = "Sonido de continuación de activación"
"settings.setting.stt.wake.continueChirpPath.description" = "Ruta a un archivo WAV mono PCM16 de hasta dos segundos, que se reproduce cuando termina la captura de voz y comienza la transcripción. Si está vacía, no se reproduce ningún sonido."
"settings.setting.stt.wake.endChirpPath.label" = "Sonido de finalización de activación"
"settings.setting.stt.wake.endChirpPath.description" = "Ruta a un archivo WAV mono PCM16 de hasta dos segundos, que se reproduce cuando la transcripción se completa correctamente, antes de enviar el texto transcrito. Si está vacía, no se reproduce ningún sonido."
"settings.setting.stt.wake.suppressWhileSpeaking.label" = "Suprimir la palabra de activación mientras habla"
"settings.setting.stt.wake.suppressWhileSpeaking.description" = "Al activarlo, evita que la propia voz de NeoPi active la palabra de activación a través de los altavoces. Al desactivarlo, puedes interrumpir diciendo \"computer\", pero necesitas audífonos o cancelación de eco."
"settings.setting.stt.wake.playbackTailMs.label" = "Tiempo residual de eco de reproducción para activación"
"settings.setting.stt.wake.playbackTailMs.description" = "Con la supresión de activación habilitada, ignora el audio del micrófono durante esta cantidad de milisegundos después de que habla el asistente. Se ajusta al intervalo de 0–3000. El tono de disponibilidad no tiene retraso residual."
"settings.setting.chat.mode.label" = "Modo de chat"
"settings.setting.chat.mode.description" = "Modo predeterminado para nuevas sesiones. Los modos de chat eliminan el contexto del agente de programación (herramientas, habilidades, reglas, memoria, recordatorios); --chat lo sobrescribe, las sesiones reanudadas conservan su modo registrado"
"settings.setting.chat.include.label" = "Elementos incluidos en el modo de chat"
"settings.setting.memory.backend.label" = "Backend de memoria"
"settings.setting.memory.backend.description" = "Desactivado, pipeline local de resumen, Mnemopi SQLite, memoria remota Hindsight o Sharpshooter"
"settings.setting.hindsight.apiUrl.label" = "URL de la API de Hindsight"
"settings.setting.hindsight.apiUrl.description" = "URL del servidor Hindsight (Cloud o alojado por ti)"
"settings.setting.hindsight.apiToken.label" = "Token de la API de Hindsight"
"settings.setting.hindsight.apiToken.description" = "Token Bearer para servidores Hindsight autenticados"
"settings.setting.hindsight.bankId.label" = "ID del banco de Hindsight"
"settings.setting.hindsight.bankId.description" = "Identificador del banco de memoria (predeterminado: nombre del proyecto)"
"settings.setting.hindsight.scoping.label" = "Definición de ámbito de Hindsight"
"settings.setting.hindsight.scoping.description" = "global = un banco compartido; per-project = un banco aislado por cwd; per-project-tagged = un banco compartido con etiquetas de proyecto para que las memorias globales y del proyecto se combinen al recuperarlas"
"settings.setting.hindsight.globalScope.label" = "Ámbito global de Hindsight"
"settings.setting.hindsight.globalScope.description" = "Permite que retain y learn acepten scope: global, que almacena una memoria sin la etiqueta del proyecto para que todos los proyectos la recuperen. Requiere un ámbito global o etiquetado por proyecto"
"settings.setting.hindsight.autoRecall.label" = "Recuperación automática de Hindsight"
"settings.setting.hindsight.autoRecall.description" = "Recupera memorias en el primer turno de cada sesión"
"settings.setting.hindsight.autoRetain.label" = "Retención automática de Hindsight"
"settings.setting.hindsight.autoRetain.description" = "Retiene la transcripción cada N turnos y en los límites de la sesión"
"settings.setting.hindsight.retainMode.label" = "Modo de retención de Hindsight"
"settings.setting.hindsight.retainMode.description" = "full-session = inserta o actualiza un documento por sesión, last-turn = dividido en fragmentos"
"settings.setting.hindsight.mentalModelsEnabled.label" = "Modelos mentales de Hindsight"
"settings.setting.hindsight.mentalModelsEnabled.description" = "Lee resúmenes seleccionados de reflect (modelos mentales) en las instrucciones para desarrolladores al iniciar. Carga los modelos existentes en el banco; no escribe. Combínalo con hindsight.mentalModelAutoSeed para crear también automáticamente el conjunto inicial integrado."
"settings.setting.hindsight.mentalModelAutoSeed.label" = "Inicialización automática de modelos mentales de Hindsight"
"settings.setting.hindsight.mentalModelAutoSeed.description" = "Al iniciar la sesión, crea los modelos mentales integrados (project-conventions, project-decisions, user-preferences) que aún no existan en el banco."
"settings.setting.lsp.enabled.label" = "LSP"
"settings.setting.lsp.enabled.description" = "Integración con servidores de lenguaje: la herramienta lsp, diagnósticos al escribir o editar y formato al escribir (--no-lsp lo desactiva para la ejecución)"
"settings.setting.lsp.lazy.label" = "Inicio diferido de LSP"
"settings.setting.lsp.lazy.description" = "Inicia los servidores de lenguaje al usarlos por primera vez (con la herramienta lsp o al editar un tipo de archivo correspondiente) en lugar de al iniciar la sesión"
"settings.setting.lsp.shared.label" = "Servidores de lenguaje compartidos"
"settings.setting.lsp.formatOnWrite.label" = "Aplicar formato al escribir"
"settings.setting.lsp.formatOnWrite.description" = "Aplica formato automáticamente a los archivos de código mediante LSP después de escribirlos"
"settings.setting.lsp.diagnosticsOnWrite.label" = "Diagnósticos al escribir"
"settings.setting.lsp.diagnosticsOnWrite.description" = "Devuelve los diagnósticos de LSP después de escribir archivos de código"
"settings.setting.lsp.diagnosticsOnEdit.label" = "Diagnósticos al editar"
"settings.setting.lsp.diagnosticsOnEdit.description" = "Devuelve los diagnósticos de LSP después de editar archivos de código"
"settings.setting.lsp.diagnosticsDeduplicate.label" = "Eliminar diagnósticos duplicados"
"settings.setting.lsp.diagnosticsDeduplicate.description" = "Suprime los diagnósticos de LSP posteriores a la edición que ya se mostraron para un archivo; solo muestra los nuevos o modificados"
"settings.setting.lsp.requestTimeout.label" = "Tiempo de espera de solicitudes"
"settings.setting.lsp.requestTimeout.description" = "Segundos de espera para los diagnósticos, la información al pasar el cursor y otras respuestas de un servidor de lenguaje cuando el agente no establece un tiempo de espera; los diagnósticos tardíos posteriores a la edición esperan al menos este tiempo. Auméntalo para servidores que tardan en arrancar en frío. El argumento de tiempo de espera de la herramienta lsp aún puede aumentarlo o reducirlo en cada llamada"
"settings.setting.share.serverUrl.label" = "Servidor para compartir"
"settings.setting.share.serverUrl.description" = "Base del visor y de carga para compartir que utiliza /share (carga de blob cifrado + visor; los enlaces tienen el formato <base>/<id>#<key>)"
"settings.setting.share.store.label" = "Almacén para compartir"
"settings.setting.share.store.description" = "Dónde carga /share el blob cifrado de la sesión"
"settings.setting.share.redactSecrets.label" = "Ocultación de secretos al compartir"
"settings.setting.share.redactSecrets.description" = "Ejecuta el ofuscador de secretos en las instantáneas de /share antes de cargarlas (usa la configuración secrets.*)"
"settings.setting.ida.python.label" = "Python de IDA"
"settings.setting.ida.python.description" = "Intérprete de Python que puede importar ida_domain e idapro; si está vacío, se detecta automáticamente"
"settings.setting.ida.installDir.label" = "Directorio de instalación de IDA"
"settings.setting.ida.installDir.description" = "Directorio que contiene libidalib, exportado como IDADIR; si está vacío, se detecta automáticamente ($IDADIR, ida-config.json, rutas de instalación estándar)"
"settings.setting.spotlight.experiment.enabled.label" = "Experimento de Spotlight"
"settings.setting.spotlight.experiment.enabled.description" = "Adapta la salida de las herramientas y clasifica los resultados de find con Stencil Spotlight, y registra cada resultado adaptado en la sesión"
"settings.setting.exa.enabled.label" = "Exa"
"settings.setting.exa.enabled.description" = "Activa el proveedor de búsqueda web Exa"
"settings.setting.exa.searchDelayMs.label" = "Intervalo de búsqueda de Exa"
"settings.setting.exa.searchDelayMs.description" = "Intervalo mínimo entre solicitudes de búsqueda web de Exa en milisegundos; establece 0 para desactivar el control de frecuencia"
"settings.setting.searxng.endpoint.label" = "Punto de conexión de SearXNG"
"settings.setting.searxng.endpoint.description" = "URL base de una instancia de SearXNG alojada por ti que se utiliza para la búsqueda web"
"settings.setting.voice.postprocess.label" = "Instrucción para la respuesta de voz local"
"settings.setting.voice.postprocess.description" = "Prompt opcional tiny/smol para la respuesta hablada completa. Si está vacío, se lee literalmente. Usa /voice para activarlo en esta sesión."
"settings.setting.tts.localVoice.label" = "Voz de TTS local"
"settings.setting.tts.localVoice.description" = "Voz de Phonon utilizada por el backend de TTS local (estadounidense/británica, femenina/masculina)"
"settings.setting.tts.localSpeed.label" = "Velocidad de TTS local"
"settings.setting.tts.localSpeed.description" = "Velocidad de habla del backend de TTS local (herramienta tts, omp say). 1 = normal; limitada al rango de 0.8–1.3"
"settings.setting.speech.enabled.label" = "Vocalización del habla"
"settings.setting.speech.enabled.description" = "Lee en voz alta la salida del asistente por los altavoces mientras se transmite"
"settings.setting.speech.mode.label" = "Modo de vocalización del habla"
"settings.setting.speech.mode.description" = "Qué leer en voz alta: all = mensajes del asistente + razonamiento; assistant = solo mensajes; yield = solo el mensaje final al terminar el turno"
"settings.setting.speech.enhanced.label" = "Reescritura mejorada para voz"
"settings.setting.speech.enhanced.description" = "Reescribe la salida del asistente como prosa natural para lectura en voz alta con el modelo tiny/smol antes de la síntesis (describe el código y elimina enlaces y markdown). Si falla, recurre a la limpieza mecánica"
"settings.setting.speech.voice.label" = "Voz para la lectura en voz alta"
"settings.setting.speech.voice.description" = "Voz de Phonon que se usa para leer en voz alta la salida del asistente"
"settings.setting.speech.speed.label" = "Velocidad de lectura en voz alta"
"settings.setting.speech.speed.description" = "Velocidad al leer en voz alta la salida del asistente. 1 = normal; limitada a 0.8–1.3"
"settings.setting.tts.pacingThreads.label" = "Kokoro con ritmo controlado: hilos de CPU"
"settings.setting.tts.pacingThreads.description" = "Hilos intraoperación de ONNX para el motor con ritmo controlado. 0 conserva el valor predeterminado del entorno de ejecución; prueba 2 para reducir la contención. Los cambios recargan su modelo"
"settings.setting.tts.pacing.label" = "Kokoro con ritmo controlado: ritmo"
"settings.setting.tts.pacing.description" = "Espera entre segmentos de síntesis mientras se reproduce la voz almacenada en búfer. Solo afecta al motor Kokoro con ritmo controlado"
"settings.setting.tts.pacingMarginMs.label" = "Kokoro con ritmo controlado: margen de seguridad"
"settings.setting.tts.pacingMarginMs.description" = "Inicia la síntesis esta cantidad de milisegundos antes de su plazo previsto. Auméntala si hay interrupciones en la reproducción"
"settings.setting.tts.segmentMinChars.label" = "Kokoro con ritmo controlado: segmento mínimo"
"settings.setting.tts.segmentMinChars.description" = "Cantidad mínima de caracteres antes de un límite preferido, salvo en el primer segmento o el resto final"
"settings.setting.tts.segmentMaxChars.label" = "Kokoro con ritmo controlado: segmento máximo"
"settings.setting.tts.segmentMaxChars.description" = "Objetivo de caracteres, limitado a 40–280. Las citas, los paréntesis y las palabras indivisibles pueden excederlo"
"settings.setting.tts.segmentFirstChars.label" = "Kokoro con ritmo controlado: primer segmento"
"settings.setting.tts.segmentFirstChars.description" = "Objetivo reducido de caracteres para el primer segmento, para iniciar la lectura rápidamente, limitado a la longitud máxima del segmento"
"settings.setting.tts.segmentMaxWords.label" = "Kokoro con ritmo controlado: objetivo estricto de palabras"
"settings.setting.tts.segmentMaxWords.description" = "Objetivo alternativo de cantidad de palabras cuando no encaja ningún punto de referencia preferido. Las cláusulas encerradas se mantienen juntas"
"settings.setting.tts.segmentSentences.label" = "Kokoro con ritmo controlado: límites de oración"
"settings.setting.tts.segmentSentences.description" = "Da prioridad a los finales de oración con punto sobre todas las demás reglas de delimitación"
"settings.setting.tts.segmentCommas.label" = "Kokoro con ritmo controlado: límites en comas"
"settings.setting.tts.segmentCommas.description" = "Da prioridad a las comas después de los finales de oración en la jerarquía de límites"
"settings.setting.tts.segmentConjunctions.label" = "Kokoro con ritmo controlado: límites en conjunciones"
"settings.setting.tts.segmentConjunctions.description" = "Corta antes de and, or o because cuando no encaja ningún límite de oración o coma"
"settings.setting.tts.segmentPunctuation.label" = "Kokoro con ritmo controlado: otros signos de puntuación"
"settings.setting.tts.segmentPunctuation.description" = "Usa límites en dos puntos, punto y coma, signos de exclamación e interrogación y comillas o paréntesis de cierre antes de cortar por palabras"
"settings.setting.tts.segmentEllipsis.label" = "Kokoro con ritmo controlado: límites en puntos suspensivos"
"settings.setting.tts.segmentEllipsis.description" = "Trata una secuencia de puntos como un solo final de oración. Cuando está desactivado, solo un punto individual termina una oración"
"settings.setting.irc.operator.handle.label" = "Identificador del operador de IRC"
"settings.setting.irc.operator.handle.description" = "Tu identificador de IRC: los agentes te envían mensajes a ese identificador y lo que envías desde /irc o el visor de IRC proviene de él. Entra en vigor la próxima vez que se inicie npi"
"settings.setting.irc.operator.viewerEnabled.label" = "Visor de IRC"
"settings.setting.irc.operator.viewerEnabled.description" = "Permite que la tecla del visor de IRC abra el historial de mensajes entre agentes de esta sesión"
"settings.setting.irc.operator.relayToMainTranscript.label" = "Anunciar IRC entre agentes"
"settings.setting.irc.operator.relayToMainTranscript.description" = "Permite que la voz en vivo, los sonidos de eventos y los clientes conectados reciban los mensajes entre otros agentes. Esos mensajes nunca se muestran en la transcripción principal; el visor de IRC conserva todos los mensajes en ambos casos"
"settings.setting.irc.history.maxEntries.label" = "Tamaño del historial de IRC"
"settings.setting.irc.history.maxEntries.description" = "Cantidad máxima de mensajes que el visor de IRC conserva por proceso; los más antiguos se eliminan primero"
"settings.setting.advisor.enabled.label" = "Activar Advisor"
"settings.setting.advisor.enabled.description" = "Vincula un segundo modelo (asignado al rol 'advisor') que revisa pasivamente cada turno e inserta notas."
"settings.setting.advisor.syncBacklog.label" = "Sincronización de revisiones pendientes de Advisor"
"settings.setting.advisor.syncBacklog.description" = "Pausa el agente principal hasta que la cantidad de revisiones pendientes de Advisor quede por debajo del umbral. Los valores numéricos limitan la espera a 30 segundos; strict espera todas las revisiones programadas sin límite de tiempo real. Off desactiva las demoras para ponerse al día. La cancelación, los fallos y la eliminación finalizan las esperas."
"settings.setting.advisor.immuneTurns.label" = "Turnos de inmunidad de Advisor"
"settings.setting.advisor.immuneTurns.description" = "Después de que una inquietud o un bloqueo de Advisor cause una interrupción, envía las inquietudes posteriores como comentarios que no interrumpen durante esta cantidad de turnos principales. Los bloqueos están exentos del período de espera."
"settings.setting.advisor.continueSeverity.label" = "Gravedad para continuar con Advisor"
"settings.setting.advisor.continueSeverity.description" = "Gravedad mínima de una nota de Advisor que reactiva al agente después de que termine con una respuesta final. Las notas de menor gravedad permanecen como una tarjeta al final de la transcripción y llegan al agente con tu siguiente mensaje."
"settings.setting.advisor.reviewMode.label" = "Modo de revisión de Advisor"
"settings.setting.advisor.reviewMode.description" = "Frecuencia predeterminada de Advisor cuando no hay una lista WATCHDOG.yml. turn revisa cada turno principal; agent-end solo revisa las entregas finales."
"settings.setting.advisor.reviewInterval.label" = "Intervalo de revisión de Advisor"
"settings.setting.advisor.reviewInterval.description" = "Frecuencia predeterminada de Advisor cuando no hay una lista WATCHDOG.yml: revisa cada N actualizaciones principales aptas. 1 = cada actualización. Las actualizaciones omitidas se envían con la siguiente revisión programada."
"settings.setting.advisor.maxNotesPerUpdate.label" = "Máximo de notas de Advisor por actualización"
"settings.setting.advisor.maxNotesPerUpdate.description" = "Cantidad máxima de notas de asesoramiento que no son bloqueos aceptadas por actualización del prompt de Advisor (1–32; la interfaz ofrece opciones rápidas de 1–5). Los bloqueos están exentos."
"settings.setting.advisor.evictStaleResults.label" = "Descartar resultados antiguos de Advisor"
"settings.setting.advisor.evictStaleResults.description" = "Antes de cada revisión, reemplaza la salida de read/grep/glob de Advisor de revisiones anteriores con un marcador breve. Se conserva la revisión más reciente."
"settings.setting.stream.serverUrl.label" = "Servidor de Stream"
"settings.setting.stream.redactPatterns.label" = "Patrones adicionales de censura"
"settings.setting.stream.redactPatterns.description" = "Expresiones regulares adicionales que se censuran en cada fila transmitida, además de los valores de env/secrets.yml y los patrones de credenciales integrados"
"settings.setting.notifyAgent.when.label" = "Notificar al agente cuando..."
"settings.setting.notifyAgent.when.description" = "Elige qué eventos pueden iniciar un turno para el agente principal inactivo y, por separado, después de que Ctrl+C detenga una ejecución. Los eventos no seleccionados siguen llegando al contexto sin iniciar un turno. Las reglas de temporización y gravedad de Advisor siguen aplicándose."
"settings.setting.session.worktreeScope.label" = "Ámbito de worktree para reanudar"
"settings.setting.session.worktreeScope.description" = "Elige si la carpeta actual del selector para reanudar incluye sesiones de otros worktrees del repositorio"
"settings.setting.power.sleepPrevention.label" = "Prevención de suspensión"
"settings.setting.power.sleepPrevention.description" = "Evita que el sistema entre en suspensión mientras el agente ejecuta un turno; una sesión inactiva, incluida una que espera trabajos en segundo plano, no impide la suspensión. Cada nivel es acumulativo: añade las flags de todos los niveles inferiores."
"settings.setting.prewalk.enabled.label" = "Activar Prewalk"
"settings.setting.prewalk.enabled.description" = "Planifica con el equipo de planificación configurado y luego transfiere el trabajo al equipo de ejecución en la primera llamada a `edit` o `write` una vez creada la lista de tareas. Está desactivado de forma predeterminada; --prewalk / --no-prewalk anulan esta configuración para la sesión."
"settings.setting.prewalk.planner.label" = "Selector de planificación"
"settings.setting.prewalk.planner.description" = "Alias de rol o provider/model:effort seleccionado para la planificación al iniciar, con /new, /prewalk y al reiniciar. Si está vacío, mantiene el modelo activo, excepto al reiniciar, cuando vuelve a @default."
"settings.setting.prewalk.execution.label" = "Selector de ejecución"
"settings.setting.prewalk.execution.description" = "Alias de rol o provider/model:effort para las transferencias manuales o configuradas, incluidas las de /prewalk y el reinicio. --prewalk-into anula este selector durante una sesión. Auto-prewalk usa su propio destino."
"settings.setting.prewalk.plannerFallbacks.label" = "Alternativas de planificación"
"settings.setting.prewalk.plannerFallbacks.description" = "Alias de rol o selectores provider/model:effort ordenados que se prueban cuando el selector de planificación no está disponible."
"settings.setting.prewalk.executionFallbacks.label" = "Alternativas de ejecución"
"settings.setting.prewalk.executionFallbacks.description" = "Alias de rol o selectores provider/model:effort ordenados que se prueban cuando el selector de ejecución no está disponible."
"settings.setting.prewalk.auto.label" = "Prewalk automático"
"settings.setting.prewalk.auto.description" = "Pregunta al juez nativo resuelto mediante el rol 'judge' si cada nueva tarea de usuario de nivel superior concentra su razonamiento difícil al principio. Requiere un juez nativo; sin uno, no se clasifica nada. Es independiente de la activación de Prewalk."
"settings.setting.prewalk.autoTarget.label" = "Destino de auto-prewalk"
"settings.setting.prewalk.autoTarget.description" = "Modelo o rol (por defecto '@smol') al que auto-prewalk transfiere el trabajo en la primera llamada a `edit` o `write`."
"settings.setting.providers.maxInFlightRequests.label" = "Máximo de solicitudes en curso"
"settings.setting.images.describeForTextModels.label" = "Describir imágenes para modelos de texto"
"settings.setting.images.describeForTextModels.description" = "Cuando se adjunta una imagen a un modelo sin compatibilidad con visión, guárdala en local:// e inserta una descripción de un modelo compatible con visión en lugar de descartarla"
"settings.setting.defaultThinkingLevel.label" = "Nivel de razonamiento"
"settings.setting.defaultThinkingLevel.description" = "Profundidad de razonamiento para modelos compatibles con razonamiento"
"settings.setting.hideThinkingBlock.label" = "Ocultar bloques de razonamiento"
"settings.setting.hideThinkingBlock.description" = "Oculta los bloques de razonamiento en las respuestas del asistente"
"settings.setting.expandThinkingBlocks.label" = "Expandir bloques de razonamiento"
"settings.setting.expandThinkingBlocks.description" = "Mantiene expandidos los bloques de razonamiento terminados en lugar de contraerlos al finalizar el turno"
"settings.setting.proseOnlyThinking.label" = "Razonamiento solo en prosa"
"settings.setting.proseOnlyThinking.description" = "Omite los bloques de código de los resúmenes de razonamiento y los reemplaza por puntos suspensivos"
"settings.setting.omitThinking.label" = "Omitir resúmenes de razonamiento"
"settings.setting.omitThinking.description" = "Indica a los proveedores que omitan por completo los resúmenes de razonamiento de las respuestas (cuando sea compatible)"
"settings.setting.externalThinking.label" = "Razonamiento externo"
"settings.setting.externalThinking.description" = "Área de trabajo privada; no se muestra al usuario. Desactiva el razonamiento compatible de GPT, Claude y Gemini"
"settings.setting.externalThinking.warning" = "Bajo tu propio riesgo: los proveedores han marcado este formato de solicitud como abuso, lo que puede llevar a medidas a nivel de cuenta"
"settings.setting.model.loopGuard.enabled.label" = "Protección contra bucles"
"settings.setting.model.loopGuard.enabled.description" = "Activa la detección automática de bucles en el flujo de razonamiento y prosa del modelo"
"settings.setting.model.loopGuard.checkAssistantContent.label" = "Analizar prosa con protección contra bucles"
"settings.setting.model.loopGuard.checkAssistantContent.description" = "Aplica la protección contra bucles a los mensajes en prosa del asistente además de a los registros de razonamiento"
"settings.setting.model.loopGuard.toolCallReminder.label" = "Recordatorio de llamada a herramienta de la protección contra bucles"
"settings.setting.model.loopGuard.toolCallReminder.description" = "Cuando un flujo de razonamiento de Gemini emite muchos encabezados de planificación consecutivos sin llamar a una herramienta, lo interrumpe e inserta un recordatorio para realizar una llamada a herramienta (requiere la protección contra bucles)"
"settings.setting.model.toolCallLoopGuard.enabled.label" = "Protección contra bucles de llamadas a herramientas"
"settings.setting.model.toolCallLoopGuard.enabled.description" = "Detecta llamadas idénticas consecutivas a herramientas entre turnos e inserta un mensaje de orientación correctivo"
"settings.setting.model.toolCallLoopGuard.threshold.label" = "Umbral de bucle de llamadas a herramientas"
"settings.setting.model.toolCallLoopGuard.threshold.description" = "Número de llamadas idénticas consecutivas a herramientas necesario antes de insertar el mensaje de orientación correctivo"
"settings.setting.model.toolCallLoopGuard.exemptTools.label" = "Herramientas exentas de la protección contra bucles de llamadas"
"settings.setting.model.toolCallLoopGuard.exemptTools.description" = "Nombres de herramientas o nombres de dispositivos xd:// de despachos de escritura (por ejemplo, mcp__peers_wait) que pueden repetirse consecutivamente sin activar la protección contra bucles entre turnos"
"settings.setting.inlineToolDescriptors.label" = "Descriptores de herramientas en el prompt"
"settings.setting.inlineToolDescriptors.description" = "Incluye los descriptores completos de las herramientas en el prompt del sistema y elimina las descripciones de nivel superior y anidadas de los esquemas de herramientas del proveedor para que el texto de los descriptores se envíe una sola vez. La opción automática lo activa para los modelos Gemini y lo desactiva en los demás casos"
"settings.setting.includeModelInPrompt.label" = "Incluir modelo en el prompt"
"settings.setting.includeModelInPrompt.description" = "Incluye el identificador del modelo activo en el prompt del sistema para que el agente sepa qué modelo es"
"settings.setting.includeWorkspaceTree.label" = "Incluir árbol del espacio de trabajo"
"settings.setting.includeWorkspaceTree.description" = "Incluye el árbol de directorios del espacio de trabajo en el prompt del sistema. ADVERTENCIA: Esto puede invalidar la caché del prompt entre sesiones cuando se modifican archivos."
"settings.setting.encourageEdits.label" = "Fomentar ediciones"
"settings.setting.encourageEdits.description" = "Exigir la herramienta edit para editar archivos y prohibir ediciones con sed/perl/python"
"settings.setting.skillful.label" = "Listar habilidades en el prompt"
"settings.setting.skillful.description" = "Listar las habilidades disponibles en el prompt del sistema; desactiva esta opción para ahorrar contexto y alternarla por sesión con /skillful"
"settings.setting.personality.label" = "Personalidad"
"settings.setting.personality.description" = "Estilo de comunicación incluido en el bloque de personalidad del prompt del sistema"
"settings.setting.temperature.label" = "Temperatura"
"settings.setting.temperature.description" = "Temperatura de muestreo (0 = determinista, 1 = creativo, -1 = valor predeterminado del proveedor)"
"settings.setting.topP.label" = "Top P"
"settings.setting.topP.description" = "Umbral de corte del muestreo por núcleo (0-1, -1 = valor predeterminado del proveedor)"
"settings.setting.topK.label" = "Top K"
"settings.setting.topK.description" = "Muestrear entre los K tokens más probables (-1 = valor predeterminado del proveedor)"
"settings.setting.minP.label" = "Min P"
"settings.setting.minP.description" = "Umbral mínimo de probabilidad (0-1, -1 = valor predeterminado del proveedor)"
"settings.setting.presencePenalty.label" = "Penalización de presencia"
"settings.setting.presencePenalty.description" = "Penalización por introducir tokens ya presentes (-1 = valor predeterminado del proveedor)"
"settings.setting.repetitionPenalty.label" = "Penalización de repetición"
"settings.setting.repetitionPenalty.description" = "Penalización por tokens repetidos (-1 = valor predeterminado del proveedor)"
"settings.setting.textVerbosity.label" = "Nivel de detalle del texto"
"settings.setting.textVerbosity.description" = "Nivel de detalle de las respuestas de OpenAI Responses y Codex (bajo, medio o alto)"
"settings.setting.tier.openai.label" = "Nivel de servicio — OpenAI"
"settings.setting.tier.openai.description" = "Nivel de procesamiento para solicitudes de OpenAI / OpenAI-Codex y modelos de la familia OpenAI enrutados mediante OpenRouter (ninguno = omitir). Se envía como `service_tier`."
"settings.setting.tier.anthropic.label" = "Nivel de servicio — Anthropic"
"settings.setting.tier.anthropic.description" = "Nivel de procesamiento para solicitudes de Claude. `priority` activa el modo rápido (`speed: \"fast\"`) en los modelos directos de Anthropic compatibles; se ignora en Claude de Bedrock/Vertex y mediante OpenRouter."
"settings.setting.tier.google.label" = "Nivel de servicio — Google"
"settings.setting.tier.google.description" = "Nivel de procesamiento para solicitudes de Gemini (Google AI Studio + Vertex) y modelos de la familia Google enrutados mediante OpenRouter (ninguno = omitir). Se envía como el campo `serviceTier` de nivel superior."
"settings.setting.tier.subagent.label" = "Nivel de servicio — subagente"
"settings.setting.tier.subagent.description" = "Nivel de servicio para subagentes de tareas o evaluación iniciados. Heredar = usar los niveles activos por familia del agente principal (sigue /fast); elige un valor para aplicarlo a la familia a la que pertenezca el modelo del subagente."
"settings.setting.tier.advisor.label" = "Nivel de servicio — Advisor"
"settings.setting.tier.advisor.description" = "Nivel de servicio para el modelo de Advisor. Ninguno = procesamiento estándar; heredar = usar los niveles activos por familia del agente principal; elige un valor para aplicarlo a la familia del modelo de Advisor."
"settings.setting.retry.maxRetries.label" = "Intentos de reintento"
"settings.setting.retry.maxRetries.description" = "Número máximo de reintentos ante errores de API"
"settings.setting.retry.maxDelayMs.label" = "Espera máxima entre reintentos"
"settings.setting.retry.maxDelayMs.description" = "Espera máxima entre reintentos, en ms. Cuando el proveedor solicita esperar más tiempo y ninguna alternativa de credenciales o modelo tiene éxito, la solicitud falla de inmediato en lugar de esperar (por ejemplo, ventanas de límite de frecuencia de Anthropic de 3 horas). 0 desactiva el límite para permitir que la sesión se reanude automáticamente cuando el proveedor indique que se restableció la cuota."
"settings.setting.retry.waitForUsageReset.label" = "Esperar el restablecimiento del uso"
"settings.setting.retry.modelFallback.label" = "Alternativa de modelo para reintentos"
"settings.setting.retry.modelFallback.description" = "Permitir que la recuperación mediante reintentos cambie a los modelos de retry.fallbackChains después de errores del proveedor. Independiente de la promoción automática de contexto"
"settings.setting.retry.fallbackOn.label" = "Activador de alternativa"
"settings.setting.retry.fallbackOn.description" = "Qué solicitudes fallidas pueden cambiar a un modelo alternativo configurado"
"settings.setting.retry.rateLimitWalksChain.label" = "Recorrer la cadena ante límites de frecuencia"
"settings.setting.retry.rateLimitWalksChain.description" = "Ante un límite de frecuencia, no detener el recorrido de retry.fallbackChains para un turno cuyo razonamiento esté firmado por el modelo que falla. Si está desactivado (valor predeterminado), ese turno sigue reintentando con el modelo sujeto al límite de frecuencia hasta agotar retry.maxRetries antes de recurrir a la cadena."
"settings.setting.retry.usageAwareFallback.label" = "Alternativa según el uso"
"settings.setting.retry.usageAwareFallback.description" = "Usar informes confiables de cuota de planes de programación para priorizar las cuentas del mismo proveedor y luego los modelos alternativos configurados, antes de alcanzar un límite de uso estricto. Se excluyen las claves de API configuradas ordinarias."
"settings.setting.retry.usageReservePct.label" = "Margen de reserva"
"settings.setting.retry.usageReservePct.description" = "Considerar que un modelo de un plan de programación está cerca de su límite cuando el porcentaje restante sea inferior a este valor. Si el uso es desconocido o no está asociado, se mantiene el modelo principal."
"settings.setting.retry.usageReservePolicy.label" = "Política de reserva"
"settings.setting.retry.usageReservePolicy.description" = "Qué hacer cuando todas las cuentas de planes de programación del mismo proveedor están dentro del margen de reserva."
"settings.setting.retry.fallbackChains.label" = "Cadenas de alternativas para reintentos"
"settings.setting.retry.fallbackChains.description" = "Objeto JSON que asigna roles de modelo, selectores de modelo (\"provider/model-id\") o comodines de proveedor (\"provider/*\") a selectores de alternativas ordenados, por ejemplo, {\"default\":[\"openai/gpt-4o-mini\"],\"google-antigravity/*\":[\"google/*\",\"google-vertex/*\"]}. Las claves orientadas a modelos se aplican siempre que ese modelo o proveedor esté activo, independientemente del rol; una entrada \"provider/*\" conserva el ID del modelo que falla y cambia el proveedor. Un comodín con prefijo de ID (\"openrouter/google/*\") reemplaza el prefijo del ID base del modelo que falla (google-antigravity/gemini-x -> openrouter/google/gemini-x) y, cuando se usa como clave, solo coincide con los ID de ese proveedor bajo el prefijo. Una entrada de alternativa puede incluir un sufijo explícito de razonamiento (\"provider/model:low\", \":high\", \":max\", \":off\"); una entrada sin sufijo hereda el esfuerzo del turno fallido y las entradas \"provider/*\" siempre lo heredan."
"settings.setting.retry.fallbackRevertPolicy.label" = "Política de retorno desde la alternativa"
"settings.setting.retry.fallbackRevertPolicy.description" = "Cuándo volver al modelo principal después de usar una alternativa"
"settings.setting.providers.anthropic.serverSideFallback.label" = "Alternativa de Anthropic del lado del servidor (Fable 5)"
"settings.setting.providers.anthropic.serverSideFallback.description" = "Cuando el clasificador de seguridad de Anthropic bloquea una solicitud de Claude Fable 5 / Mythos 5, reintentarla con Claude Opus 5 del lado del servidor (beta de Anthropic `server-side-fallback-2026-06-01`). Activación opcional: si se deja desactivada, se conserva el comportamiento anterior a la alternativa para todas las solicitudes."
"settings.setting.providers.ollama-cloud.maxConcurrency.label" = "Concurrencia máxima de Ollama Cloud"
"settings.setting.providers.ollama-cloud.maxConcurrency.description" = "Número máximo de ejecuciones simultáneas de subagentes de Ollama Cloud por proceso; 0 desactiva el límite específico del proveedor"
"settings.setting.providers.webSearchTimeoutSeconds.label" = "Tiempo de espera de búsqueda web"
"settings.setting.providers.antigravityEndpoint.label" = "Modo de endpoint de Antigravity"
"settings.setting.providers.antigravityEndpoint.description" = "Estrategia de enrutamiento de endpoints para proveedores google-antigravity (chat, búsqueda, imagen, descubrimiento)"
"settings.setting.providers.fireworksTier.label" = "Nivel de Fireworks"
"settings.setting.providers.fireworksTier.description" = "Ruta de servicio para las solicitudes de Fireworks. Priority envía `service_tier: \"priority\"` para mayor confiabilidad durante los picos de tráfico a un precio más alto; Standard lo omite. Los modelos Fast (`-fast`) ignoran esto: Fast tiene su propia ruta de servicio."
"settings.setting.providers.tinyModelDevice.label" = "Dispositivo para modelos pequeños"
"settings.setting.providers.tinyModelDevice.description" = "Backend de inferencia para modelos pequeños locales (títulos + memoria): un proveedor de ejecución de ONNX, o `mlx` para descargar pesos MLX y ejecutarlos mediante mlx-lm en Apple silicon. Por defecto se usa ONNX solo con CPU. La variable de entorno PI_TINY_DEVICE tiene prioridad sobre esta configuración."
"settings.setting.providers.tinyModelDtype.label" = "Precisión de modelos pequeños"
"settings.setting.providers.tinyModelDtype.description" = "Cuantización/precisión de ONNX para modelos pequeños locales. Por defecto se usa el dtype incluido con cada modelo (q4); una menor precisión es más rápida, una mayor es más fiel. El backend MLX lo ignora (sus repositorios están precuantizados a 4 bits). La variable de entorno PI_TINY_DTYPE tiene prioridad sobre esta configuración."
"settings.setting.providers.autoThinkingMaxEffort.label" = "Límite de razonamiento automático"
"settings.setting.providers.autoThinkingMaxEffort.description" = "Máximo esfuerzo que puede determinar el clasificador `auto`. `xhigh` mantiene al clasificador un nivel por debajo del máximo, por lo que solo un `ultrathink` explícito alcanza `max`; `max` permite que un turno que el clasificador considere excepcional se facture al nivel máximo en los modelos que lo ofrecen."
"settings.setting.features.unexpectedStopDetection.label" = "Detenciones inesperadas"
"settings.setting.features.unexpectedStopDetection.description" = "Recupera automáticamente la ejecución cuando el asistente se detiene sin un mensaje visible. Smart también clasifica las detenciones con solo texto mediante un modelo pequeño."
"settings.setting.providers.kimiApiFormat.label" = "Formato de API de Kimi"
"settings.setting.providers.kimiApiFormat.description" = "Formato de API para el proveedor Kimi Code (auto sigue los metadatos actuales del modelo)"
"settings.setting.providers.openaiWebsockets.label" = "WebSockets de OpenAI Codex"
"settings.setting.providers.openaiWebsockets.description" = "Política de WebSocket solo para modelos de OpenAI Codex"
"settings.setting.providers.openaiResponsesWebsockets.label" = "WebSockets de OpenAI Responses"
"settings.setting.providers.openaiResponsesWebsockets.description" = "Activa esta opción para los modelos estándar de Responses compatibles con el catálogo; false en el modelo o la solicitud la desactiva"
"settings.setting.providers.openaiLiveSteering.label" = "Orientación en vivo de OpenAI"
"settings.setting.providers.openaiLiveSteering.description" = "Entrega los mensajes escritos mientras se transmite una respuesta de GPT-6 a esa misma respuesta mediante el WebSocket de Codex, en lugar de esperar al siguiente límite de llamada a herramienta"
"settings.setting.providers.muse-code.storeResponses.label" = "Respuestas almacenadas de Muse Code"
"settings.setting.providers.muse-code.storeResponses.description" = "Almacena los resultados de Muse Code en los servidores de Meta para que un turno cuya conexión se interrumpa se recupere en lugar de volver a ejecutarse. Las ejecuciones almacenadas conservan los prompts y los resultados en los servidores de Meta."
"settings.setting.providers.openai-codex.daybreak.label" = "Codex Daybreak Blue"
"settings.setting.providers.openai-codex.daybreak.description" = "Solicita automáticamente el programa de acceso cibernético Daybreak Blue en las cuentas de ChatGPT que cumplan los requisitos. OpenAI puede usar el contenido de las sesiones de Daybreak Blue para mejorar sus modelos. No incluye los modelos dedicados de Daybreak Blue (gpt-daybreak-blue-*), que aún pueden ejecutarse como sesiones de Daybreak."
"settings.setting.providers.cacheRetention.label" = "Retención de caché de prompts"
"settings.setting.providers.cacheRetention.description" = "Retención de caché de prompts que se transmite a los proveedores compatibles (Anthropic, Bedrock, OpenRouter, OpenAI)"
"settings.setting.providers.cacheWarming.label" = "Precalentamiento de caché"
"settings.setting.providers.cacheWarming.description" = "Actualiza la entrada de caché del prompt de la última solicitud poco antes de que expire (precalentamiento de Anthropic con max_tokens 0; en los demás casos, repetición con un token)"
"settings.setting.providers.cacheWarmingStrategy.label" = "Estrategia de precalentamiento de caché"
"settings.setting.providers.cacheWarmingStrategy.description" = "Cómo gestionar una llamada larga a una herramienta cuando actualizar la caché deja de ser rentable: compactar el historial antes de que expire la caché o dejar que expire"
"settings.setting.providers.cacheWarmingCompactPercent.label" = "Porcentaje de compactación para mantener la caché"
"settings.setting.providers.cacheWarmingCompactPercent.description" = "Proporción de la ventana de contexto que debe alcanzar un prompt para que una llamada larga a una herramienta pueda gestionarse mediante compactación; se aplica el menor de este valor y el límite de tokens"
"settings.setting.providers.cacheWarmingCompactTokens.label" = "Tokens de compactación para mantener la caché"
"settings.setting.providers.cacheWarmingCompactTokens.description" = "Cantidad de tokens del prompt a partir de la cual una llamada larga a una herramienta puede gestionarse mediante compactación; se aplica el menor de este valor y el porcentaje de la ventana"
"settings.setting.providers.streamFirstEventTimeoutSeconds.label" = "Tiempo de espera del primer evento de transmisión"
"settings.setting.providers.streamFirstEventTimeoutSeconds.description" = "Segundos que se espera el primer evento de transmisión del modelo; -1 usa los valores predeterminados del proveedor o del entorno, 0 desactiva el vigilante"
"settings.setting.providers.streamIdleTimeoutSeconds.label" = "Tiempo de espera por inactividad de transmisión"
"settings.setting.providers.streamIdleTimeoutSeconds.description" = "Segundos que una transmisión del modelo puede permanecer sin actividad entre eventos; -1 usa los valores predeterminados del proveedor o del entorno, 0 desactiva el vigilante"
"settings.setting.providers.openrouterVariant.label" = "Enrutamiento de OpenRouter"
"settings.setting.providers.openrouterVariant.description" = "Sufijo predeterminado de variante de enrutamiento que se agrega a los IDs de modelo de OpenRouter (se reemplaza cuando el selector ya especifica una variante)"
"settings.setting.providers.fetch.label" = "Proveedor de fetch"
"settings.setting.providers.fetch.description" = "Prioridad de los backends de lectura para la herramienta fetch/read de URL"
"settings.setting.providers.webKeyless.label" = "Servicios web sin credenciales"
"settings.setting.providers.webKeyless.description" = "Permite que la búsqueda web y la lectura de URL usen servicios de terceros sin tus credenciales: Parallel, Exa, Firecrawl, Keenable y Perplexity sin clave, el lector de Jina y motores consultados mediante scraping (Startpage, DuckDuckGo, Ecosia, Google, Mojeek, Hacker News). Si está desactivado, solo se ejecutan los servicios que configuraste."
"settings.setting.codexResets.minBlockedMinutes.label" = "Bloqueo mínimo para canje automático de Codex"
"settings.setting.codexResets.minBlockedMinutes.description" = "Canjea automáticamente solo cuando falte al menos esta cantidad de minutos para el desbloqueo natural —el último reinicio entre las ventanas agotadas de 5 horas y semanal— (no gasta un crédito escaso para ahorrar una espera corta). Aumenta el valor (p. ej., 360) para ignorar los bloqueos que solo afectan a la ventana de 5 horas."
"settings.setting.codexResets.keepCredits.label" = "Reserva para canje automático de Codex"
"settings.setting.codexResets.keepCredits.description" = "Nunca gasta automáticamente créditos si la cantidad de reinicios guardados quedaría por debajo de este valor (0 = el último crédito puede gastarse automáticamente). Los créditos próximos a vencer están exentos: un crédito reservado que vence no preserva nada."
"settings.setting.codexResets.salvageHorizonHours.label" = "Plazo de aprovechamiento de reinicios de Codex"
"settings.setting.codexResets.salvageHorizonHours.description" = "Con el canje automático activado, gasta un reinicio de Codex guardado dentro de esta cantidad de horas antes de que venza cuando cualquiera de las dos ventanas de chat tenga un uso significativo. 0 desactiva el aprovechamiento anticipado; se sigue intentando usar los créditos que vencen dentro de 5 minutos independientemente del uso."
"settings.setting.claudeResets.minBlockedMinutes.label" = "Bloqueo mínimo para canje automático de Claude"
"settings.setting.claudeResets.minBlockedMinutes.description" = "Canjea automáticamente solo cuando falte al menos esta cantidad de minutos para el desbloqueo natural —el último reinicio entre las ventanas cubiertas que estén agotadas—. Un reinicio exclusivo de 5 horas nunca se usa para un bloqueo semanal o limitado a un modelo."
"settings.setting.claudeResets.keepCredits.label" = "Reserva para canje automático de Claude"
"settings.setting.claudeResets.keepCredits.description" = "Mantén al menos esta cantidad de reinicios de Claude guardados (0 permite gastar automáticamente el último reinicio elegible). La reserva se aplica al aprovechamiento anticipado, pero no a los reinicios elegibles que vencen dentro de 5 minutos."
"settings.setting.claudeResets.salvageHorizonHours.label" = "Horizonte de aprovechamiento de reinicios de Claude"
"settings.setting.claudeResets.salvageHorizonHours.description" = "Con el canje automático activado, usa un reinicio de Cedar seleccionado por el servidor dentro de esta cantidad de horas antes de su vencimiento cuando las ventanas que cubre tengan un uso significativo. 0 desactiva el aprovechamiento anticipado; los reinicios elegibles de Cedar o Juniper que vencen dentro de 5 minutos se siguen intentando independientemente del uso o la reserva. Los requisitos de límites del proveedor siguen aplicándose."
"settings.setting.provider.appendOnlyContext.label" = "Contexto de solo anexado"
"settings.setting.provider.appendOnlyContext.description" = "Guarda en caché el prompt del sistema y las especificaciones de herramientas, y mantén un registro de mensajes de solo anexado para maximizar los aciertos en las cachés de prefijos de los proveedores (DeepSeek, Xiaomi/SGLang, Anthropic). Auto lo activa para proveedores conocidos de caché de prefijos."
"settings.setting.workspace.additionalDirectories.label" = "Directorios adicionales del espacio de trabajo"
"settings.setting.workspace.additionalDirectories.description" = "Directorios adicionales del espacio de trabajo que se agregan a cada sesión como raíces adicionales (espacio de trabajo multirraíz). Se administran en vivo mediante /add-dir y /remove-dir. Las rutas se resuelven con respecto a cwd; se recomiendan rutas absolutas. Se informa al agente que estas raíces existen y puede usar read/grep/glob en ellas."
"settings.setting.contextFiles.extra.label" = "Archivos de contexto adicionales"
"settings.setting.contextFiles.extra.description" = "Nombres de archivos de instrucciones adicionales que se cargan junto con AGENTS.md. Usa una lista JSON de nombres, no de rutas, p. ej. [\"AGENTS.local.md\"]; [] desactiva los archivos adicionales. Inicia una nueva sesión para cargarlos."
"settings.setting.contextPromotion.enabled.label" = "Promoción automática del contexto"
"settings.setting.contextPromotion.enabled.description" = "Promueve al contextPromotionTarget del modelo cuando se desborda el contexto en lugar de compactarlo. Los cambios a alternativas en los reintentos se controlan mediante alternativa de modelo para reintentos"
"settings.setting.extendedContext.label" = "Contexto extendido"
"settings.setting.extendedContext.description" = "Usa ventanas de contexto más grandes donde estén disponibles; pueden tener un precio superior. Desactivado mantiene las ventanas predeterminadas o con precio estándar"
"settings.setting.compaction.enabled.label" = "Compactación automática"
"settings.setting.compaction.enabled.description" = "Compacta automáticamente el contexto cuando se vuelve demasiado grande"
"settings.setting.compaction.experimentalContextManagement.label" = "Ventanas de contexto respaldadas por notas (experimental)"
"settings.setting.compaction.experimentalContextManagement.description" = "Mantiene notas persistentes y un historial sin procesar en el que se puede buscar entre ventanas de contexto."
"settings.setting.compaction.midTurnEnabled.label" = "Compactación a mitad del turno"
"settings.setting.compaction.midTurnEnabled.description" = "Comprueba los umbrales en puntos seguros del ciclo de herramientas a mitad del turno, antes de la siguiente solicitud al proveedor; los subagentes siempre los comprueban, ya que toda su asignación es un solo turno"
"settings.setting.compaction.methodOrder.label" = "Orden de métodos de compactación"
"settings.setting.compaction.methodOrder.description" = "Orden de alternativas preferido para el mantenimiento automático del contexto; si un método no está disponible o falla, se pasa a la siguiente opción"
"settings.setting.compaction.thresholdPercent.label" = "Umbral de compactación"
"settings.setting.compaction.thresholdPercent.description" = "Umbral porcentual para el mantenimiento del contexto; selecciona Predeterminado para usar el comportamiento anterior basado en reservas"
"settings.setting.compaction.thresholdTokens.label" = "Límite de tokens para compactación"
"settings.setting.compaction.thresholdTokens.description" = "Límite fijo de tokens para el mantenimiento del contexto; si se establece, tiene prioridad sobre el porcentaje"
"settings.setting.compaction.handoffSaveToDisk.label" = "Guardar documentos de traspaso"
"settings.setting.compaction.handoffSaveToDisk.description" = "Guarda los documentos de traspaso generados en archivos markdown para el flujo de traspaso automático"
"settings.setting.compaction.remoteStreamingV2Enabled.label" = "Compactación remota V2"
"settings.setting.compaction.remoteStreamingV2Enabled.description" = "Usa la compactación por streaming de Responses para modelos compatibles de compactación remota"
"settings.setting.compaction.asyncEnabled.label" = "Compactación asíncrona"
"settings.setting.compaction.asyncEnabled.description" = "Genera un resumen especulativo en segundo plano cuando el contexto se acerca al umbral de compactación y luego incorpora el resultado preparado cuando se supera el umbral"
"settings.setting.compaction.agentControl.label" = "Controles de compactación del agente"
"settings.setting.compaction.agentControl.description" = "Permite que los agentes inspeccionen, propongan o apliquen cambios de compactación. Las propuestas nunca cambian la configuración."
"settings.setting.compaction.idleEnabled.label" = "Compactación durante la inactividad"
"settings.setting.compaction.idleEnabled.description" = "Compacta el contexto durante la inactividad cuando el número de tokens supera el umbral"
"settings.setting.compaction.idleThresholdTokens.label" = "Umbral de compactación durante la inactividad"
"settings.setting.compaction.idleThresholdTokens.description" = "Número de tokens a partir del cual se activa la compactación durante la inactividad"
"settings.setting.compaction.idleTimeoutSeconds.label" = "Espera para la compactación durante la inactividad"
"settings.setting.compaction.idleTimeoutSeconds.description" = "Segundos de inactividad que se esperan antes de compactar; con una caché de prompt de 1 hora, la compactación se ejecuta justo antes de que venza la caché"
"settings.setting.compaction.supersedeReads.label" = "Reemplazar lecturas obsoletas"
"settings.setting.compaction.supersedeReads.description" = "Descarta resultados de lectura anteriores cuando se vuelve a leer el mismo archivo (toma en cuenta la caché, se ejecuta en cada turno)"
"settings.setting.compaction.dropUseless.label" = "Omitir resultados sin novedades"
"settings.setting.compaction.dropUseless.description" = "Descarta los resultados de herramientas marcados como inútiles para el contexto (sin coincidencias, esperas agotadas) una vez consumidos (toma en cuenta la caché)"
"settings.setting.snapcompact.systemPrompt.label" = "Prompt del sistema de Snapcompact"
"settings.setting.snapcompact.systemPrompt.description" = "Experimental: representa el texto seleccionado del prompt del sistema como imágenes PNG densas y las adjunta al primer mensaje del usuario (solo modelos de visión). Ahorra tokens; se pierde el almacenamiento en caché del prompt para el texto convertido en imágenes."
"settings.setting.snapcompact.toolResults.label" = "Resultados de herramientas de Snapcompact"
"settings.setting.snapcompact.toolResults.description" = "Experimental: representa los resultados grandes de herramientas, incluido el más reciente, como imágenes PNG densas en lugar de texto (solo modelos de visión). Ahorra tokens en la salida acumulada de búsquedas y comandos; los resultados de lectura permanecen como texto a menos que se sepa que el modelo puede editar con precisión a partir de imágenes."
"settings.setting.tools.format.label" = "Modo de llamadas a herramientas"
"settings.setting.tools.format.description" = "Controla cómo se presentan las herramientas al modelo. Auto usa llamadas a herramientas nativas del proveedor a menos que el modelo seleccionado esté marcado como incompatible con ellas; en ese caso, recurre al dialecto propietario de GLM. Native fuerza las herramientas nativas del proveedor; los demás valores fuerzan el dialecto propietario indicado."
"settings.setting.snapcompact.shape.label" = "Forma de Snapcompact"
"settings.setting.snapcompact.shape.description" = "Forma del marco con el que snapcompact imprime el texto (archivo de compactación y conversión a imágenes en línea). Auto elige una forma ajustada al modelo actual."
"settings.setting.branchSummary.enabled.label" = "Resúmenes de rama"
"settings.setting.branchSummary.enabled.description" = "Solicita un resumen al salir de una rama"
"settings.setting.eventAudio.mappingPath.label" = "Asignación de sonidos de eventos"
"settings.setting.eventAudio.mappingPath.description" = "Asignaciones de sonidos de versión 1 seleccionadas por el propietario. /sounds on las activa para esta sesión; /sounds reload las vuelve a leer."
"settings.setting.title.icons.label" = "Íconos del título"
"settings.setting.title.icons.description" = "Ícono y código corto que encabezan los títulos de sesión recién generados o establecidos con /rename"
"settings.setting.title.generator.label" = "Generador de títulos"
"settings.setting.title.generator.description" = "Qué asigna un nombre a una sesión sin título a partir de los mensajes del usuario"
"settings.setting.title.refreshOnReplan.label" = "Actualizar título al replanificar"
"settings.setting.title.refreshOnReplan.description" = "Actualizar los títulos de sesión generados después de replanificaciones con todo init, salvo que el usuario haya establecido el título"
"settings.setting.title.refreshAfterPrompts.label" = "Actualizar título después de prompts"
"settings.setting.title.refreshAfterPrompts.description" = "Cada esta cantidad de prompts del operador, preguntar al modelo juez si un título de sesión generado todavía se ajusta a la conversación y, si no, volver a generarlo"
"settings.setting.tools.artifactSpillThreshold.label" = "Umbral para guardar salida como artefacto (KB)"
"settings.setting.tools.artifactSpillThreshold.description" = "La salida de herramientas que supera este tamaño se guarda como artefacto; la parte final se conserva en línea"
"settings.setting.tools.artifactTailBytes.label" = "Tamaño de la parte final del artefacto (KB)"
"settings.setting.tools.artifactTailBytes.description" = "Cantidad de contenido final que se conserva en línea cuando la salida se guarda como artefacto"
"settings.setting.tools.artifactHeadBytes.label" = "Tamaño de la parte inicial del artefacto (KB)"
"settings.setting.tools.artifactHeadBytes.description" = "Cantidad de contenido inicial que se conserva en línea junto con la parte final cuando la salida se guarda como artefacto (omisión de la parte central). 0 desactiva esta opción y conserva solo la parte final."
"settings.setting.tools.outputMaxColumns.label" = "Límite de columnas de salida"
"settings.setting.tools.outputMaxColumns.description" = "Límite de bytes por línea para la salida de herramientas en streaming (bash, python, js eval) y `read`. Las líneas que superan este límite se truncan con puntos suspensivos; los bytes restantes hasta el siguiente salto de línea se descartan. 0 desactiva el límite."
"settings.setting.tools.artifactTailLines.label" = "Líneas finales del artefacto"
"settings.setting.tools.artifactTailLines.description" = "Número máximo de líneas de contenido final que se conservan en línea cuando la salida se guarda como artefacto"
"settings.setting.tools.artifactMaxBytes.label" = "Límite del archivo de artefacto (MB)"
"settings.setting.tools.artifactMaxBytes.description" = "Tamaño máximo del archivo de artefacto guardado para la salida de herramientas en streaming (bash, python, js eval). Si la salida es mayor, se conservan su inicio (hasta 3 MB) y su parte restante más reciente, con un aviso de truncamiento entre ambos. 0 = sin límite."
"settings.setting.readLineNumbers.label" = "Números de línea"
"settings.setting.readLineNumbers.description" = "Anteponer números de línea a la salida de la herramienta read de forma predeterminada"
"settings.setting.read.defaultLimit.label" = "Límite predeterminado de read"
"settings.setting.read.defaultLimit.description" = "Número predeterminado de líneas devueltas cuando el agente llama a read sin un límite"
"settings.setting.read.renderMarkdown.label" = "Vistas previas de Markdown"
"settings.setting.read.renderMarkdown.description" = "Mostrar los resultados de read para Markdown como vistas previas de Markdown con formato en la terminal, en lugar del código fuente sin procesar"
"settings.setting.read.summarize.enabled.label" = "Resúmenes de read"
"settings.setting.read.summarize.enabled.description" = "Devolver resúmenes estructurales de código cuando se llama a read sin un selector explícito"
"settings.setting.read.summarize.prose.label" = "Resúmenes de prosa"
"settings.setting.read.summarize.prose.description" = "Devolver resúmenes estructurales para lecturas de Markdown y texto plano"
"settings.setting.read.summarize.minBodyLines.label" = "Líneas del cuerpo para resúmenes de read"
"settings.setting.read.summarize.minBodyLines.description" = "Longitud mínima de un cuerpo o literal de varias líneas para que los resúmenes de read lo contraigan"
"settings.setting.read.summarize.minCommentLines.label" = "Líneas de comentarios para resúmenes de read"
"settings.setting.read.summarize.minCommentLines.description" = "Longitud mínima de un comentario de bloque de varias líneas para que los resúmenes de read lo contraigan"
"settings.setting.read.summarize.minTotalLines.label" = "Longitud mínima de archivo para resúmenes de read"
"settings.setting.read.summarize.minTotalLines.description" = "Los archivos con menos líneas totales se leen íntegramente en lugar de resumirse estructuralmente"
"settings.setting.read.summarize.unfoldUntil.label" = "Objetivo de expansión de resúmenes de read"
"settings.setting.read.summarize.unfoldUntil.description" = "Expandir mediante BFS los segmentos que se pueden omitir hasta que el resumen tenga al menos esta cantidad de líneas visibles. 0 conserva solo las omisiones más externas."
"settings.setting.read.summarize.unfoldLimit.label" = "Límite de expansión de resúmenes de read"
"settings.setting.read.summarize.unfoldLimit.description" = "Límite estricto del tamaño del resumen durante la expansión mediante BFS. Se omite cualquier expansión cuyas líneas reveladas superarían este límite (ese segmento permanece contraído) y la expansión continúa con los segmentos restantes."
"settings.setting.read.toolResultPreview.label" = "Vistas previas de read en línea"
"settings.setting.read.toolResultPreview.description" = "Mostrar los resultados de la herramienta read en línea en la transcripción, en lugar de mostrarlos como filas de resumen"
"settings.setting.tools.approval.label" = "Políticas de aprobación de herramientas"
"settings.setting.tools.approval.description" = "Políticas de aprobación por herramienta. Establece 'allow' para aprobar automáticamente, 'prompt' para solicitar confirmación o 'deny' para bloquear. Las excepciones se respetan en todos los modos de aprobación."
"settings.setting.tools.approvalMode.label" = "Aprobación de herramientas"
"settings.setting.tools.approvalMode.description" = "Comportamiento predeterminado de aprobación para llamadas a herramientas. 'Preguntar siempre' aprueba automáticamente solo las herramientas de lectura. 'Preguntar y recordar' también pregunta antes de leer archivos y puede recordar un archivo o una carpeta. 'Escritura' aprueba automáticamente las herramientas de lectura y escritura en el espacio de trabajo. 'Yolo' aprueba automáticamente todos los niveles; la política del usuario aún puede solicitar confirmación o bloquear."
"settings.setting.tools.restrictedFolders.label" = "Carpetas restringidas"
"settings.setting.tools.restrictedFolders.description" = "Carpetas donde cada lectura, escritura, edición, búsqueda o comando requiere una aprobación explícita, independientemente del modo de aprobación o de un permiso recordado. La carpeta y todo su contenido están restringidos; los comandos se comparan según el directorio donde se ejecutan. Una lista JSON de rutas, por ejemplo, [\"~/secrets\"]."
"settings.setting.todo.enabled.label" = "Tareas pendientes"
"settings.setting.todo.enabled.description" = "Activar la herramienta todo para el seguimiento de tareas"
"settings.setting.todo.reminders.label" = "Recordatorios de tareas pendientes"
"settings.setting.todo.reminders.description" = "Recordar al agente que complete las tareas pendientes antes de detenerse"
"settings.setting.todo.remindersMax.label" = "Límite de recordatorios de tareas pendientes"
"settings.setting.todo.remindersMax.description" = "Número máximo de recordatorios de tareas pendientes antes de dejar de insistir"
"settings.setting.todo.midRunNudges.label" = "Avisos de tareas pendientes durante la ejecución"
"settings.setting.todo.midRunNudges.description" = "Con qué frecuencia se recuerda al agente que actualice su lista de tareas pendientes durante un turno largo mientras sigue haciendo cambios"
"settings.setting.todo.eager.label" = "Crear tareas pendientes automáticamente"
"settings.setting.todo.eager.description" = "Con qué intensidad se impulsa la creación automática de listas de tareas pendientes después del primer mensaje"
"settings.setting.tasks.todoClearDelay.label" = "Retraso de eliminación automática de tareas pendientes"
"settings.setting.tasks.todoClearDelay.description" = "Retraso antes de eliminar las tareas pendientes completadas o abandonadas del widget de tareas pendientes"
"settings.setting.glob.enabled.label" = "Glob"
"settings.setting.glob.enabled.description" = "Habilitar la herramienta glob para buscar archivos mediante patrones glob"
"settings.setting.grep.enabled.label" = "Grep"
"settings.setting.grep.enabled.description" = "Habilitar la herramienta grep para buscar contenido mediante expresiones regulares"
"settings.setting.grep.contextBefore.label" = "Contexto anterior de grep"
"settings.setting.grep.contextBefore.description" = "Líneas de contexto antes de cada coincidencia de grep"
"settings.setting.grep.contextAfter.label" = "Contexto posterior de grep"
"settings.setting.grep.contextAfter.description" = "Líneas de contexto después de cada coincidencia de grep"
"settings.setting.astGrep.enabled.label" = "AST Grep"
"settings.setting.astGrep.enabled.description" = "Habilitar la herramienta ast_grep para búsquedas estructurales en AST"
"settings.setting.astEdit.enabled.label" = "AST Edit"
"settings.setting.astEdit.enabled.description" = "Habilitar la herramienta ast_edit para reescrituras estructurales de AST"
"settings.setting.find.verifyModel.label" = "Modelo de verificación de find"
"settings.setting.find.verifyModel.description" = "Selector de modelo (p. ej., openrouter/liquid/d1-ultra) que se prueba primero para la verificación de pasajes de find, antes del rol judge; la clasificación de nombres de archivo y esquemas permanece en el rol judge. Sin configurar: el rol judge también verifica"
"settings.setting.find.enabled.label" = "Find (grep semántico)"
"settings.setting.find.enabled.description" = "Habilitar la herramienta find: búsqueda en lenguaje natural de archivos y rangos de líneas, evaluada por el rol de modelo judge. Auto solo la habilita cuando el rol judge se resuelve en un modelo jev nativo de TypeSafe"
"settings.setting.debug.enabled.label" = "Debug"
"settings.setting.debug.enabled.description" = "Habilitar la herramienta debug para depuración basada en DAP"
"settings.setting.launch.enabled.label" = "Servicios"
"settings.setting.launch.enabled.description" = "Habilitar servicios bash con nombre y supervisión mediante proc:// para procesos compartidos de larga duración del proyecto"
"settings.setting.speechgen.enabled.label" = "Generación de voz"
"settings.setting.speechgen.enabled.description" = "Habilitar la herramienta tts para la síntesis de archivos de voz en el dispositivo (Phonon) o mediante xAI Grok Voice"
"settings.setting.generate_image.enabled.label" = "Generar imagen"
"settings.setting.generate_image.enabled.description" = "Habilitar la herramienta generate_image (generación y edición de imágenes a partir de texto). Se expone como un dispositivo xd:// cuando tools.xdev está activado."
"settings.setting.computer.enabled.label" = "Computer"
"settings.setting.computer.enabled.description" = "Habilitar el preludio eval programable del escritorio anfitrión (capturas de pantalla, entrada, accesibilidad)"
"settings.setting.ratchet.enabled.label" = "Ratchet"
"settings.setting.ratchet.enabled.description" = "Habilitar el preludio eval/hillclimb de ratchet; /ratchet lo activa para la sesión actual"
"settings.setting.archive.enabled.label" = "Archivo"
"settings.setting.archive.enabled.description" = "Habilitar el preludio eval de archivo de solo lectura: historial de prompts, proyectos recientes, sesiones anteriores y resúmenes"
"settings.setting.commit.enabled.label" = "Commit selectivo"
"settings.setting.commit.enabled.description" = "Habilitar el preludio eval de commit y /commit: incluir en el commit solo las líneas escritas por este agente y sus subagentes"
"settings.setting.computer.display.label" = "Pantalla de Computer"
"settings.setting.computer.display.description" = "Pantalla de la ventana activa (active), todas las pantallas (all) o un identificador de pantalla nativo"
"settings.setting.computer.maxWidth.label" = "Ancho de captura de pantalla de Computer"
"settings.setting.computer.maxWidth.description" = "Ancho máximo de captura de pantalla en píxeles"
"settings.setting.computer.maxHeight.label" = "Alto de captura de pantalla de Computer"
"settings.setting.computer.maxHeight.description" = "Alto máximo de captura de pantalla en píxeles"
"settings.setting.computer.backgroundFallback.label" = "Alternativa de Computer en segundo plano"
"settings.setting.computer.backgroundFallback.description" = "Qué hace la entrada de ventana cuando su ruta en segundo plano no está disponible: volver a ejecutarla tomando el control y devolver el foco a tu aplicación (macOS; en otros sistemas, solo tomar el control), o rechazarla, lo que también impide que el agente tome el primer plano o abra menús de macOS por sí mismo"
"settings.setting.images.questionTimeoutMs.label" = "Tiempo de espera para preguntas sobre imágenes"
"settings.setting.images.questionTimeoutMs.description" = "Tiempo de espera por solicitud, en milisegundos, para la llamada al modelo de visión que procesa las preguntas sobre imágenes mediante ?q= de read. Si un proveedor se queda detenido, falla rápidamente con un error de tiempo de espera en lugar de bloquearse hasta una cancelación manual. Establece el valor en 0 para desactivar el tiempo de espera."
"settings.setting.checkpoint.enabled.label" = "Punto de control/rebobinado"
"settings.setting.checkpoint.enabled.description" = "Habilitar las herramientas checkpoint y rewind para crear puntos de control del contexto"
"settings.setting.fetch.enabled.label" = "Leer URL"
"settings.setting.fetch.enabled.description" = "Permitir que la herramienta read obtenga y procese URL"
"settings.setting.vault.enabled.label" = "Bóveda de Obsidian"
"settings.setting.vault.enabled.description" = "Habilitar la URL interna vault:// para leer y editar contenido de bóvedas de Obsidian mediante la CLI de Obsidian. Cuando está deshabilitada, se rechaza la resolución de vault:// y se omite la entrada vault:// del prompt del sistema."
"settings.setting.github.enabled.label" = "GitHub CLI"
"settings.setting.github.enabled.description" = "Habilitar la herramienta github (despacho basado en op para flujos de trabajo de repositorios, issues, pull requests, diff, búsqueda, checkout, push y seguimiento de Actions)"
"settings.setting.github.cache.enabled.label" = "Caché de vistas de GitHub"
"settings.setting.github.cache.enabled.description" = "Almacena en caché la salida renderizada de la vista de issues/PR en ~/.omp/cache/github-cache.db para que las lecturas repetidas no tengan costo"
"settings.setting.github.cache.softTtlSec.label" = "TTL flexible de la caché de GitHub"
"settings.setting.github.cache.softTtlSec.description" = "Durante este intervalo, las filas en caché de la vista de issues/PR se devuelven directamente (segundos; valor predeterminado: 5 minutos)"
"settings.setting.github.cache.hardTtlSec.label" = "TTL estricto de la caché de GitHub"
"settings.setting.github.cache.hardTtlSec.description" = "Una vez superado el TTL flexible, la fila en caché se devuelve y se actualiza en segundo plano; una vez superado el TTL estricto, se descarta (segundos; valor predeterminado: 7 días)"
"settings.setting.web_search.enabled.label" = "Búsqueda web"
"settings.setting.web_search.enabled.description" = "Habilita la herramienta web_search para obtener resultados web en tiempo real"
"settings.setting.security.enabled.label" = "Seguridad"
"settings.setting.ask.enabled.label" = "Ask"
"settings.setting.ask.enabled.description" = "Habilita la herramienta ask para hacer preguntas interactivas al usuario"
"settings.setting.out.enabled.label" = "Out"
"settings.setting.out.enabled.description" = "Permite que el agente responda durante una tarea escribiendo en out://, lo que se muestra como una respuesta sin terminar su turno. Sin configurar: activado en la TUI interactiva, desactivado en print, RPC y ACP"
"settings.setting.tools.intentTracing.label" = "Seguimiento de intención"
"settings.setting.tools.intentTracing.description" = "Pide al agente que describa la intención de cada llamada a una herramienta antes de ejecutarla. Sin configurar: activado en la TUI interactiva, desactivado en las sesiones de print, RPC, ACP y SDK"
"settings.setting.tools.abortOnFabricatedResult.label" = "Abortar ante un resultado de herramienta fabricado"
"settings.setting.tools.abortOnFabricatedResult.description" = "Con llamadas a herramientas dentro de la banda, detiene el modelo inmediatamente cuando empieza a alucinar un resultado de herramienta a mitad de turno. Desactívalo para permitir que el modelo termine de generar y descartar la continuación fabricada en su lugar."
"settings.setting.tools.speculativeExecution.enabled.label" = "Ejecución especulativa experimental"
"settings.setting.tools.speculativeExecution.enabled.description" = "Habilita la primera etapa que se puede descartar de forma segura: lecturas locales validadas mediante llamadas directas a read y eval anidados. Las solicitudes de red, las completaciones de proveedores y las escrituras en vivo en el sistema de archivos no forman parte de esta base."
"settings.setting.tools.speculativeExecution.maxInFlight.label" = "Concurrencia de ejecución especulativa"
"settings.setting.tools.speculativeExecution.maxInFlight.description" = "Número máximo de lecturas locales validadas que pueden ejecutarse antes del despacho normal."
"settings.setting.tools.maxTimeout.label" = "Tiempo de espera máximo de herramientas"
"settings.setting.tools.maxTimeout.description" = "Tiempo de espera máximo en segundos que el agente puede establecer para cualquier herramienta (0 = sin límite)"
"settings.setting.async.enabled.label" = "Ejecución asíncrona"
"settings.setting.async.enabled.description" = "Habilita los comandos bash asíncronos y la ejecución de tareas en segundo plano"
"settings.setting.async.printWake.label" = "Reactivar el modo print con resultados de trabajos"
"settings.setting.async.printWake.description" = "En modo print (-p, --mode json), sigue ejecutándose después del último prompt mientras los trabajos en segundo plano de esta ejecución estén activos e inicia otro turno en la misma sesión con el resultado de cada trabajo; sale cuando no queda ningún trabajo ni resultado pendiente. Desactivado: el modo print sale después de sus prompts y cancela los trabajos en ejecución"
"settings.setting.async.widgets.label" = "Widgets de trabajos en vivo"
"settings.setting.async.widgets.description" = "Muestra un widget en vivo para cada trabajo en segundo plano en ejecución (gráficas, barras y cuadrículas de estado derivadas de su salida) en la tarjeta de espera, la píldora de trabajos y el panel de trabajos, y agrega a los comandos shell largos una descripción de una línea sobre lo que hacen. El rol de modelo `widget` (predeterminado: `smol`) escribe una especificación y como máximo una descripción por trabajo; las actualizaciones no requieren más llamadas al modelo"
"settings.setting.tools.xdev.label" = "Herramientas xd://"
"settings.setting.tools.xdev.description" = "Monta las herramientas poco usadas (detectables) bajo URL de dispositivos xd:// controladas mediante read/write, en lugar de enviar sus esquemas en cada solicitud. Las sesiones cuya lista explícita de herramientas concede read pero omite write montan los dispositivos mediante un transporte write exclusivo para dispositivos (además de los dispositivos, solo se puede escribir en el espacio temporal local://). Desactívalo para exponer cada herramienta habilitada en el nivel superior."
"settings.setting.tools.xdevDocs.label" = "Documentación de prompt de xd://"
"settings.setting.tools.xdevDocs.description" = "Elige qué documentación y esquemas de dispositivos montados se incluyen directamente en el prompt del sistema. La opción de herramientas integradas mantiene las herramientas principales incluidas directamente, mientras que las herramientas MCP y de extensiones quedan disponibles bajo demanda."
"settings.setting.tools.xdevInlineDevices.label" = "Dispositivos xd:// incluidos directamente"
"settings.setting.tools.xdevInlineDevices.description" = "Cuando la documentación de prompt de xd:// está en solo herramientas integradas, incluye directamente los dispositivos dinámicos cuyos nombres coincidan con estos patrones glob (por ejemplo, mcp__context_mode_*). La opción de solo catálogo ignora esta configuración."
"settings.setting.tools.xdevNotices.label" = "Avisos de montaje de xd://"
"settings.setting.tools.xdevNotices.description" = "Muestra un aviso `xd://: mounted …` cuando se montan o desmontan herramientas MCP o de extensiones. El modelo sigue enterándose del cambio en su siguiente prompt."
"settings.setting.dev.autoqa.label" = "Auto QA"
"settings.setting.dev.autoqa.description" = "Reporte automatizado de problemas de herramientas (xd://report_issue). Activado de forma predeterminada; el primer reporte solicita consentimiento y, si lo rechazas, se desactivan los reportes hasta que los vuelvas a habilitar explícitamente"
"settings.setting.dev.autoqaPush.endpoint.label" = "Endpoint de envío de Auto QA"
"settings.setting.dev.autoqaPush.endpoint.description" = "URL completa que recibe los reportes JSON de Auto QA (predeterminada: https://qa.omp.sh/v1/grievances)"
"settings.setting.browser.enabled.label" = "Navegador"
"settings.setting.browser.enabled.description" = "Habilita el preludio eval del navegador para la automatización del navegador mediante scripts"
"settings.setting.browser.cdpUrl.label" = "URL de CDP del navegador"
"settings.setting.browser.cdpUrl.description" = "Endpoint HTTP predeterminado de descubrimiento de CDP (por ejemplo, http://127.0.0.1:9222) al que conectarse en lugar de iniciar un navegador. Una app explícita en la llamada a la herramienta tiene prioridad."
"settings.setting.browser.relay.label" = "Relay del navegador"
"settings.setting.browser.relayUrl.label" = "URL del relay del navegador"
"settings.setting.browser.headless.label" = "Navegador sin interfaz gráfica"
"settings.setting.browser.cmux.label" = "Navegador cmux"
"settings.setting.browser.cmux.description" = "Usa superficies WKWebView de cmux para la automatización del navegador cuando hay un socket de cmux disponible (no para subagentes). Establece PI_BROWSER_CMUX=0 o PI_BROWSER_CMUX=1 para anular esta opción."
"settings.setting.browser.tern.label" = "Navegador Tern"
"settings.setting.browser.webkit.label" = "Navegador WebKit"
"settings.setting.browser.webkitPath.label" = "Ruta de WebKit del navegador"
"settings.setting.browser.freezeOnTurnEnd.label" = "Congelar las pestañas del navegador al terminar el turno"
"settings.setting.browser.idleCloseSec.label" = "Tiempo de espera para cerrar el navegador por inactividad"
"settings.setting.browser.screenshotMaxWidth.label" = "Ancho de las capturas de pantalla del navegador"
"settings.setting.browser.screenshotMaxWidth.description" = "Límite opcional en píxeles del ancho de las capturas de pantalla del navegador enviadas al modelo. Sin definir o 0 = sin límite: las capturas siguen el tamaño adaptado al modelo (hasta 2000px, según los límites de imagen del modelo activo) y las capturas de diferencias permanecen en 1024px. Un valor definido limita ambas."
"settings.setting.browser.screenshotMaxHeight.label" = "Altura de las capturas de pantalla del navegador"
"settings.setting.browser.screenshotMaxHeight.description" = "Límite opcional en píxeles de la altura de las capturas de pantalla del navegador enviadas al modelo. Sin definir o 0 = sin límite: las capturas siguen el tamaño adaptado al modelo (hasta 2000px, según los límites de imagen del modelo activo) y las capturas de diferencias permanecen en 1024px. Un valor definido limita ambas."
"settings.setting.browser.screenshotDir.label" = "Directorio de capturas de pantalla"
"settings.setting.browser.screenshotDir.description" = "Directorio donde guardar las capturas de pantalla. Si no se define, las capturas se guardan en un archivo temporal. Admite ~. Ejemplos: ~/Downloads, ~/Desktop, /sdcard/Download (Android)"
"settings.setting.disassembler.backend.label" = "Desensamblador"
"settings.setting.disassembler.backend.description" = "Backend para los selectores de análisis en el espacio de nombres dsm de read y eval; las lecturas de ejecutables sin procesar muestran solo metadatos. Automático usa IDA Pro cuando está instalado; de lo contrario, usa Ghidra (se descarga en el primer análisis)"
"settings.setting.disassembler.maxOpen.label" = "Máximo de bases de datos abiertas"
"settings.setting.disassembler.maxOpen.description" = "Máximo de bases de datos (demonios omp.ida.* / omp.ghidra.* en omp ps) abiertas a la vez por proyecto; al abrir otra, se desaloja una que esté inactiva y sin referencias. Cierra los manejadores dsm retenidos cuando termines"
"settings.setting.disassembler.idleCloseSec.label" = "Tiempo de espera para cierre por inactividad"
"settings.setting.disassembler.idleCloseSec.description" = "Guarda y cierra las bases de datos sin referencias que lleven inactivas más de esta cantidad de segundos (0 = nunca); los manejadores dsm retenidos permanecen abiertos. El espacio de nombres exec se reinicia al volver a abrir"
"settings.setting.moa.max_hops.label" = "Máximo de saltos de la mezcla"
"settings.setting.moa.max_hops.description" = "Límite predeterminado de saltos por ejecución de mezcla cuando una definición no establece limits.max_hops"
"settings.setting.moa.hard_max_hops.label" = "Límite absoluto de saltos de la mezcla"
"settings.setting.moa.hard_max_hops.description" = "Límite de saltos durante toda la ejecución de la mezcla; siempre detiene la ejecución"
"settings.setting.moa.show_trace_cards.label" = "Mostrar tarjetas de seguimiento de la mezcla"
"settings.setting.moa.show_trace_cards.description" = "Muestra una tarjeta plegable por cada salto de la mezcla encima de la respuesta"
"settings.setting.moa.part_budget_tokens.label" = "Presupuesto por parte de tránsito de la mezcla"
"settings.setting.moa.part_budget_tokens.description" = "Límite de tokens por cada parte de tránsito (salida, entrada, razonamiento) que un miembro entrega al siguiente"
"settings.setting.moa.conversation_budget_tokens.label" = "Presupuesto de conversación de la mezcla"
"settings.setting.moa.conversation_budget_tokens.description" = "Presupuesto de tokens para la conversación anterior que se muestra al miembro de entrada"
"settings.setting.moa.budget_usd.label" = "Presupuesto de la mezcla (USD)"
"settings.setting.moa.budget_usd.description" = "Límite de gasto predeterminado por ventana de ejecución; cero desactiva este límite"
"settings.setting.moa.hard_budget_usd.label" = "Presupuesto absoluto de la mezcla (USD)"
"settings.setting.moa.hard_budget_usd.description" = "Límite de gasto durante toda la ejecución; cero desactiva este límite"
"settings.setting.moa.wall_clock_minutes.label" = "Límite de tiempo de la mezcla"
"settings.setting.moa.wall_clock_minutes.description" = "Minutos predeterminados de tiempo real por ventana de ejecución"
"settings.setting.moa.on_limit.label" = "Acción ante el límite de la mezcla"
"settings.setting.moa.on_limit.description" = "Detener, pausar o consultar a un miembro final cuando se alcanza un límite flexible"
"settings.setting.moa.judge_min_confidence.label" = "Confianza mínima de la ruta"
"settings.setting.moa.judge_min_confidence.description" = "Confianza mínima predeterminada para una evaluación de ruta nativa"
"settings.setting.moa.decision_state_tokens.label" = "Presupuesto del estado de decisión"
"settings.setting.moa.decision_state_tokens.description" = "Límite de tokens por parte del estado proporcionada a una evaluación de ruta, terminación o veredicto"
"settings.setting.moa.transcript_budget_tokens.label" = "Presupuesto de transcripción de la mezcla"
"settings.setting.moa.transcript_budget_tokens.description" = "Presupuesto de tokens predeterminado para el tránsito de transcripciones"
"settings.setting.moa.summary_model.label" = "Modelo de resumen de la mezcla"
"settings.setting.moa.summary_model.description" = "Rol de modelo utilizado al compactar transcripciones de tránsito"
"settings.setting.control.enabled.label" = "Socket de control"
"settings.setting.control.enabled.description" = "Publica un socket de control local para que otra sesión de npi pueda controlar esta sesión"
"settings.setting.control.approvals.label" = "Aprobaciones de control"
"settings.setting.control.approvals.description" = "Permite que una conexión de control responda a las solicitudes de aprobación de herramientas. Desactivado: la persona del panel se encarga de todas las aprobaciones"
"settings.setting.control.secretInput.label" = "Entrada de datos secretos por control"
"settings.setting.control.secretInput.description" = "Permite que una conexión de control escriba en las solicitudes de datos secretos de inicio de sesión y lea la configuración de credenciales"
"settings.setting.images.urls.enabled.label" = "Servir imágenes como URL"
"settings.setting.images.urls.enabled.description" = "Publica las imágenes salientes mediante la cadena de backends configurada y envía URL cortas en lugar de base64 integrado a los proveedores que obtienen imágenes mediante URL. Recurre automáticamente al formato integrado cuando fallan todos los backends o la obtención por parte de un proveedor"
"settings.setting.images.urls.backends.label" = "Backends de URL de imágenes"
"settings.setting.images.urls.backends.description" = "Destinos que se prueban en orden al publicar imágenes para que los proveedores accedan a ellas"
"settings.setting.images.urls.command.label" = "Comando de carga de imágenes"
"settings.setting.images.urls.command.description" = "Plantilla argv para el backend de comandos; {file} es la ruta de la imagen, {mime}/{ext} son opcionales. Se usa la última URL impresa en stdout (p. ej., pasta -b -f {file})"
"settings.setting.images.urls.publicBaseUrl.label" = "URL base pública para imágenes"
"settings.setting.images.urls.publicBaseUrl.description" = "URL base accesible desde el exterior que da acceso al servidor de blobs (obligatoria para ssh, opcional para direct)"
"settings.setting.images.urls.ttlHours.label" = "Vigencia de las URL de imágenes (horas)"
"settings.setting.images.urls.ttlHours.description" = "Ventana de disponibilidad de las URL de imágenes alojadas localmente, medida desde la última vez que una conversación las envió; al reanudar una conversación, la ventana se reactiva para el mismo enlace. 0 mantiene los enlaces activos mientras el broker esté en ejecución"
"settings.setting.images.urls.bindHost.label" = "Host de enlace para URL de imágenes"
"settings.setting.images.urls.bindHost.description" = "Host al que se vincula el servidor de blobs; loopback para túneles, 0.0.0.0 para servicio directo"
"settings.setting.images.urls.sshTarget.label" = "Destino SSH para URL de imágenes"
"settings.setting.images.urls.sshTarget.description" = "Destino user@host para el reenvío inverso de ssh"
