"settings.setting.composer.tokenRate.description" = "Muestra la velocidad de generación en tok/s en tiempo real: en la fila de actividad junto al título de la sesión o en la barra nativa del editor, justo después del nivel de razonamiento, donde la última lectura permanece entre turnos. Se estima a partir de los fragmentos recibidos y se corrige con el recuento de salida facturado por el proveedor al completar cada mensaje."
"settings.setting.statusLine.preset.label" = "Configuración predefinida de la línea de estado"
