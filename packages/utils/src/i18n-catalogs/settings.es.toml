"settings.setting.tui.titleSpinner.label" = "Indicador de actividad en el título de la terminal"
"settings.setting.tui.titleSpinner.description" = "Conjunto de glifos para el indicador de actividad en el título de la terminal: barrido braille, luna que se llena, ciclo de un punto o línea compatible con ASCII"
"settings.setting.tui.hyperlinks.label" = "Hipervínculos de terminal"
