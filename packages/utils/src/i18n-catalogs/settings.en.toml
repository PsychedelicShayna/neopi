"settings.setting.collab.autoStart.description" = "Host every interactive session via collab.relayUrl as it starts and publish it to the local registry ({app_name} collab list); rooms rotate on session switch"
"settings.setting.worktree.base.description" = "Base directory for agent-managed worktrees — task-isolation copies, `github` PR checkouts, and `{app_name} worktree` cleanup all live here. Unset uses ~/.omp/wt. Must be an absolute or ~-relative path; relative paths are ignored. The OMP_WORKTREE_DIR env var overrides this."
"settings.setting.chat.include.description" = "Context categories kept in chat mode ({chat_includes}); --chat-include overrides"
"settings.setting.lsp.shared.description" = "Start language servers through the per-project daemon broker. Each connection gets its own server. While another {app_name} instance in the project is running, a released server stays warm and the next connection reuses it instead of cold-starting (falls back to private servers when unavailable)"
"settings.setting.stream.serverUrl.description" = "Live stream server used by `{app_name} stream` (https://host[:port]); viewers watch at <base>/<your Stencil username>"
"settings.setting.providers.maxInFlightRequests.description" = "Maximum concurrent LLM requests per provider id (for example \"openai\" or \"anthropic\"), shared across local {product_name} processes with this config root. Omitted providers are unlimited."
"settings.setting.retry.waitForUsageReset.description" = "When a provider reports usage-limit exhaustion with a reset time (5-hour or weekly quota windows on any provider), sleep until the reset instead of failing fast past retry.maxDelayMs. Waits are abortable ({escape_key}) but also hold subagents, so leave off for unattended runs."
"settings.setting.providers.webSearchTimeoutSeconds.description" = "Hard timeout for each provider's search transport before web_search advances to the next fallback, in seconds (maximum {max_web_search_timeout_seconds})"
"settings.setting.security.enabled.description" = "Enable {product_name}-native security scan planning, execution, and the read-only security:// resource namespace"
"settings.setting.browser.relay.description" = "Drive your own Chrome tabs through the {product_name} browser relay. Install the extension once (`{app_name} browser-relay install`); the relay server auto-starts when the browser prelude needs it. Takes precedence over Browser CDP URL; set PI_BROWSER_RELAY=0 or PI_BROWSER_RELAY=1 to override. Subagents skip it unless an open passes app: \"relay\"."
"settings.setting.browser.relayUrl.description" = "{product_name} browser relay endpoint (default http://127.0.0.1:9224)."
"settings.setting.browser.headless.description" = "Run the browser without a window (disable to show it). {product_name}'s WebKit tabs gain or lose their windows at once where the engine ships its viewer (macOS); elsewhere a visible browser is Chromium, launched in the new mode by the next open."
"settings.setting.browser.tern.description" = "Inside a Tern pane, open browser tabs as picture-in-pictures over {product_name}'s pane (native web view) instead of {product_name}'s own headless browser; falls back to that browser when no Tern window can host them. Subagents skip it unless an open passes app: \"tern\". An explicit app, the relay and Browser CDP URL take precedence; app \"own\" opts one open out. Set PI_BROWSER_TERN=0 or PI_BROWSER_TERN=1 to override."
"settings.setting.browser.webkit.description" = "Open browser tabs in {product_name}'s own headless WebKit engine instead of managed Chromium when the engine is installed ({product_name} downloads it to ~/.o2/lib/abkit before Chrome for Testing when no browser is installed; see Browser WebKit Path). Chromium still opens a visible browser where the engine ships no viewer, and tabs the engine fails to start; an explicit app, the relay, Browser CDP URL, Tern and cmux take precedence; app \"chromium\" opts one open out. Set PI_BROWSER_WEBKIT=0 or PI_BROWSER_WEBKIT=1 to override."
"settings.setting.browser.webkitPath.description" = "{product_name}'s WebKit engine: its host executable, or an ABKit engine directory (which holds it as ABHost; ABHost.exe on Windows). If unset, {product_name} runs the installed engine, ~/.o2/lib/abkit/ABHost (ABHost.exe on Windows). Supports ~. PI_BROWSER_WEBKIT_PATH overrides it."
"settings.setting.browser.freezeOnTurnEnd.description" = "Freeze {product_name}-owned headless Chromium tabs when a turn settles so animated pages stop burning CPU/GPU while idle (WebKit tabs draw nothing unless asked). Tabs unfreeze automatically on next use; pass persist:true on open to opt a tab out."
"settings.setting.browser.idleCloseSec.description" = "Close {product_name}-owned headless browser tabs and Tern browser picture-in-pictures idle longer than this many seconds (0 = never; session dispose still reaps). Never touches relay/CDP/spawned browsers or other sessions' tabs."
"settings.setting.skills.registryUrl.description" = "Skillshare registry used by `{app_name} skill` to install, search, and publish skills (https://host[:port])"
"settings.setting.extensionHandlers.toolCallTimeoutMs.description" = "Positive finite active-work timeout for extension tool_call handlers; invalid values use 30000ms, and time awaiting {product_name}-owned dialogs does not count"
"settings.option.collab.autoStart.view.description" = "Auto-host; the registry hands out view-only links ({app_name} collab link --view)"
