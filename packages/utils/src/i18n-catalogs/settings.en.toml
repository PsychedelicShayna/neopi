"settings.dynamic.tui.codexResetFireworks" = "Celebrate unscheduled Codex weekly usage resets and newly banked saved resets with a top-third fireworks overlay that remains until {escape}"
"settings.dynamic.tui.mouse" = "Capture mouse clicks in the main session so live subagent cards and HUD rows focus on click, with a hover highlight on the target, and clicks on extension-owned links reach their extension (the link-hint key picks them without the mouse). Native text selection becomes {shift}+drag while on, and mouse capture stops wheel scrolling — the terminal reports wheel ticks to omp instead — so scroll with the terminal's keyboard scrollback keys, or turn this off"
"settings.dynamic.tui.vimMode" = "Opt in to Vim navigation across menus, pickers, lists and viewers, plus modal prompt and search editing. {escape} leaves Insert mode; Normal mode has hjkl, 0, $, ^, w, b, e, gg, G, counts, x/D/C, dd/yy, p and u; operators take motions or text objects (diw, ca(, dap); v/V start a Visual selection that y copies and d deletes. Off by default; ordinary navigation and text editing remain available"
"settings.dynamic.composer.recallClearedDrafts" = "Keep drafts cleared with {clear} in local {history} history until exit; disabling affects future clears"
"settings.dynamic.doubleEscapeAction" = "What pressing {escape} twice with an empty editor does: open the transcript rewind selector, open the session tree, or nothing"
"settings.dynamic.spelling.autocomplete" = "Show predicted word completions as inline hints: {tab} accepts with a space, {right} without"
"settings.dynamic.composer.predictions" = "After a completed turn, ask the active model to predict your next message and show it as ghost text in the empty composer; {tab} or {right} inserts it without sending. Extra usage: every completed turn sends one more billed request over the whole conversation (counted in /stats)"
"settings.dynamic.composer.predictionAlternatives" = "Ask for up to four distinct predictions instead of one, most likely first. The ghost text shows the first one your draft matches; after inserting one, press {tab} again to pick another. The same single request returns a few more output tokens"
