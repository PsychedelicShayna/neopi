"settings.setting.lsp.diagnosticsOnEdit.label" = "Diagnostics on Edit"
"settings.setting.lsp.diagnosticsOnEdit.description" = "Return LSP diagnostics after editing code files"
"settings.setting.lsp.diagnosticsDeduplicate.label" = "Deduplicate Diagnostics"
"settings.setting.lsp.diagnosticsDeduplicate.description" = "Suppress post-edit LSP diagnostics already shown for a file; only surface new or changed ones"
"settings.setting.lsp.requestTimeout.label" = "Request Timeout"
"settings.setting.lsp.requestTimeout.description" = "Seconds to wait for a language server's diagnostics, hover and other answers when the agent sets no timeout; late post-edit diagnostics wait at least this long. Raise it for servers that are slow on a cold start. The lsp tool's timeout argument can still raise or lower it per call"
"settings.setting.share.serverUrl.label" = "Share Server"
"settings.setting.share.serverUrl.description" = "Share viewer/upload base used by /share (encrypted blob upload + viewer; links are <base>/<id>#<key>)"
"settings.setting.share.store.label" = "Share Store"
"settings.setting.share.store.description" = "Where /share uploads the encrypted session blob"
"settings.setting.share.redactSecrets.label" = "Share Secret Redaction"
"settings.setting.share.redactSecrets.description" = "Run the secret obfuscator over /share snapshots before upload (uses the secrets.* config)"
"settings.setting.ida.python.label" = "IDA Python"
"settings.setting.ida.python.description" = "Python interpreter that can import ida_domain and idapro; empty auto-detects"
"settings.setting.ida.installDir.label" = "IDA Install Dir"
"settings.setting.ida.installDir.description" = "Directory containing libidalib, exported as IDADIR; empty auto-detects ($IDADIR, ida-config.json, standard install paths)"
"settings.setting.spotlight.experiment.enabled.label" = "Spotlight Experiment"
"settings.setting.spotlight.experiment.enabled.description" = "Shape tool output and rank find results with Stencil Spotlight, and log each shaped result to the session"
"settings.setting.exa.enabled.label" = "Exa"
"settings.setting.exa.enabled.description" = "Enable the Exa web search provider"
"settings.setting.exa.searchDelayMs.label" = "Exa Search Delay"
"settings.setting.exa.searchDelayMs.description" = "Minimum delay between Exa web search requests in milliseconds; set 0 to disable pacing"
"settings.setting.searxng.endpoint.label" = "SearXNG Endpoint"
"settings.setting.searxng.endpoint.description" = "Base URL of a self-hosted SearXNG instance used for web search"
"settings.setting.voice.postprocess.label" = "Local voice reply instruction"
"settings.setting.voice.postprocess.description" = "Optional tiny/smol prompt for the complete spoken reply. Empty speaks verbatim. Use /voice to enable this session."
"settings.setting.tts.localVoice.label" = "Local TTS Voice"
"settings.setting.tts.localVoice.description" = "Phonon voice used by the local TTS backend (American/British, female/male)"
"settings.setting.tts.localSpeed.label" = "Local TTS Speed"
"settings.setting.tts.localSpeed.description" = "Speaking rate of the local TTS backend (tts tool, omp say). 1 = normal; clamped to 0.8–1.3"
"settings.setting.speech.enabled.label" = "Speech Vocalization"
"settings.setting.speech.enabled.description" = "Speak the assistant's output aloud through the speakers as it streams"
"settings.setting.speech.mode.label" = "Speech Vocalization Mode"
"settings.setting.speech.mode.description" = "What to speak: all = assistant messages + thinking; assistant = messages only; yield = only the final message at turn end"
"settings.setting.speech.enhanced.label" = "Enhanced Speech Rewriting"
"settings.setting.speech.enhanced.description" = "Rewrite assistant output into natural spoken prose with the tiny/smol model before synthesis (describes code, drops links and markdown). Falls back to mechanical cleanup on failure"
"settings.setting.speech.voice.label" = "Speech Vocalization Voice"
"settings.setting.speech.voice.description" = "Phonon voice used when speaking the assistant's output aloud"
"settings.setting.speech.speed.label" = "Speech Vocalization Speed"
"settings.setting.speech.speed.description" = "Speaking rate when reading the assistant's output aloud. 1 = normal; clamped to 0.8–1.3"
"settings.setting.tts.pacingThreads.label" = "Paced Kokoro: CPU threads"
"settings.setting.tts.pacingThreads.description" = "ONNX intra-op threads for the paced engine. 0 keeps the runtime default; try 2 to reduce contention. Changes reload its model"
"settings.setting.tts.pacing.label" = "Paced Kokoro: pacing"
"settings.setting.tts.pacing.description" = "Idle between synthesis segments while buffered speech plays. Only affects the Kokoro, paced engine"
"settings.setting.tts.pacingMarginMs.label" = "Paced Kokoro: safety margin"
"settings.setting.tts.pacingMarginMs.description" = "Start synthesis this many milliseconds before its predicted deadline. Increase if playback has gaps"
"settings.setting.tts.segmentMinChars.label" = "Paced Kokoro: minimum segment"
"settings.setting.tts.segmentMinChars.description" = "Minimum characters before a preferred boundary, except the first segment or the final remainder"
"settings.setting.tts.segmentMaxChars.label" = "Paced Kokoro: maximum segment"
"settings.setting.tts.segmentMaxChars.description" = "Character target, clamped to 40–280. Quotes, parentheses and indivisible words can extend past it"
"settings.setting.tts.segmentFirstChars.label" = "Paced Kokoro: first segment"
"settings.setting.tts.segmentFirstChars.description" = "Short first-segment character target for fast initial speech, capped at the maximum segment length"
"settings.setting.tts.segmentMaxWords.label" = "Paced Kokoro: hard word target"
"settings.setting.tts.segmentMaxWords.description" = "Fallback word-count target when no preferred anchor fits. Enclosed clauses stay together"
"settings.setting.tts.segmentSentences.label" = "Paced Kokoro: sentence boundaries"
"settings.setting.tts.segmentSentences.description" = "Prefer full-stop sentence endings before all other boundary rules"
"settings.setting.tts.segmentCommas.label" = "Paced Kokoro: comma boundaries"
"settings.setting.tts.segmentCommas.description" = "Prefer commas after sentence endings in the boundary ladder"
"settings.setting.tts.segmentConjunctions.label" = "Paced Kokoro: conjunction boundaries"
"settings.setting.tts.segmentConjunctions.description" = "Cut before and, or, or because when no sentence or comma boundary fits"
"settings.setting.tts.segmentPunctuation.label" = "Paced Kokoro: other punctuation"
"settings.setting.tts.segmentPunctuation.description" = "Use colon, semicolon, exclamation, question and closing quote/parenthesis boundaries before word cuts"
"settings.setting.tts.segmentEllipsis.label" = "Paced Kokoro: ellipsis boundaries"
"settings.setting.tts.segmentEllipsis.description" = "Treat a run of dots as one sentence ending. When disabled, only a single dot ends a sentence"
"settings.setting.irc.operator.handle.label" = "IRC Operator Handle"
"settings.setting.irc.operator.handle.description" = "Your IRC id: agents message you at it, and what you send from /irc or the IRC client comes from it. Takes effect the next time npi starts"
"settings.setting.irc.operator.viewerEnabled.label" = "IRC Client"
"settings.setting.irc.operator.viewerEnabled.description" = "Allow opening the IRC client for this session"
"settings.setting.irc.operator.relayToMainTranscript.label" = "Announce Agent-to-Agent IRC"
"settings.setting.irc.operator.relayToMainTranscript.description" = "Let live voice, event sounds and connected clients hear messages between other agents. Those messages never show in the main transcript and remain in IRC Traffic either way"
"settings.setting.irc.history.maxEntries.label" = "IRC History Size"
"settings.setting.irc.history.maxEntries.description" = "Maximum number of recent IRC delivery attempts per root conversation; oldest drop first"
"settings.setting.advisor.enabled.label" = "Enable Advisor"
"settings.setting.advisor.enabled.description" = "Pair a second model (assigned to the 'advisor' role) that passively reviews each turn and injects notes."
"settings.setting.advisor.syncBacklog.label" = "Advisor Sync Backlog"
"settings.setting.advisor.syncBacklog.description" = "Pause main agent until advisor backlog falls below threshold. Numeric values cap wait at 30 seconds; strict waits for all scheduled reviews without a wall-clock cap. Off disables catch-up delays. Abort, failure, and disposal release waits."
"settings.setting.advisor.immuneTurns.label" = "Advisor Immune Turns"
"settings.setting.advisor.immuneTurns.description" = "After an advisor concern or blocker interrupts, route further concerns as non-interrupting asides for this many primary turns. Blockers are exempt from the cooldown."
"settings.setting.advisor.continueSeverity.label" = "Advisor Continue Severity"
"settings.setting.advisor.continueSeverity.description" = "Minimum severity of an advisor note that wakes the agent after it finished with a final answer. Lower-severity notes stay as a card at the end of the transcript and reach the agent with your next message."
"settings.setting.advisor.reviewMode.label" = "Advisor Review Mode"
"settings.setting.advisor.reviewMode.description" = "Default advisor cadence when no WATCHDOG.yml roster is present. turn reviews every primary turn; agent-end reviews only final yields."
"settings.setting.advisor.reviewInterval.label" = "Advisor Review Interval"
"settings.setting.advisor.reviewInterval.description" = "Default advisor cadence when no WATCHDOG.yml roster is present: review every Nth eligible primary update. 1 = every update. Skipped updates are sent with the next scheduled review."
"settings.setting.advisor.maxNotesPerUpdate.label" = "Advisor Max Notes Per Update"
"settings.setting.advisor.maxNotesPerUpdate.description" = "Maximum non-blocker advice notes accepted per advisor prompt update (1–32; UI offers 1–5 quick picks). Blockers are exempt."
"settings.setting.advisor.evictStaleResults.label" = "Advisor Evict Stale Results"
"settings.setting.advisor.evictStaleResults.description" = "Before each review, replace the advisor's read/grep/glob output from older reviews with a short placeholder. The latest review is kept."
"settings.setting.stream.serverUrl.label" = "Stream Server"
"settings.setting.stream.redactPatterns.label" = "Extra Redaction Patterns"
"settings.setting.stream.redactPatterns.description" = "Additional regular expressions redacted from every streamed row, on top of env/secrets.yml values and built-in credential shapes"
"settings.setting.notifyAgent.when.label" = "Notify Agent When..."
"settings.setting.notifyAgent.when.description" = "Choose which events can start a turn for the idle primary agent, and separately after Ctrl+C stops a run. Unchecked events still reach context without starting a turn. Advisor timing and severity rules still apply."
"settings.setting.session.worktreeScope.label" = "Resume Worktree Scope"
"settings.setting.session.worktreeScope.description" = "Choose whether the resume picker's current folder includes sessions from other repository worktrees"
"settings.setting.power.sleepPrevention.label" = "Sleep Prevention"
"settings.setting.power.sleepPrevention.description" = "Prevent the system sleeping while the agent is running a turn; an idle session, including one waiting on background jobs, does not hold it. Each level is cumulative — it adds the flags of all lower levels."
"settings.setting.prewalk.enabled.label" = "Enable Prewalk"
"settings.setting.prewalk.enabled.description" = "Plan with the configured planning crew, then hand off to the execution crew at the first edit/write after the todo list exists. Off by default; --prewalk / --no-prewalk override this session."
"settings.setting.prewalk.planner.label" = "Planning Selector"
"settings.setting.prewalk.planner.description" = "Role alias or provider/model:effort selected for planning at startup, /new, /prewalk and restart. Empty keeps the active model, except restart returns to @default."
"settings.setting.prewalk.execution.label" = "Execution Selector"
"settings.setting.prewalk.execution.description" = "Role alias or provider/model:effort for manual/configured handoffs, including /prewalk and restart. --prewalk-into overrides this selector for one session. Auto-prewalk uses its own target."
"settings.setting.prewalk.plannerFallbacks.label" = "Planning Fallbacks"
"settings.setting.prewalk.plannerFallbacks.description" = "Ordered role aliases or provider/model:effort selectors tried when the planning selector is unavailable."
"settings.setting.prewalk.executionFallbacks.label" = "Execution Fallbacks"
"settings.setting.prewalk.executionFallbacks.description" = "Ordered role aliases or provider/model:effort selectors tried when the execution selector is unavailable."
"settings.setting.prewalk.auto.label" = "Auto Prewalk"
"settings.setting.prewalk.auto.description" = "Ask the native judge resolved through the 'judge' role whether each new top-level user task front-loads its hard reasoning. Needs a native judge; without one nothing is classified. Independent of Enable Prewalk."
"settings.setting.prewalk.autoTarget.label" = "Auto-prewalk target"
"settings.setting.prewalk.autoTarget.description" = "Model or role (default '@smol') auto-prewalk hands off to at the first edit/write."
"settings.setting.providers.maxInFlightRequests.label" = "Max In-Flight Requests"
"settings.setting.images.describeForTextModels.label" = "Describe Images for Text Models"
"settings.setting.images.describeForTextModels.description" = "When an image is attached to a model without vision support, save it under local:// and inject a description from a vision-capable model instead of dropping it"
"settings.setting.defaultThinkingLevel.label" = "Thinking Level"
"settings.setting.defaultThinkingLevel.description" = "Reasoning depth for thinking-capable models"
"settings.setting.hideThinkingBlock.label" = "Hide Thinking Blocks"
"settings.setting.hideThinkingBlock.description" = "Hide thinking blocks in assistant responses"
"settings.setting.expandThinkingBlocks.label" = "Expand Thinking Blocks"
"settings.setting.expandThinkingBlocks.description" = "Keep finished thinking blocks expanded instead of collapsing them when the turn ends"
"settings.setting.proseOnlyThinking.label" = "Prose Only Thinking"
"settings.setting.proseOnlyThinking.description" = "Omit code blocks from thinking summaries and replace them with an ellipsis"
"settings.setting.omitThinking.label" = "Omit Thinking summaries"
"settings.setting.omitThinking.description" = "Instruct upstream providers to completely omit thinking summaries from responses (where supported)"
"settings.setting.externalThinking.label" = "External Thinking"
"settings.setting.externalThinking.description" = "Private scratchpad; not shown to user. Disables supported GPT, Claude, and Gemini reasoning"
"settings.setting.externalThinking.warning" = "At your own risk: providers have flagged this request shape as abuse, up to account-level enforcement"
"settings.setting.model.loopGuard.enabled.label" = "Loop Guard"
"settings.setting.model.loopGuard.enabled.description" = "Enable automatic stream loop detection for model reasoning and prose"
"settings.setting.model.loopGuard.checkAssistantContent.label" = "Loop Guard Scan Prose"
"settings.setting.model.loopGuard.checkAssistantContent.description" = "Apply loop guard to assistant prose messages in addition to thinking logs"
"settings.setting.model.loopGuard.toolCallReminder.label" = "Loop Guard Tool-Call Reminder"
"settings.setting.model.loopGuard.toolCallReminder.description" = "When a Gemini reasoning stream emits many consecutive planning headers without calling a tool, interrupt it and inject a reminder to issue a tool call (requires Loop Guard)"
"settings.setting.model.toolCallLoopGuard.enabled.label" = "Tool-Call Loop Guard"
"settings.setting.model.toolCallLoopGuard.enabled.description" = "Detect consecutive identical tool calls across turns and inject a corrective steer"
"settings.setting.model.toolCallLoopGuard.threshold.label" = "Tool-Call Loop Threshold"
"settings.setting.model.toolCallLoopGuard.threshold.description" = "Consecutive identical tool calls required before the corrective steer is injected"
"settings.setting.model.toolCallLoopGuard.exemptTools.label" = "Tool-Call Loop Exempt Tools"
"settings.setting.model.toolCallLoopGuard.exemptTools.description" = "Tool names, or xd:// device names of write dispatches (for example mcp__peers_wait), that may repeat consecutively without triggering the cross-turn loop guard"
"settings.setting.inlineToolDescriptors.label" = "Inline Tool Descriptors"
"settings.setting.inlineToolDescriptors.description" = "Render full tool descriptors in the system prompt and strip top-level/nested descriptions from provider tool schemas so descriptor text is sent once. Auto enables this for Gemini models and disables it otherwise"
"settings.setting.includeModelInPrompt.label" = "Include Model in Prompt"
"settings.setting.includeModelInPrompt.description" = "Surface the active model identifier in the system prompt so the agent knows which model it is"
"settings.setting.includeWorkspaceTree.label" = "Include Workspace Tree"
"settings.setting.includeWorkspaceTree.description" = "Render the workspace directory tree in the system prompt. WARNING: This can bust prompt caching across sessions when files are modified."
"settings.setting.encourageEdits.label" = "Encourage Edits"
"settings.setting.encourageEdits.description" = "Require the edit tool for file edits and forbid sed/perl/python edits"
"settings.setting.skillful.label" = "List Skills in Prompt"
"settings.setting.skillful.description" = "List available skills in the system prompt; disable to save context and toggle per-session with /skillful"
"settings.setting.personality.label" = "Personality"
"settings.setting.personality.description" = "Communication style rendered into the system prompt's personality block"
"settings.setting.temperature.label" = "Temperature"
"settings.setting.temperature.description" = "Sampling temperature (0 = deterministic, 1 = creative, -1 = provider default)"
"settings.setting.topP.label" = "Top P"
"settings.setting.topP.description" = "Nucleus sampling cutoff (0-1, -1 = provider default)"
"settings.setting.topK.label" = "Top K"
"settings.setting.topK.description" = "Sample from top-K tokens (-1 = provider default)"
"settings.setting.minP.label" = "Min P"
"settings.setting.minP.description" = "Minimum probability threshold (0-1, -1 = provider default)"
"settings.setting.presencePenalty.label" = "Presence Penalty"
"settings.setting.presencePenalty.description" = "Penalty for introducing already-present tokens (-1 = provider default)"
"settings.setting.repetitionPenalty.label" = "Repetition Penalty"
"settings.setting.repetitionPenalty.description" = "Penalty for repeated tokens (-1 = provider default)"
"settings.setting.textVerbosity.label" = "Text Verbosity"
"settings.setting.textVerbosity.description" = "OpenAI Responses and Codex response verbosity (low, medium, or high)"
"settings.setting.tier.openai.label" = "Service Tier — OpenAI"
"settings.setting.tier.openai.description" = "Processing tier for OpenAI / OpenAI-Codex requests, and OpenAI-family models routed via OpenRouter (none = omit). Sent as `service_tier`."
"settings.setting.tier.anthropic.label" = "Service Tier — Anthropic"
"settings.setting.tier.anthropic.description" = "Processing tier for Claude requests. `priority` realizes fast mode (`speed: \"fast\"`) on supported direct Anthropic models; ignored on Bedrock/Vertex Claude and via OpenRouter."
"settings.setting.tier.google.label" = "Service Tier — Google"
"settings.setting.tier.google.description" = "Processing tier for Gemini (Google AI Studio + Vertex) requests, and Google-family models routed via OpenRouter (none = omit). Sent as the top-level `serviceTier` field."
"settings.setting.tier.subagent.label" = "Service Tier — Subagent"
"settings.setting.tier.subagent.description" = "Service Tier for spawned task/eval subagents. Inherit = match the main agent's live per-family tiers (tracks /fast); pick a value to apply it to whichever family the subagent's model belongs to."
"settings.setting.tier.advisor.label" = "Service Tier — Advisor"
"settings.setting.tier.advisor.description" = "Service Tier for the advisor model. None = standard processing; Inherit = match the main agent's live per-family tiers; pick a value to apply it to the advisor model's family."
"settings.setting.retry.maxRetries.label" = "Retry Attempts"
"settings.setting.retry.maxRetries.description" = "Maximum retry attempts on API errors"
"settings.setting.retry.maxDelayMs.label" = "Max Retry Delay"
"settings.setting.retry.maxDelayMs.description" = "Maximum wait between retries, in ms. When the provider asks us to wait longer than this and no credential or model fallback succeeds, the request fails fast instead of sleeping (e.g. 3-hour Anthropic rate-limit windows). 0 disables the ceiling — to let the session auto-resume through provider-stated quota resets."
"settings.setting.retry.waitForUsageReset.label" = "Wait For Usage Reset"
"settings.setting.retry.modelFallback.label" = "Retry Model Fallback"
"settings.setting.retry.modelFallback.description" = "Allow retry recovery to switch to models in retry.fallbackChains after provider errors. Independent of Auto-Promote Context"
"settings.setting.retry.fallbackOn.label" = "Fallback Trigger"
"settings.setting.retry.fallbackOn.description" = "Which failed requests may switch to a configured fallback model"
"settings.setting.retry.rateLimitWalksChain.label" = "Rate Limit Walks Chain"
"settings.setting.retry.rateLimitWalksChain.description" = "On a rate limit, do not hold the retry.fallbackChains walk for a turn whose thinking is signed by the failing model. Off (the default), such a turn keeps retrying the rate-limited model until retry.maxRetries is spent before the chain is reached."
"settings.setting.retry.usageAwareFallback.label" = "Usage-Aware Fallback"
"settings.setting.retry.usageAwareFallback.description" = "Use reliable coding-plan quota reports to prefer same-provider accounts, then configured fallback models, before a hard usage limit. Ordinary configured API keys are excluded."
"settings.setting.retry.usageReservePct.label" = "Reserve Margin"
"settings.setting.retry.usageReservePct.description" = "Treat a coding-plan model as near its limit below this remaining percentage. Unknown or unmapped usage keeps the primary model."
"settings.setting.retry.usageReservePolicy.label" = "Reserve Policy"
"settings.setting.retry.usageReservePolicy.description" = "What to do when every same-provider coding-plan account is inside the reserve margin."
"settings.setting.retry.fallbackChains.label" = "Retry Fallback Chains"
"settings.setting.retry.fallbackChains.description" = "JSON object mapping model roles, model selectors (\"provider/model-id\"), or provider wildcards (\"provider/*\") to ordered fallback selectors, e.g. {\"default\":[\"openai/gpt-4o-mini\"],\"google-antigravity/*\":[\"google/*\",\"google-vertex/*\"]}. Model-oriented keys apply whenever that model/provider is active, regardless of role; a \"provider/*\" entry keeps the failing model's id and swaps the provider. An id-prefixed wildcard (\"openrouter/google/*\") re-prefixes the failing model's bare id (google-antigravity/gemini-x -> openrouter/google/gemini-x) and, used as a key, matches only that provider's ids under the prefix. A fallback entry may carry an explicit thinking suffix (\"provider/model:low\", \":high\", \":max\", \":off\"); a bare entry inherits the failing turn's effort, and \"provider/*\" entries always inherit."
"settings.setting.retry.fallbackRevertPolicy.label" = "Fallback Revert Policy"
"settings.setting.retry.fallbackRevertPolicy.description" = "When to return to the primary model after a fallback"
"settings.setting.providers.anthropic.serverSideFallback.label" = "Anthropic Server-Side Fallback (Fable 5)"
"settings.setting.providers.anthropic.serverSideFallback.description" = "When a Claude Fable 5 / Mythos 5 request is blocked by Anthropic's safety classifier, retry it on Claude Opus 5 server-side (Anthropic `server-side-fallback-2026-06-01` beta). Opt-in — leaving this off preserves the pre-fallback behavior for every request."
"settings.setting.providers.ollama-cloud.maxConcurrency.label" = "Ollama Cloud Max Concurrency"
"settings.setting.providers.ollama-cloud.maxConcurrency.description" = "Maximum concurrent Ollama Cloud subagent runs per process; 0 disables the provider-specific limit"
"settings.setting.providers.webSearchTimeoutSeconds.label" = "Web Search Timeout"
"settings.setting.providers.antigravityEndpoint.label" = "Antigravity Endpoint Mode"
"settings.setting.providers.antigravityEndpoint.description" = "Endpoint routing strategy for google-antigravity providers (chat, search, image, discovery)"
"settings.setting.providers.fireworksTier.label" = "Fireworks Tier"
"settings.setting.providers.fireworksTier.description" = "Serving path for Fireworks requests. Priority sends `service_tier: \"priority\"` for higher reliability during peak traffic at a higher price; Standard omits it. Fast (`-fast`) models ignore this — Fast is its own serving path."
"settings.setting.providers.tinyModelDevice.label" = "Tiny Model Device"
"settings.setting.providers.tinyModelDevice.description" = "Inference backend for local tiny models (titles + memory): an ONNX execution provider, or `mlx` to download MLX weights and run them through mlx-lm on Apple silicon. Default uses CPU-only ONNX. The PI_TINY_DEVICE env var overrides this."
"settings.setting.providers.tinyModelDtype.label" = "Tiny Model Precision"
"settings.setting.providers.tinyModelDtype.description" = "ONNX quantization/precision for local tiny models. Default uses each model's shipped dtype (q4); lower precision is faster, higher is more faithful. Ignored by the MLX backend (its repos are pre-quantized 4-bit). The PI_TINY_DTYPE env var overrides this."
"settings.setting.providers.autoThinkingMaxEffort.label" = "Auto Thinking Ceiling"
"settings.setting.providers.autoThinkingMaxEffort.description" = "Highest effort the `auto` classifier may resolve. `xhigh` keeps the classifier one tier below the top, so only an explicit `ultrathink` reaches `max`; `max` lets a turn the classifier judges exceptional bill the top tier on models that expose it."
"settings.setting.features.unexpectedStopDetection.label" = "Unexpected Stops"
"settings.setting.features.unexpectedStopDetection.description" = "Automatically recover when the assistant stops without a visible message. Smart also classifies text-only stops with a small model."
"settings.setting.providers.kimiApiFormat.label" = "Kimi API Format"
"settings.setting.providers.kimiApiFormat.description" = "API format for Kimi Code provider (auto follows live model metadata)"
"settings.setting.providers.openaiWebsockets.label" = "OpenAI Codex WebSockets"
"settings.setting.providers.openaiWebsockets.description" = "WebSocket policy for OpenAI Codex models only"
"settings.setting.providers.openaiResponsesWebsockets.label" = "OpenAI Responses WebSockets"
"settings.setting.providers.openaiResponsesWebsockets.description" = "Opt in for catalog-supported standard Responses models; model or request false disables it"
"settings.setting.providers.openaiLiveSteering.label" = "OpenAI Live Steering"
"settings.setting.providers.openaiLiveSteering.description" = "Deliver messages typed while a GPT-6 response streams into that response over the Codex WebSocket, instead of waiting for the next tool boundary"
"settings.setting.providers.muse-code.storeResponses.label" = "Muse Code Stored Responses"
"settings.setting.providers.muse-code.storeResponses.description" = "Store Muse Code results on Meta's servers so a turn whose connection drops is recovered instead of re-run. Stored runs keep prompts and outputs on Meta's side."
"settings.setting.providers.openai-codex.daybreak.label" = "Codex Daybreak Blue"
"settings.setting.providers.openai-codex.daybreak.description" = "Automatically request the Daybreak Blue cyber access program on ChatGPT accounts eligible for it. OpenAI may use content from Daybreak Blue sessions to improve its models. Does not cover dedicated Daybreak Blue models (gpt-daybreak-blue-*), which may still run as Daybreak sessions."
"settings.setting.providers.cacheRetention.label" = "Prompt Cache Retention"
"settings.setting.providers.cacheRetention.description" = "Prompt-cache retention forwarded to providers that support it (Anthropic, Bedrock, OpenRouter, OpenAI)"
"settings.setting.providers.cacheWarming.label" = "Cache Warming"
"settings.setting.providers.cacheWarming.description" = "Refresh the last request's prompt-cache entry shortly before it expires (Anthropic max_tokens 0 pre-warm, else a one-token replay)"
"settings.setting.providers.cacheWarmingStrategy.label" = "Cache Warming Strategy"
"settings.setting.providers.cacheWarmingStrategy.description" = "How a long tool call is bridged once refreshing stops paying: compact the history before the cache expires, or let it expire"
"settings.setting.providers.cacheWarmingCompactPercent.label" = "Cache Bridge Compaction Percent"
"settings.setting.providers.cacheWarmingCompactPercent.description" = "Share of the context window a prompt must reach before a long tool call may be bridged with compaction; the lower of this and the token limit applies"
"settings.setting.providers.cacheWarmingCompactTokens.label" = "Cache Bridge Compaction Tokens"
"settings.setting.providers.cacheWarmingCompactTokens.description" = "Prompt tokens from which a long tool call may be bridged with compaction; the lower of this and the window percent applies"
"settings.setting.providers.streamFirstEventTimeoutSeconds.label" = "Stream First Event Timeout"
"settings.setting.providers.streamFirstEventTimeoutSeconds.description" = "Seconds to wait for the first model stream event; -1 uses provider/env defaults, 0 disables the watchdog"
"settings.setting.providers.streamIdleTimeoutSeconds.label" = "Stream Idle Timeout"
"settings.setting.providers.streamIdleTimeoutSeconds.description" = "Seconds a model stream may stay silent between events; -1 uses provider/env defaults, 0 disables the watchdog"
"settings.setting.providers.openrouterVariant.label" = "OpenRouter Routing"
"settings.setting.providers.openrouterVariant.description" = "Default routing-variant suffix appended to OpenRouter model IDs (overridden when the selector already names a variant)"
"settings.setting.providers.fetch.label" = "Fetch Provider"
"settings.setting.providers.fetch.description" = "Reader backend priority for the fetch/read URL tool"
"settings.setting.providers.webKeyless.label" = "Keyless Web Services"
"settings.setting.providers.webKeyless.description" = "Let web search and URL reading use third-party services without your credential: keyless Parallel, Exa, Firecrawl, Keenable, and Perplexity, the Jina reader, and scraped engines (Startpage, DuckDuckGo, Ecosia, Google, Mojeek, Hacker News). Off, only services you configured run."
"settings.setting.codexResets.minBlockedMinutes.label" = "Codex Auto-Redeem Min Block"
"settings.setting.codexResets.minBlockedMinutes.description" = "Only auto-redeem when the natural unblock — the latest reset among the exhausted 5h/weekly windows — is at least this many minutes away (don't spend a scarce credit to save a short wait). Raise it (e.g. 360) to ignore 5h-only blocks."
"settings.setting.codexResets.keepCredits.label" = "Codex Auto-Redeem Reserve"
"settings.setting.codexResets.keepCredits.description" = "Never auto-spend below this many saved resets (0 = the last credit may be spent automatically). Credits about to expire are exempt — a reserved credit that expires preserves nothing."
"settings.setting.codexResets.salvageHorizonHours.label" = "Codex Reset Salvage Horizon"
"settings.setting.codexResets.salvageHorizonHours.description" = "With auto-redeem enabled, spend a saved Codex reset within this many hours of expiry when either chat window has meaningful usage. 0 disables early salvage; credits expiring within 5 minutes are still attempted regardless of usage."
"settings.setting.claudeResets.minBlockedMinutes.label" = "Claude Auto-Redeem Min Block"
"settings.setting.claudeResets.minBlockedMinutes.description" = "Only auto-redeem when the natural unblock — the latest reset among the exhausted covered windows — is at least this many minutes away. A 5-hour-only reset is never used for a weekly or model-scoped block."
"settings.setting.claudeResets.keepCredits.label" = "Claude Auto-Redeem Reserve"
"settings.setting.claudeResets.keepCredits.description" = "Keep at least this many Claude resets banked (0 allows the last eligible reset to be spent automatically). The reserve applies to early salvage, but not to eligible resets expiring within 5 minutes."
"settings.setting.claudeResets.salvageHorizonHours.label" = "Claude Reset Salvage Horizon"
"settings.setting.claudeResets.salvageHorizonHours.description" = "With auto-redeem enabled, use a server-selected Cedar reset within this many hours of expiry when its covered windows have meaningful usage. 0 disables early salvage; eligible Cedar or Juniper resets expiring within 5 minutes are still attempted regardless of usage or reserve. Provider limit requirements still apply."
"settings.setting.provider.appendOnlyContext.label" = "Append-Only Context"
"settings.setting.provider.appendOnlyContext.description" = "Cache system prompt + tool specs and keep an append-only message log so provider prefix caches (DeepSeek, Xiaomi/SGLang, Anthropic) hit at maximum rate. Auto enables for known prefix-cache providers."
"settings.setting.workspace.additionalDirectories.label" = "Additional Workspace Dirs"
"settings.setting.workspace.additionalDirectories.description" = "Extra workspace directories added to every session as additional roots (multi-root workspace). Managed live via /add-dir and /remove-dir. Paths resolve relative to cwd; absolute paths recommended. The agent is told these roots exist and can read/grep/glob them."
"settings.setting.contextFiles.extra.label" = "Extra Context Files"
"settings.setting.contextFiles.extra.description" = "Extra instruction filenames loaded beside AGENTS.md. Use a JSON list of names, not paths, e.g. [\"AGENTS.local.md\"]; [] disables extras. Start a new session to load them."
"settings.setting.contextPromotion.enabled.label" = "Auto-Promote Context"
"settings.setting.contextPromotion.enabled.description" = "Promote to the model's contextPromotionTarget on context overflow instead of compacting. Retry fallback switches are controlled by Retry Model Fallback"
"settings.setting.extendedContext.label" = "Extended Context"
"settings.setting.extendedContext.description" = "Use larger context windows where supported; may incur premium pricing. Off keeps default or standard-pricing windows"
"settings.setting.compaction.enabled.label" = "Auto-Compact"
"settings.setting.compaction.enabled.description" = "Automatically compact context when it gets too large"
"settings.setting.compaction.experimentalContextManagement.label" = "Notes-backed context windows (experimental)"
"settings.setting.compaction.experimentalContextManagement.description" = "Keep persistent notes and searchable raw history across context windows."
"settings.setting.compaction.midTurnEnabled.label" = "Mid-Turn Compaction"
"settings.setting.compaction.midTurnEnabled.description" = "Check thresholds at safe mid-turn tool-loop boundaries before the next provider request; subagents always check, since their whole assignment is one turn"
"settings.setting.compaction.methodOrder.label" = "Compaction Method Order"
"settings.setting.compaction.methodOrder.description" = "Preferred fallback order for automatic context maintenance; unavailable or failed methods advance to the next choice"
"settings.setting.compaction.thresholdPercent.label" = "Compaction Threshold"
"settings.setting.compaction.thresholdPercent.description" = "Percent threshold for context maintenance; set to Default to use legacy reserve-based behavior"
"settings.setting.compaction.thresholdTokens.label" = "Compaction Token Limit"
"settings.setting.compaction.thresholdTokens.description" = "Fixed token limit for context maintenance; overrides percentage if set"
"settings.setting.compaction.handoffSaveToDisk.label" = "Save Handoff Docs"
"settings.setting.compaction.handoffSaveToDisk.description" = "Save generated handoff documents to markdown files for the auto-handoff flow"
"settings.setting.compaction.remoteStreamingV2Enabled.label" = "Remote Compaction V2"
"settings.setting.compaction.remoteStreamingV2Enabled.description" = "Use Responses streaming compaction for compatible remote compaction models"
"settings.setting.compaction.asyncEnabled.label" = "Async Compaction"
"settings.setting.compaction.asyncEnabled.description" = "Speculatively summarize in the background as context nears the compaction threshold, then splice the ready result in when the threshold is crossed"
"settings.setting.compaction.agentControl.label" = "Agent Compaction Controls"
"settings.setting.compaction.agentControl.description" = "Allow agents to inspect, propose, or apply compaction changes. Proposals never change settings."
"settings.setting.compaction.idleEnabled.label" = "Idle Compaction"
"settings.setting.compaction.idleEnabled.description" = "Compact context while idle when token count exceeds threshold"
"settings.setting.compaction.idleThresholdTokens.label" = "Idle Compaction Threshold"
"settings.setting.compaction.idleThresholdTokens.description" = "Token count above which idle compaction triggers"
"settings.setting.compaction.idleTimeoutSeconds.label" = "Idle Compaction Delay"
"settings.setting.compaction.idleTimeoutSeconds.description" = "Seconds to wait while idle before compacting; with a 1-hour prompt cache, compaction instead runs just before the cache expires"
"settings.setting.compaction.supersedeReads.label" = "Supersede Stale Reads"
"settings.setting.compaction.supersedeReads.description" = "Prune older read results when the same file is read again (cache-aware, runs every turn)"
"settings.setting.compaction.dropUseless.label" = "Elide Uneventful Results"
"settings.setting.compaction.dropUseless.description" = "Prune tool results flagged contextually useless (no matches, timed-out waits) once consumed (cache-aware)"
"settings.setting.snapcompact.systemPrompt.label" = "Snapcompact System Prompt"
"settings.setting.snapcompact.systemPrompt.description" = "Experimental: render selected system prompt text as dense PNG image(s) and attach to the first user message (vision models only). Saves tokens; loses prompt caching for imaged text."
"settings.setting.snapcompact.toolResults.label" = "Snapcompact Tool Results"
"settings.setting.snapcompact.toolResults.description" = "Experimental: render large tool results, the newest one included, as dense PNG image(s) instead of text (vision models only). Saves tokens on accumulated search and command output; read results stay text unless the model is known to edit exactly from images."
"settings.setting.tools.format.label" = "Tool Calling Mode"
"settings.setting.tools.format.description" = "Controls how tools are exposed to the model. Auto uses provider-native tool calls unless the selected model is marked as not supporting them, then falls back to the GLM owned dialect. Native forces provider-native tools; the other values force the named owned dialect."
"settings.setting.snapcompact.shape.label" = "Snapcompact Shape"
"settings.setting.snapcompact.shape.description" = "Frame shape snapcompact prints text with (compaction archive and inline imaging). Auto picks a shape tuned for the current model."
"settings.setting.branchSummary.enabled.label" = "Branch Summaries"
"settings.setting.branchSummary.enabled.description" = "Prompt to summarize when leaving a branch"
"settings.setting.eventAudio.mappingPath.label" = "Event sound mapping"
"settings.setting.eventAudio.mappingPath.description" = "Owner-curated version-1 sound assignments. /sounds on enables this session; /sounds reload rereads it."
"settings.setting.title.icons.label" = "Title Icons"
"settings.setting.title.icons.description" = "Icon and short code that head new generated or /rename session titles"
"settings.setting.title.generator.label" = "Title Generator"
"settings.setting.title.generator.description" = "What names an untitled session from the user's messages"
"settings.setting.title.refreshOnReplan.label" = "Refresh Title on Replan"
"settings.setting.title.refreshOnReplan.description" = "Refresh generated session titles after todo init replans unless the title was set by the user"
"settings.setting.title.refreshAfterPrompts.label" = "Refresh Title After Prompts"
"settings.setting.title.refreshAfterPrompts.description" = "Every this many operator prompts, ask the judge model whether a generated session title still fits the conversation, and regenerate it if not"
"settings.setting.tools.artifactSpillThreshold.label" = "Artifact Spill Threshold (KB)"
"settings.setting.tools.artifactSpillThreshold.description" = "Tool output above this size is saved as an artifact; tail is kept inline"
"settings.setting.tools.artifactTailBytes.label" = "Artifact Tail Size (KB)"
"settings.setting.tools.artifactTailBytes.description" = "Amount of tail content kept inline when output spills to artifact"
"settings.setting.tools.artifactHeadBytes.label" = "Artifact Head Size (KB)"
"settings.setting.tools.artifactHeadBytes.description" = "Amount of head content kept inline alongside the tail when output spills to artifact (middle elision). 0 disables — keep tail only."
"settings.setting.tools.outputMaxColumns.label" = "Output Column Cap"
"settings.setting.tools.outputMaxColumns.description" = "Per-line byte cap for streaming tool outputs (bash, python, js eval) and `read`. Lines wider than this are ellipsis-truncated; remaining bytes up to the next newline are dropped. 0 disables."
"settings.setting.tools.artifactTailLines.label" = "Artifact Tail Lines"
"settings.setting.tools.artifactTailLines.description" = "Maximum lines of tail content kept inline when output spills to artifact"
"settings.setting.tools.artifactMaxBytes.label" = "Artifact File Cap (MB)"
"settings.setting.tools.artifactMaxBytes.description" = "Maximum size of the artifact file saved for streaming tool output (bash, python, js eval). Larger output keeps its beginning (up to 3 MB) and its most recent remainder, with a truncation notice between them. 0 = unlimited."
"settings.setting.readLineNumbers.label" = "Line Numbers"
"settings.setting.readLineNumbers.description" = "Prepend line numbers to read tool output by default"
"settings.setting.read.defaultLimit.label" = "Default Read Limit"
"settings.setting.read.defaultLimit.description" = "Default number of lines returned when agent calls read without a limit"
"settings.setting.read.renderMarkdown.label" = "Markdown Previews"
"settings.setting.read.renderMarkdown.description" = "Render Markdown read results as formatted terminal Markdown previews instead of raw source"
"settings.setting.read.summarize.enabled.label" = "Read Summaries"
"settings.setting.read.summarize.enabled.description" = "Return structural code summaries when read is called without an explicit selector"
"settings.setting.read.summarize.prose.label" = "Prose Summaries"
"settings.setting.read.summarize.prose.description" = "Return structural summaries for Markdown and plain text reads"
"settings.setting.read.summarize.minBodyLines.label" = "Read Summary Body Lines"
"settings.setting.read.summarize.minBodyLines.description" = "Minimum multiline body or literal length before read summaries collapse it"
"settings.setting.read.summarize.minCommentLines.label" = "Read Summary Comment Lines"
"settings.setting.read.summarize.minCommentLines.description" = "Minimum multiline block comment length before read summaries collapse it"
"settings.setting.read.summarize.minTotalLines.label" = "Read Summary Minimum File Length"
"settings.setting.read.summarize.minTotalLines.description" = "Files with fewer total lines are read verbatim instead of structurally summarized"
"settings.setting.read.summarize.unfoldUntil.label" = "Read Summary Unfold Target"
"settings.setting.read.summarize.unfoldUntil.description" = "BFS-unfold elidable spans until the summary is at least this many visible lines. 0 keeps only the outermost elisions."
"settings.setting.read.summarize.unfoldLimit.label" = "Read Summary Unfold Ceiling"
"settings.setting.read.summarize.unfoldLimit.description" = "Hard ceiling on summary size while BFS-unfolding. An unfold whose revealed lines would exceed this is skipped (that span stays folded) and unfolding continues with the remaining spans."
"settings.setting.read.toolResultPreview.label" = "Inline Read Previews"
"settings.setting.read.toolResultPreview.description" = "Render read tool results inline in the transcript instead of summary rows"
"settings.setting.tools.approval.label" = "Tool Approval Policies"
"settings.setting.tools.approval.description" = "Per-tool approval policies. Set to 'allow' to auto-approve, 'prompt' to require confirmation, or 'deny' to block. Overrides are honored in every approval mode."
"settings.setting.tools.approvalMode.label" = "Tool Approval"
"settings.setting.tools.approvalMode.description" = "Default approval behavior for tool calls. 'Always ask' auto-approves read-only tools only. 'Ask and remember' also asks before file reads, and can remember a file or folder. 'Write' auto-approves read and workspace-write tools. 'Yolo' auto-approves all tiers; user policy may still prompt or block."
"settings.setting.tools.restrictedFolders.label" = "Restricted Folders"
"settings.setting.tools.restrictedFolders.description" = "Folders where every read, write, edit, search, or command needs an explicit approval, whatever the approval mode or a remembered grant. The folder and everything under it is restricted; commands are matched by the directory they run in. A JSON list of paths, e.g. [\"~/secrets\"]."
"settings.setting.todo.enabled.label" = "Todos"
"settings.setting.todo.enabled.description" = "Enable the todo tool for task tracking"
"settings.setting.todo.reminders.label" = "Todo Reminders"
"settings.setting.todo.reminders.description" = "Remind the agent to complete todos before stopping"
"settings.setting.todo.remindersMax.label" = "Todo Reminder Limit"
"settings.setting.todo.remindersMax.description" = "Maximum number of todo reminders before giving up"
"settings.setting.todo.midRunNudges.label" = "Mid-Run Todo Nudges"
"settings.setting.todo.midRunNudges.description" = "How often a long turn is reminded to update its todo list while it keeps changing things"
"settings.setting.todo.eager.label" = "Create Todos Automatically"
"settings.setting.todo.eager.description" = "How strongly to push automatic todo-list creation after the first message"
"settings.setting.tasks.todoClearDelay.label" = "Todo Auto-Clear Delay"
"settings.setting.tasks.todoClearDelay.description" = "Delay before completed or abandoned todos are removed from the todo widget"
"settings.setting.glob.enabled.label" = "Glob"
"settings.setting.glob.enabled.description" = "Enable the glob tool for glob-based file lookup"
"settings.setting.grep.enabled.label" = "Grep"
"settings.setting.grep.enabled.description" = "Enable the grep tool for regex content search"
"settings.setting.grep.contextBefore.label" = "Grep Context Before"
"settings.setting.grep.contextBefore.description" = "Lines of context before each grep match"
"settings.setting.grep.contextAfter.label" = "Grep Context After"
"settings.setting.grep.contextAfter.description" = "Lines of context after each grep match"
"settings.setting.astGrep.enabled.label" = "AST Grep"
"settings.setting.astGrep.enabled.description" = "Enable the ast_grep tool for structural AST search"
"settings.setting.astEdit.enabled.label" = "AST Edit"
"settings.setting.astEdit.enabled.description" = "Enable the ast_edit tool for structural AST rewrites"
"settings.setting.find.verifyModel.label" = "Find Verification Model"
"settings.setting.find.verifyModel.description" = "Model selector (e.g. openrouter/liquid/d1-ultra) tried first for find's passage verification, before the judge role; filename and sketch ranking stay on the judge role. Unset: the judge role verifies too"
"settings.setting.find.enabled.label" = "Find (semantic grep)"
"settings.setting.find.enabled.description" = "Enable the find tool: natural-language search for files and line ranges, judged by the judge model role. Auto enables it only when the judge role resolves to a native TypeSafe jev model"
"settings.setting.debug.enabled.label" = "Debug"
"settings.setting.debug.enabled.description" = "Enable the debug tool for DAP-based debugging"
"settings.setting.launch.enabled.label" = "Services"
"settings.setting.launch.enabled.description" = "Enable named bash services and proc:// supervision for shared long-running project processes"
"settings.setting.speechgen.enabled.label" = "Speech Generation"
"settings.setting.speechgen.enabled.description" = "Enable the tts tool for on-device (Phonon) or xAI Grok Voice speech-file synthesis"
"settings.setting.generate_image.enabled.label" = "Generate Image"
"settings.setting.generate_image.enabled.description" = "Enable the generate_image tool (text-to-image generation and editing). Exposed as an xd:// device when tools.xdev is on."
"settings.setting.computer.enabled.label" = "Computer"
"settings.setting.computer.enabled.description" = "Enable the scriptable host-desktop eval prelude (screenshots, input, accessibility)"
"settings.setting.ratchet.enabled.label" = "Ratchet"
"settings.setting.ratchet.enabled.description" = "Enable the ratchet eval/hillclimb prelude; /ratchet turns it on for the current session"
"settings.setting.archive.enabled.label" = "Archive"
"settings.setting.archive.enabled.description" = "Enable the read-only archive eval prelude: prompt history, recent projects, past sessions and recaps"
"settings.setting.commit.enabled.label" = "Selective commit"
"settings.setting.commit.enabled.description" = "Enable the commit eval prelude and /commit: commit only the lines this agent and its subagents wrote"
"settings.setting.computer.display.label" = "Computer Display"
"settings.setting.computer.display.description" = "Active window's display (active), all displays (all), or a native display id"
"settings.setting.computer.maxWidth.label" = "Computer Screenshot Width"
"settings.setting.computer.maxWidth.description" = "Maximum screenshot width in pixels"
"settings.setting.computer.maxHeight.label" = "Computer Screenshot Height"
"settings.setting.computer.maxHeight.description" = "Maximum screenshot height in pixels"
"settings.setting.computer.backgroundFallback.label" = "Computer Background Fallback"
"settings.setting.computer.backgroundFallback.description" = "What window input does when its background route is unavailable: rerun it in takeover and return focus to your app (macOS; elsewhere plain takeover), or refuse, which also keeps the agent from taking the foreground or opening macOS menus itself"
"settings.setting.images.questionTimeoutMs.label" = "Image Question Timeout"
"settings.setting.images.questionTimeoutMs.description" = "Per-request timeout for the vision-model call behind read's ?q= image questions, in milliseconds. A stalled provider fails fast with a timeout error instead of blocking until manual abort. Set to 0 to disable the timeout."
"settings.setting.checkpoint.enabled.label" = "Checkpoint/Rewind"
"settings.setting.checkpoint.enabled.description" = "Enable the checkpoint and rewind tools for context checkpointing"
"settings.setting.fetch.enabled.label" = "Read URLs"
"settings.setting.fetch.enabled.description" = "Allow the read tool to fetch and process URLs"
"settings.setting.vault.enabled.label" = "Obsidian Vault"
"settings.setting.vault.enabled.description" = "Enable the vault:// internal URL for reading and editing Obsidian vault content via the Obsidian CLI. When disabled, vault:// resolution is refused and the vault:// entry is omitted from the system prompt."
"settings.setting.github.enabled.label" = "GitHub CLI"
"settings.setting.github.enabled.description" = "Enable the github tool (op-based dispatch for repository, issue, pull request, diff, search, checkout, push, and Actions watch workflows)"
"settings.setting.github.cache.enabled.label" = "GitHub View Cache"
"settings.setting.github.cache.enabled.description" = "Cache rendered issue/PR view output in ~/.omp/cache/github-cache.db so repeated reads are free"
"settings.setting.github.cache.softTtlSec.label" = "GitHub Cache Soft TTL"
"settings.setting.github.cache.softTtlSec.description" = "Within this window, cached issue/PR view rows are returned directly (seconds; default 5 minutes)"
"settings.setting.github.cache.hardTtlSec.label" = "GitHub Cache Hard TTL"
"settings.setting.github.cache.hardTtlSec.description" = "Past the soft TTL the cached row is returned and refreshed in the background; past the hard TTL it is dropped (seconds; default 7 days)"
"settings.setting.web_search.enabled.label" = "Web Search"
"settings.setting.web_search.enabled.description" = "Enable the web_search tool for live web results"
"settings.setting.security.enabled.label" = "Security"
"settings.setting.ask.enabled.label" = "Ask"
"settings.setting.ask.enabled.description" = "Enable the ask tool for interactive user questions"
"settings.setting.out.enabled.label" = "Out"
"settings.setting.out.enabled.description" = "Let the agent reply mid-task by writing to out://, shown like a response without ending its turn. Unset: on in the interactive TUI, off in print, RPC, and ACP"
"settings.setting.tools.intentTracing.label" = "Intent Tracing"
"settings.setting.tools.intentTracing.description" = "Ask the agent to describe the intent of each tool call before executing it. Unset: on in the interactive TUI, off in print, RPC, ACP, and SDK sessions"
"settings.setting.tools.abortOnFabricatedResult.label" = "Abort On Fabricated Tool Result"
"settings.setting.tools.abortOnFabricatedResult.description" = "With in-band tool calls, stop the model immediately when it starts hallucinating a tool result mid-turn. Disable to let the model finish generating and discard the fabricated continuation instead."
"settings.setting.tools.speculativeExecution.enabled.label" = "Experimental Speculative Execution"
"settings.setting.tools.speculativeExecution.enabled.description" = "Enable the discard-safe first slice: validated local reads through direct read calls and nested eval. Network requests, provider completions, and live filesystem writes are not part of this baseline."
"settings.setting.tools.speculativeExecution.maxInFlight.label" = "Speculative Execution Concurrency"
"settings.setting.tools.speculativeExecution.maxInFlight.description" = "Maximum number of validated local reads allowed to run before normal dispatch."
"settings.setting.tools.maxTimeout.label" = "Max Tool Timeout"
"settings.setting.tools.maxTimeout.description" = "Maximum timeout in seconds the agent can set for any tool (0 = no limit)"
"settings.setting.async.enabled.label" = "Async Execution"
"settings.setting.async.enabled.description" = "Enable async bash commands and background task execution"
"settings.setting.async.printWake.label" = "Wake Print Mode on Job Results"
"settings.setting.async.printWake.description" = "In print mode (-p, --mode json), keep running after the last prompt while this run's background jobs are active, and start another turn in the same session with each job's result; exits once no job or result is pending. Off: print mode exits after its prompts and cancels running jobs"
"settings.setting.async.widgets.label" = "Live Job Widgets"
"settings.setting.async.widgets.description" = "Draw a live widget for each running background job (charts, bars, status grids derived from its output) in the wait card, the jobs pill and the jobs sheet, and caption long shell commands with one line on what they do. The `widget` model role (default: `smol`) writes one spec and at most one caption per job; updates need no further model calls"
"settings.setting.tools.xdev.label" = "xd:// Tools"
"settings.setting.tools.xdev.description" = "Mount rarely-used (discoverable) tools under xd:// device URLs driven via read/write instead of shipping their schemas on every request. Sessions whose explicit tool list grants read but omits write mount devices through a device-only write transport (only local:// scratch stays writable besides devices). Disable to expose every enabled tool top-level."
"settings.setting.tools.xdevDocs.label" = "xd:// Prompt Docs"
"settings.setting.tools.xdevDocs.description" = "Choose which mounted-device docs and schemas are inlined in the system prompt. Built-ins keeps core tools inline while MCP and extension tools stay on-demand."
"settings.setting.tools.xdevInlineDevices.label" = "xd:// Inline Devices"
