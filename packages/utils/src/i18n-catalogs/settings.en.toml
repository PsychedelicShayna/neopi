"settings.setting.mcp.builtinTransforms.label" = "MCP Built-in Transforms"
"settings.setting.mcp.builtinTransforms.description" = "Skip recognized MCP servers that omp's own tools replace (Codex's node_repl while eval runs JavaScript)"
"settings.setting.mcp.renderMarkdownResults.label" = "MCP Markdown Results"
"settings.setting.mcp.renderMarkdownResults.description" = "Render non-JSON MCP text results as Markdown in the transcript"
"settings.setting.mcp.notifications.label" = "MCP Update Injection"
"settings.setting.mcp.notifications.description" = "Inject MCP resource updates into the agent conversation"
"settings.setting.mcp.notificationDebounceMs.label" = "MCP Notification Debounce"
"settings.setting.mcp.notificationDebounceMs.description" = "Debounce window in milliseconds for MCP resource updates before injecting them into the conversation"
"settings.setting.secrets.enabled.label" = "Hide Secrets"
"settings.setting.secrets.enabled.description" = "Obfuscate configured secrets and redact credential-shaped tokens before sending to AI providers"
"settings.setting.collab.relayUrl.label" = "Relay URL"
"settings.setting.collab.relayUrl.description" = "Relay used by /collab (wss://host[:port])"
"settings.setting.collab.webUrl.label" = "Web UI URL"
"settings.setting.collab.webUrl.description" = "Browser UI used by /collab links; empty derives from collab.relayUrl; explicit http:// is localhost-only"
"settings.setting.collab.displayName.label" = "Display Name"
"settings.setting.collab.displayName.description" = "Name shown to other collab participants (default: OS username)"
"settings.setting.collab.autoStart.label" = "Auto Start"
"settings.setting.monitor.tmux.autoStart.label" = "Start the tmux agent monitor"
"settings.setting.monitor.tmux.autoStart.description" = "Open a dedicated tmux session with one live pane per subagent and advisor whenever a session starts inside tmux"
"settings.setting.monitor.tmux.includeAdvisors.label" = "Monitor advisors"
"settings.setting.monitor.tmux.includeAdvisors.description" = "Give advisors their own read-only monitor panes"
"settings.setting.monitor.tmux.maxRows.label" = "Maximum monitor rows"
"settings.setting.monitor.tmux.maxRows.description" = "Positive integer or \"infinite\". Default: 2. Restart the monitor to redistribute existing panes"
"settings.setting.monitor.tmux.maxColumns.label" = "Maximum monitor columns"
"settings.setting.monitor.tmux.maxColumns.description" = "Positive integer or \"infinite\" (default). A new window opens only when both finite limits are full"
"settings.setting.monitor.tmux.fillOrder.label" = "Monitor fill order"
"settings.setting.monitor.tmux.fillOrder.description" = "Fill rows down each column first, or columns across each row first; also chooses the first alternate growth axis"
"settings.setting.monitor.tmux.growth.label" = "Monitor growth"
"settings.setting.monitor.tmux.growth.description" = "Alternate takes effect when both counts are infinite: fill each new edge before growing the other axis"
"settings.setting.monitor.tmux.direction.label" = "Monitor growth direction"
"settings.setting.monitor.tmux.direction.description" = "Grow down and right, or mirror placement to grow up and left"
"settings.setting.monitor.tmux.rowHeight.label" = "Monitor row height"
"settings.setting.monitor.tmux.rowHeight.description" = "Positive integer in terminal cells, or \"dynamic\" (default) to equalize row heights"
"settings.setting.monitor.tmux.columnWidth.label" = "Monitor column width"
"settings.setting.monitor.tmux.columnWidth.description" = "Positive integer in terminal cells, or \"dynamic\" (default) to equalize column widths"
"settings.setting.mnemopi.dbPath.label" = "Mnemopi DB Path"
"settings.setting.mnemopi.dbPath.description" = "Optional SQLite DB path; a leading ~ is the home directory. Defaults to the agent memories directory."
"settings.setting.mnemopi.bank.label" = "Mnemopi Bank"
"settings.setting.mnemopi.bank.description" = "Optional shared bank base name. Per-project modes derive project-local banks from it."
"settings.setting.mnemopi.scoping.label" = "Mnemopi Scoping"
"settings.setting.mnemopi.scoping.description" = "global = one shared bank; per-project = isolated bank per cwd; per-project-tagged = project-local writes plus global recall visibility"
"settings.setting.mnemopi.embeddingVariant.label" = "Embedding variant"
"settings.setting.mnemopi.embeddingVariant.description" = "Local embedding model family. en = stronger English model; multilingual = cross-language model. Changing this rebuilds existing memory embeddings on next start."
"settings.setting.mnemopi.autoRecall.label" = "Mnemopi Auto Recall"
"settings.setting.mnemopi.autoRecall.description" = "Recall local memories into the first turn of each session"
"settings.setting.mnemopi.recallRelevance.label" = "Mnemopi Recall Relevance"
"settings.setting.mnemopi.recallRelevance.description" = "Ask the judge model role whether each automatically recalled memory is relevant to the task before injecting it"
"settings.setting.mnemopi.autoRetain.label" = "Mnemopi Auto Retain"
"settings.setting.mnemopi.autoRetain.description" = "Retain completed conversation turns into local Mnemopi memory"
"settings.setting.mnemopi.polyphonicRecall.label" = "Mnemopi Polyphonic Recall"
"settings.setting.mnemopi.polyphonicRecall.description" = "Fuse recall with graph, fact, vector and temporal voices so linked memories surface without a keyword match"
"settings.setting.mnemopi.enhancedRecall.label" = "Mnemopi Enhanced Recall"
"settings.setting.mnemopi.enhancedRecall.description" = "Cache recall results for repeated and similar queries with identical options; any memory write clears it"
"settings.setting.mnemopi.proactiveLinking.label" = "Mnemopi Proactive Linking"
"settings.setting.mnemopi.proactiveLinking.description" = "Ingest new memories into the episodic graph as they are stored, linking them to related entities and memories"
"settings.setting.mnemopi.noEmbeddings.label" = "Mnemopi Disable Embeddings"
"settings.setting.mnemopi.noEmbeddings.description" = "Force deterministic FTS-only recall instead of vector embeddings"
"settings.setting.mnemopi.embeddingModel.label" = "Mnemopi Embedding Model"
"settings.setting.mnemopi.embeddingModel.description" = "Advanced: explicit embedding model id that overrides the variant. Leave empty to use mnemopi.embeddingVariant."
"settings.setting.mnemopi.embeddingApiUrl.label" = "Mnemopi Embedding API URL"
"settings.setting.mnemopi.embeddingApiUrl.description" = "Optional OpenAI-compatible embedding endpoint passed to Mnemopi"
"settings.setting.mnemopi.embeddingApiKey.label" = "Mnemopi Embedding API Key"
"settings.setting.mnemopi.embeddingApiKey.description" = "Optional embedding API key passed to Mnemopi"
"settings.setting.mnemopi.embeddingQueryPrefix.label" = "Mnemopi Embedding Query Prefix"
"settings.setting.mnemopi.embeddingQueryPrefix.description" = "Text prepended to recall queries before embedding, for instruction-tuned embedders (Qwen3-Embedding, E5); stored memories are embedded unchanged"
"settings.setting.mnemopi.embeddingInputType.label" = "Mnemopi Embedding Input Type"
"settings.setting.mnemopi.embeddingInputType.description" = "Send input_type (query for recall, passage for stored memories) with embedding API requests; NVIDIA NIM asymmetric embedders require it"
"settings.setting.mnemopi.llmMode.label" = "Mnemopi LLM Mode"
"settings.setting.mnemopi.llmMode.description" = "Use no LLM, the online tiny model (the TINY role from /roles, else @smol), or a remote OpenAI-compatible endpoint"
"settings.setting.mnemopi.llmBaseUrl.label" = "Mnemopi LLM Base URL"
"settings.setting.mnemopi.llmBaseUrl.description" = "Optional OpenAI-compatible LLM endpoint for Mnemopi remote mode"
"settings.setting.mnemopi.llmApiKey.label" = "Mnemopi LLM API Key"
"settings.setting.mnemopi.llmApiKey.description" = "Optional LLM API key for Mnemopi remote mode"
"settings.setting.mnemopi.llmModel.label" = "Mnemopi LLM Model"
"settings.setting.mnemopi.llmModel.description" = "Optional LLM model name for Mnemopi remote mode"
"settings.setting.tui.colorfulMarkdown.label" = "Colorful Markdown"
"settings.setting.tui.colorfulMarkdown.description" = "Color headings by level, bold and italic text, inline code, and table headers from the theme's ANSI palette. Off uses one heading color and plain bold/italic."
"settings.setting.tui.renderEmbeds.label" = "Render Embedded Images and Pages"
"settings.setting.tui.renderEmbeds.description" = "Invite the agent to show pictures with <img> and web pages with <iframe>, loading them (remote addresses included) to draw inline on terminals that show graphics"
"settings.setting.tui.spinnerInterval.label" = "Spinner Interval (ms)"
"settings.setting.tui.spinnerInterval.description" = "Milliseconds between frames of every spinner, the terminal title included; 0 shows static glyphs. Unset follows Motion"
"settings.setting.tui.maxFps.label" = "Max Frames Per Second"
"settings.setting.tui.maxFps.description" = "Ceiling on how often the TUI repaints, streaming text included. Keystroke echo keeps 30 fps, so the pane you type in stays responsive"
"settings.setting.tui.motion.label" = "Motion"
"settings.setting.tui.motion.description" = "One switch over spinners, shimmer, and decorative blink/fade. Streaming text is unaffected (see Max Frames Per Second). A spinner interval you set still wins"
"settings.setting.display.shellVisualization.label" = "Shell Visualization"
"settings.setting.display.shellVisualization.description" = "Show bash commands as an interactive execution visualization instead of plain shell commands"
"settings.setting.btw.inject.label" = "/btw Steering Inject"
"settings.setting.btw.inject.description" = "When you ask /btw for a steering prompt, it drafts one in <inject> tags, highlighted in the answer; Alt+I (app.btw.inject) sends it to the main session"
"settings.setting.composer.predictionAlternatives.label" = "Prediction Alternatives"
"settings.setting.update.channel.description" = "Only a persisted Global change to a different channel or a successful `npi update stable|nightly` releases the rollback hold. Project, Session and process overrides do not."
"settings.setting.update.auto.label" = "NeoPi Auto-Update"
"settings.setting.update.auto.description" = "Check the selected NeoPi channel after interactive startup"
"settings.setting.bash.enabled.description" = "Enable the bash tool for shell command execution"
"settings.setting.bash.allowCompoundCommands.label" = "Allow Compound Commands"
"settings.setting.bash.allowCompoundCommands.description" = "Evaluate literal && chains per command; unmatched commands use normal bash approval policy and mode"
"settings.setting.bash.autoBackground.enabled.label" = "Bash Auto-Background"
"settings.setting.bash.autoBackground.enabled.description" = "Automatically background long-running bash commands and deliver the result later"
"settings.setting.bash.gitGuard.label" = "Git Guard"
"settings.setting.bash.gitGuard.description" = "Refuse git commands that discard or move shared work in a repository's main checkout: stash, reset --hard or to another commit, and checkout/switch/restore outside a merge or rebase conflict. In a linked worktree they run, saving uncommitted changes they discard first"
"settings.setting.bash.patterns.label" = "Bash Approval Patterns"
"settings.setting.bash.patterns.description" = "Ordered bash command approval rules. Each item has match and approval fields; only '*' wildcards are supported."
"settings.setting.bash.allowedEnvVars.label" = "Bash Allowed Environment Variables"
"settings.setting.bash.allowedEnvVars.description" = "Exact environment variable names allowed as leading KEY=VALUE prefixes when matching bash.patterns allow rules (no wildcards). Any value is accepted, so list only benign build/test variables; execution-altering variables (PATH, LD_PRELOAD, BASH_ENV, *_RUNNER, *_WRAPPER) allow arbitrary command execution."
"settings.setting.bashInterceptor.enabled.label" = "Bash Interceptor"
"settings.setting.bashInterceptor.enabled.description" = "Block shell commands that have dedicated tools"
"settings.setting.bash.direnv.label" = "direnv Auto-Load"
"settings.setting.bash.direnv.description" = "Auto-load a repo's direnv/devenv `.envrc` into the bash session so devenv tools and env vars are present without manual `direnv exec`. Honors direnv's allow list: an `.envrc` you haven't `direnv allow`ed is never executed"
"settings.setting.bash.direnvLoadTimeoutMs.label" = "direnv Load Timeout (ms)"
"settings.setting.bash.direnvLoadTimeoutMs.description" = "Max wait for the first `direnv export` (a cold devenv shell can be slow); on timeout the session runs without the direnv env"
"settings.setting.shellMinimizer.enabled.label" = "Shell Minimizer"
"settings.setting.shellMinimizer.enabled.description" = "Compress verbose shell output (git, npm, cargo, etc.) before returning it to the agent"
"settings.setting.shellMinimizer.sourceOutlineLevel.label" = "Shell Minimizer Source Outline"
"settings.setting.shellMinimizer.sourceOutlineLevel.description" = "Source outline mode for cat/read of source files: default or aggressive"
"settings.setting.autolearn.enabled.label" = "Auto-Learn (experimental)"
"settings.setting.autolearn.enabled.description" = "After the agent stops, nudge it to capture lessons to memory and create/enhance isolated managed skills"
"settings.setting.autolearn.autoContinue.label" = "Auto-run capture at stop"
"settings.setting.autolearn.autoContinue.description" = "When on, auto-run one private capture turn at stop (uses extra tokens). When off, only standing auto-learn guidance remains."
"settings.setting.task.isolation.enabled.label" = "Allow Isolated Subagents"
"settings.setting.task.isolation.enabled.description" = "Allow per-task isolation with `isolated: true`; tasks without it run in the shared checkout"
"settings.setting.isolation.backend.label" = "Isolation Backend"
"settings.setting.isolation.backend.description" = "Backend used for subagent isolation and worktree cloning"
"settings.setting.worktree.clone.label" = "Clone Checkout into Worktrees"
"settings.setting.worktree.clone.description" = "New worktrees from `github pr_checkout` and `git worktree add` in bash start as a copy-on-write clone of the current checkout so ignored build artifacts (node_modules, target) carry over; falls back to a plain checkout when the filesystem cannot clone"
"settings.setting.worktree.cleanSource.label" = "Clean Source Checkout on /wt"
"settings.setting.worktree.cleanSource.description" = "When creating a worktree with `/wt`, reset tracked changes and remove untracked files from the original checkout after carrying them over"
"settings.setting.worktree.onStart.label" = "Worktree on Start"
"settings.setting.worktree.onStart.description" = "Whether fresh interactive sessions start in a new linked worktree"
"settings.setting.worktree.onExit.label" = "Worktree on Exit"
"settings.setting.worktree.onExit.description" = "What to do on exit with worktrees created since omp started (on start or with `/wt`)"
"settings.setting.task.isolation.apply.label" = "Apply Isolated Changes"
"settings.setting.task.isolation.apply.description" = "Automatically apply successful isolated task changes to the parent checkout; disable to retain patch or branch artifacts"
"settings.setting.ovnfs.path.label" = "ovnfs Binary"
"settings.setting.ovnfs.path.description" = "ovnfs executable; unset looks for `ovnfs` on PATH. When it is found, ovnfs checkouts (copy-on-write views of a folder, ready in about a second at any size) serve every separate copy: the system prompt tells agents to open checkouts instead of git worktrees or copies, and with `isolation.backend` on auto, isolated subagents (when allowed) run in checkouts instead of native clones and `/wt` moves the session into a checkout instead of a linked worktree"
"settings.setting.task.isolation.merge.label" = "Isolation Merge Strategy"
"settings.setting.task.isolation.merge.description" = "How isolated task changes are integrated (patch apply or branch merge)"
"settings.setting.task.isolation.commits.label" = "Isolation Commit Style"
"settings.setting.task.isolation.commits.description" = "Commit message style for nested repo changes (generic or AI-generated)"
"settings.setting.worktree.base.label" = "Worktree Base Directory"
"settings.setting.task.eager.label" = "Prefer Task Delegation"
"settings.setting.task.eager.description" = "How strongly to push the main agent to delegate work; subagents keep the model's own policy"
"settings.setting.task.autoParallel.label" = "Auto Parallel"
"settings.setting.task.autoParallel.description" = "Ask the native judge resolved through the 'judge' role which parts of each new top-level prompt can run concurrently. Needs a native judge and the task tool; without them nothing is judged."
"settings.setting.task.batch.label" = "Batch Task Calls"
"settings.setting.task.batch.description" = "Switch the task tool to its batch shape: one call carries { context, tasks[] } — one subagent per item, with an optional per-item agent (defaulting to the session spawn-policy agent), per-item isolation, and a required shared context prepended to every assignment. With async.enabled=true, each spawn runs as an independent background agent with the normal idle/parked lifecycle; otherwise the call blocks for merged results. Disable to restore the flat single-spawn schema."
"settings.setting.task.steps.label" = "Sequential Task Steps"
"settings.setting.task.steps.description" = "Spawns take ordered `steps` instead of one `task`: the subagent gets the first step, then each next one once it finishes the previous; past 4 steps, earlier messages carry two or more. The last step's result is the task's result."
"settings.setting.task.structured.label" = "Structured Task Results"
"settings.setting.task.structured.description" = "Expose outputSchema/schemaMode on the task tool and honor agent output schemas; a subagent with a schema returns its result through the yield tool, validated against it. Off: task subagents ignore schemas, except agents whose definition sets structured: true. A subagent without a schema has no yield tool and returns its final message. Eval agent()/workpool spawns always honor schemas."
"settings.setting.task.speculativeLaunch.label" = "Speculative Task Launch"
"settings.setting.task.speculativeLaunch.description" = "Start each batch subagent as soon as its tasks[] item finishes streaming instead of waiting for the whole task call. Launched agents are aborted if the finished call fails validation, is blocked, or its arguments change. Requires auto-allowed task approval and no extension tool lifecycle handlers."
"settings.setting.task.enableEffort.label" = "Per-Task Effort"
"settings.setting.task.enableEffort.description" = "Expose the optional effort parameter on task spawns, allowing callers to override each subagent's thinking level"
"settings.setting.task.perCallModel.label" = "Per-Call Model"
"settings.setting.task.perCallModel.description" = "Whether a subagent call may pick its model with one exact provider/model-id[@upstream][:level] selector. An @upstream pin is part of the model identity and is supported only by aggregators. Only models the configuration already routes to are accepted. Project settings can turn it off but not on, and never approve a model."
"settings.setting.task.perCallModelAllow.label" = "Per-Call Model Allowlist"
"settings.setting.task.perCallModelAllow.description" = "Exact selectors: `provider/model-id`, including `@upstream` only for a pinned OpenRouter/Vercel route (e.g. `openrouter/x@y`). When set, a per-call model must also be listed here. Empty: every model the configuration grants. A project list can only narrow this one."
"settings.setting.task.maxConcurrency.label" = "Max Concurrent Tasks"
"settings.setting.task.maxConcurrency.description" = "Maximum number of subagents running concurrently"
"settings.setting.task.workerThreads.label" = "Subagent Worker Threads"
"settings.setting.task.workerThreads.description" = "Maximum worker threads for subagents. Up to 8 concurrent subagents run on the main thread; at 9 one worker joins, and one more each time the count doubles (18, 36, 72). Workers stop a minute after no subagent is live in them; 0 keeps every subagent on the main thread"
"settings.setting.task.enableLsp.label" = "LSP Edit Checks in Subagents"
"settings.setting.task.enableLsp.description" = "Run LSP formatting and diagnostics on subagent edits. Off by default to keep subagents cheap; the lsp tool stays available to them either way."
"settings.setting.task.crossInstance.label" = "Cross-Instance Agent Messaging"
"settings.setting.task.crossInstance.description" = "Let other omp instances in this folder read agent outputs and send messages that can wake agents"
"settings.setting.task.maxRecursionDepth.label" = "Max Task Recursion"
"settings.setting.task.maxRecursionDepth.description" = "How many levels deep subagents can spawn their own subagents"
"settings.setting.task.maxRuntimeMs.label" = "Max Subagent Runtime"
"settings.setting.task.maxRuntimeMs.description" = "Hard wall-clock limit per subagent (ms). 0 disables it. Defense-in-depth against provider-side stream hangs that escape the inference-layer watchdog; triggers a normal subagent abort with a 'timed out' reason."
"settings.setting.task.completionProbe.label" = "Subagent Completion Probe"
"settings.setting.task.completionProbe.description" = "Ask a working subagent, through a cached side request like /btw, to estimate how complete its task is: after 2, 5, 10 and 30 more minutes, then hourly. The estimate shows next to the subagent in wait and task views. Only subagents spawned by the main agent of an interactive session are asked; print, RPC, ACP and SDK runs never probe."
"settings.setting.task.definitionGenerationConversationTtlMs.label" = "Generation Conversation TTL"
"settings.setting.task.definitionGenerationConversationTtlMs.description" = "Keep agent and advisor generation conversations in memory for this many milliseconds after the last generation. Default: 1 hour. 0 disables retention; nothing is saved to disk."
"settings.setting.task.agentIdleTtlMs.label" = "Agent Idle TTL"
"settings.setting.task.agentIdleTtlMs.description" = "How long an idle subagent stays live in memory before being parked to disk (ms). Parked agents are revived automatically when messaged or resumed. 0 keeps idle agents live until exit."
"settings.setting.task.softRequestBudget.label" = "Soft Subagent Request Budget"
"settings.setting.task.softRequestBudget.description" = "Soft per-subagent request budget (assistant requests per run). Crossing it injects a wrap-up steering notice (see task.softRequestBudgetNotice); at 1.5x the budget the run is force-stopped and the agent must hand back its partial findings. 0 disables the guard. Bundled scout/sonic agents cap out at a lower built-in budget, so a value below that cap still applies to them. A task.agentSoftRequestBudget entry replaces this budget for the agent it names."
"settings.setting.task.softRequestBudgetNotice.label" = "Soft Request Budget Notice"
"settings.setting.task.softRequestBudgetNotice.description" = "Inject one steering notice when a subagent crosses its soft request budget, asking it to wrap up before the 1.5x forced-yield stop."
"settings.setting.task.maxEffort.label" = "Legacy Per-Spawn Effort Ceiling"
"settings.setting.task.maxEffort.description" = "Only in legacy effort mode: cap coarse per-spawn effort hints and per-call model effort. Explicit levels are clamped to the highest supported effort at or below this ceiling; per-call models with no supported effort at or below it are refused. Cold revival re-applies the cap. Replacement mode uses per-model effort rules instead."
"settings.setting.task.prewalk.label" = "Generic Task Prewalk"
"settings.setting.task.prewalk.description" = "Arm prewalk for the bundled generic `task` subagent: it starts on its resolved model, plans and begins the implementation, then hands off to the 'smol' role at its first edit/write. Per-agent overrides (task.agentPrewalk, configured from the /agents hub) and user agent `prewalk` frontmatter apply regardless of this toggle."
"settings.setting.task.showResolvedModelBadge.label" = "Show Resolved Model Badge"
"settings.setting.task.showResolvedModelBadge.description" = "Display the actual model ID used by each subagent in the task widget status line"
"settings.setting.stt.enabled.label" = "Speech-to-Text"
"settings.setting.stt.enabled.description" = "Enable speech-to-text input via microphone"
"settings.setting.stt.submitTrigger.label" = "Speech-to-Text Submit Trigger"
"settings.setting.stt.submitTrigger.description" = "Choose when speech dictation automatically submits: Never, Release (2+ words), Release with complete sentence, or When I Say Submit."
"settings.setting.stt.wake.enabled.label" = "Wake-word listening"
"settings.setting.stt.wake.enabled.description" = "Listen locally for computer, then record and submit a complete request. Off closes the wake microphone."
"settings.setting.stt.wake.silenceMs.label" = "Wake silence timeout"
"settings.setting.stt.wake.silenceMs.description" = "Milliseconds of silence ending a spoken request, clamped to 200–30000."
"settings.setting.stt.wake.speechSensitivity.label" = "Wake request speech sensitivity"
"settings.setting.stt.wake.speechSensitivity.description" = "After the chirp, High keeps quieter speech from counting as silence, but background noise may delay submission. Low rejects more noise. Normal preserves the existing threshold. Does not change wake-word detection or manual dictation."
"settings.setting.stt.wake.cancelMs.label" = "Wake misactivation timeout"
"settings.setting.stt.wake.cancelMs.description" = "Cancel without submitting if no speech follows the chirp, clamped to 2000–5000 ms."
"settings.setting.stt.wake.endWord.label" = "Wake end word"
"settings.setting.stt.wake.endWord.description" = "Optional spoken word ending a request. Empty uses silence only. Recognized locally; removed before submission."
"settings.setting.stt.wake.chirpPath.label" = "Wake chirp sound"
"settings.setting.stt.wake.chirpPath.description" = "Path to a PCM16 mono WAV activation sound. Empty plays a generated short tone; no recording is bundled."
"settings.setting.stt.wake.continueChirpPath.label" = "Wake continuation sound"
"settings.setting.stt.wake.continueChirpPath.description" = "Path to a PCM16 mono WAV, at most two seconds, played when speech capture ends and transcription starts. Empty is silent."
"settings.setting.stt.wake.endChirpPath.label" = "Wake end sound"
"settings.setting.stt.wake.endChirpPath.description" = "Path to a PCM16 mono WAV, at most two seconds, played when transcription succeeds, before submitting the transcript. Empty is silent."
"settings.setting.stt.wake.suppressWhileSpeaking.label" = "Suppress wake word while speaking"
"settings.setting.stt.wake.suppressWhileSpeaking.description" = "On prevents NeoPi's own speech triggering the wake word through speakers. Off lets you interrupt by saying \"computer\", but needs headphones or echo cancellation."
"settings.setting.stt.wake.playbackTailMs.label" = "Wake playback echo tail"
"settings.setting.stt.wake.playbackTailMs.description" = "With wake suppression enabled, ignore microphone audio for this many milliseconds after assistant speech. Clamped to 0–3000. The readiness chirp has no tail delay."
"settings.setting.chat.mode.label" = "Chat Mode"
"settings.setting.chat.mode.description" = "Default mode for new sessions. Chat modes strip coding-agent context (tools, skills, rules, memory, reminders); --chat overrides, resumed sessions keep their recorded mode"
"settings.setting.chat.include.label" = "Chat Mode Includes"
"settings.setting.memory.backend.label" = "Memory Backend"
"settings.setting.memory.backend.description" = "Off, local summary pipeline, Mnemopi SQLite, Hindsight remote memory, or Sharpshooter"
"settings.setting.hindsight.apiUrl.label" = "Hindsight API URL"
"settings.setting.hindsight.apiUrl.description" = "Hindsight server URL (Cloud or self-hosted)"
"settings.setting.hindsight.apiToken.label" = "Hindsight API Token"
"settings.setting.hindsight.apiToken.description" = "Bearer token for authenticated Hindsight servers"
"settings.setting.hindsight.bankId.label" = "Hindsight Bank ID"
"settings.setting.hindsight.bankId.description" = "Memory bank identifier (default: project name)"
"settings.setting.hindsight.scoping.label" = "Hindsight Scoping"
"settings.setting.hindsight.scoping.description" = "global = one shared bank; per-project = isolated bank per cwd; per-project-tagged = shared bank with project tags so global + project memories merge on recall"
"settings.setting.hindsight.globalScope.label" = "Hindsight Global Scope"
"settings.setting.hindsight.globalScope.description" = "Let retain and learn take scope: global, which stores a memory without the project tag so every project recalls it. Needs global or per-project-tagged scoping"
"settings.setting.hindsight.autoRecall.label" = "Hindsight Auto Recall"
"settings.setting.hindsight.autoRecall.description" = "Recall memories on the first turn of each session"
"settings.setting.hindsight.autoRetain.label" = "Hindsight Auto Retain"
"settings.setting.hindsight.autoRetain.description" = "Retain transcript every N turns and at session boundaries"
"settings.setting.hindsight.retainMode.label" = "Hindsight Retain Mode"
"settings.setting.hindsight.retainMode.description" = "full-session = upsert one document per session, last-turn = chunked"
"settings.setting.hindsight.mentalModelsEnabled.label" = "Hindsight Mental Models"
"settings.setting.hindsight.mentalModelsEnabled.description" = "Read curated reflect summaries (mental models) into developer instructions at boot. Loads existing models on the bank — does not write. Pair with hindsight.mentalModelAutoSeed to also auto-create the built-in seed set."
"settings.setting.hindsight.mentalModelAutoSeed.label" = "Hindsight Mental Model Auto-Seed"
"settings.setting.hindsight.mentalModelAutoSeed.description" = "At session start, create any built-in mental models (project-conventions, project-decisions, user-preferences) that do not yet exist on the bank."
"settings.setting.lsp.enabled.label" = "LSP"
"settings.setting.lsp.enabled.description" = "Language-server integration: the lsp tool, diagnostics on write/edit, and format on write (--no-lsp disables for the run)"
"settings.setting.lsp.lazy.label" = "Lazy LSP Startup"
